"nɔɛl","Christmas")},{letter:"à",name:"a accent grave",ipa:"a aksɑ̃ ɡʁav",sounds:"the same a",vsEnglish:"The sound does not change. It tells à, to, apart from a, has.",vsNepali:"आ.",example:p("à Paris","a paʁi","in Paris")},{letter:"â",name:"a accent circonflexe",ipa:"a aksɑ̃ siʁkɔ̃flɛks",sounds:"a, sometimes a little deeper",vsEnglish:"Most speakers say it like a normal a.",vsNepali:"आ.",example:p("le gâteau","lə ɡato","the cake")},{letter:"ô",name:"o accent circonflexe",ipa:"o aksɑ̃ siʁkɔ̃flɛks",sounds:"closed o",vsEnglish:"A pure, tight o.",vsNepali:"ओ, never ऑ.",example:p("l'hôtel","lotɛl","the hotel")},{letter:"î, û",name:"i et u accent circonflexe",ipa:"i e y aksɑ̃ siʁkɔ̃flɛks",sounds:"no change",vsEnglish:"The sound stays the same, the hat is a spelling memory.",vsNepali:"ई and यु as usual.",example:p("l'île","lil","the island")},{letter:"ù",name:"u accent grave",ipa:"y aksɑ̃ ɡʁav",sounds:"only in où",vsEnglish:"Used in one word, où, where, to tell it apart from ou, or.",vsNepali:"ऊ in où.",example:p("Où es-tu ?","u ɛty ?","Where are you?")},{letter:"ç",name:"c cédille",ipa:"se sedij",sounds:"always s",vsEnglish:"A c that sounds like s even before a, o or u.",vsNepali:"स.",example:p("le garçon","lə ɡaʁsɔ̃","the boy")},{letter:"œ",name:"e dans l'o",ipa:"ə dɑ̃ lo",sounds:"the open eu",vsEnglish:"No English match. A relaxed sound between the u of fur and the e of bed, with rounded lips.",vsNepali:"अ with rounded lips.",example:p("la sœur","la sœʁ","the sister")}],pp=[{id:"nasal",title:"Nasal vowels",rule:"French has four vowels said through the nose and the mouth at once. They are spelled with n or m after a vowel, but that n or m is not pronounced. The Devanagari marks them with ँ.",tip:"Say आ and let air escape through your nose. If your tongue touches the roof of your mouth for an n, you have gone too far.",examples:[p("le temps","lə tɑ̃","time, weather"),p("le pain","lə pɛ̃","bread"),p("bon","bɔ̃","good"),p("un","œ̃","one, a"),p("Ils sont contents.","il sɔ̃ kɔ̃tɑ̃.","They are happy.")]},{id:"u-ou",title:"u and ou",rule:"ou is the ordinary ऊ. u is a sound English and Nepali do not have: say ई, keep the tongue exactly there, and round the lips tightly. Mixing the two changes the word.",tip:"Whisper ई, then push your lips forward as if to whistle without moving your tongue.",examples:[p("vous, vu","vu, vy","you, seen"),p("tout, tu","tu, ty","all, you"),p("dessous, dessus","dəsu, dəsy","under, on top"),p("la roue, la rue","la ʁu, la ʁy","the wheel, the street")]},{id:"r",title:"The French R",rule:"The French r is made at the back of the throat, where you would gargle, near the place of ग़. The tip of the tongue stays down behind the bottom teeth. This app writes it ऱ.",tip:"Start from क, then loosen it until air rubs through instead of stopping. Practise with Paris, rouge and merci.",examples:[p("rouge","ʁuʒ","red"),p("Paris","paʁi","Paris"),p("merci","mɛʁsi","thank you"),p("trois","tʁwa","three"),p("Bonjour, Robert.","bɔ̃ʒuʁ, ʁɔbɛʁ.","Hello, Robert.")]},{id:"silent",title:"Silent final letters",rule:"Most final consonants are silent, and so is a final e. The verb ending -ent is always silent. The letters c, r, f and l are often pronounced at the end, remember them as CaReFuL. Faded letters on screen are the ones you do not say.",tip:"The -er of verbs is the big exception to CaReFuL: parler ends in ए, with no r.",examples:[p("beaucou(p)","boku","a lot"),p("ils parl(ent)","il paʁl","they speak"),p("gran(d)","ɡʁɑ̃","big"),p("avec","avɛk","with"),p("neuf","nœf","nine, new"),p("parle(r)","paʁle","to speak")]},{id:"liaison",title:"Liaison",rule:"A silent final consonant comes back to life when the next word starts with a vowel or a silent h, and the two words are said as one. s and x sound as z, d sounds as t. The tie ‿ shows where it happens.",tip:"Never after et, and never before an aspirated h: les héros is ले एऱो.",examples:[p("les‿amis","lezami","the friends"),p("vous‿avez","vuzave","you have"),p("un‿ami","œ̃nami","a friend"),p("deux‿heures","døzœʁ","two o'clock"),p("un grand‿homme","œ̃ ɡʁɑ̃tɔm","a great man")]},{id:"elision",title:"Elision",rule:"Small words ending in a vowel drop it before another vowel and take an apostrophe: le, la, je, me, te, se, de, ne and que. si becomes s' only before il and ils.",examples:[p("l'homme","lɔm","the man"),p("j'ai","ʒe","I have"),p("c'est","sɛ","it is"),p("qu'il","kil","that he"),p("s'il vous plaît","sil vu plɛ","please")]},{id:"light-e",title:"The light e that disappears",rule:"An e with no accent at the end of a syllable is a very light अ, and French drops it whenever it can. Inside a word or a phrase it disappears when only one consonant is said before it, and stays when dropping it would put three consonants together.",tip:"This is the main thing that makes beginners sound like they are reading. Drop it and you sound fluent.",examples:[p("samedi","samdi","Saturday"),p("maintenant","mɛ̃tnɑ̃","now"),p("la fenêtre","la fnɛtʁ","the window"),p("vendredi","vɑ̃dʁədi","Friday, the e stays"),p("Je ne sais pas.","ʒən sɛ pa.","I do not know.")]},{id:"eu",title:"The two eu sounds",rule:"eu has two sounds. Closed at the end of a word or before a z sound: say ए with rounded lips, written अ॓. Open before a pronounced consonant: a relaxed अ.",examples:[p("deux","dø","two"),p("peu","pø","little"),p("heureuse","œʁøz","happy, feminine"),p("la fleur","la flœʁ","the flower"),p("la sœur","la sœʁ","the sister")]},{id:"oi-gn",title:"oi and gn",rule:"oi is always वा. gn is ञ, like the ny in canyon. ill after a vowel is usually य.",examples:[p("moi","mwa","me"),p("la voiture","la vwatyʁ","the car"),p("la montagne","la mɔ̃taɲ","the mountain"),p("la campagne","la kɑ̃paɲ","the countryside"),p("le travail","lə tʁavaj","the work")]},{id:"rhythm",title:"Stress and rhythm",rule:"French words have no stressed syllable. Every syllable gets the same length and force, and only the last syllable of a group is a little longer. Say Paris as पा ऱी, evenly, not PA-ris.",tip:"Think of a sentence as a line of equal beads with a slightly bigger bead at the end.",examples:[p("Paris","paʁi","Paris"),p("la photographie","la fɔtɔɡʁafi","photography"),p("Je voudrais un café.","ʒə vudʁɛ œ̃ kafe.","I would like a coffee."),p("C'est‿impossible.","sɛtɛ̃pɔsibl.","It is impossible.")]}],Wr=[{id:"0-20",title:"0 to 20",intro:"Learn these by heart, everything else is built from them.",items:[{value:"0",fr:"zéro",ipa:"zeʁo"},{value:"1",fr:"un, une",ipa:"œ̃, yn",note:"une before a feminine noun"},{value:"2",fr:"deu(x)",ipa:"dø"},{value:"3",fr:"troi(s)",ipa:"tʁwa"},{value:"4",fr:"quatre",ipa:"katʁ"},{value:"5",fr:"cinq",ipa:"sɛ̃k"},{value:"6",fr:"six",ipa:"sis",note:"si before a consonant: six livres, सी लीभ्ऱ"},{value:"7",fr:"sept",ipa:"sɛt",note:"the p is silent"},{value:"8",fr:"huit",ipa:"ɥit"},{value:"9",fr:"neuf",ipa:"nœf"},{value:"10",fr:"dix",ipa:"dis"},{value:"11",fr:"onze",ipa:"ɔ̃z"},{value:"12",fr:"douze",ipa:"duz"},{value:"13",fr:"treize",ipa:"tʁɛz"},{value:"14",fr:"quatorze",ipa:"katɔʁz"},{value:"15",fr:"quinze",ipa:"kɛ̃z"},{value:"16",fr:"seize",ipa:"sɛz"},{value:"17",fr:"dix-sept",ipa:"disɛt"},{value:"18",fr:"dix-huit",ipa:"dizɥit"},{value:"19",fr:"dix-neuf",ipa:"diznœf"},{value:"20",fr:"ving(t)",ipa:"vɛ̃"}]},{id:"tens",title:"21 to 69",intro:"Tens work as in English. Only 21, 31, 41, 51 and 61 use et, and.",items:[{value:"21",fr:"vingt‿et un",ipa:"vɛ̃teœ̃"},{value:"22",fr:"vingt-deux",ipa:"vɛ̃tdø",note:"the t of vingt is said from 21 to 29"},{value:"30",fr:"trente",ipa:"tʁɑ̃t"},{value:"40",fr:"quarante",ipa:"kaʁɑ̃t"},{value:"50",fr:"cinquante",ipa:"sɛ̃kɑ̃t"},{value:"60",fr:"soixante",ipa:"swasɑ̃t",note:"the x sounds as s"},{value:"65",fr:"soixante-cinq",ipa:"swasɑ̃tsɛ̃k"}]},{id:"70-99",title:"70, 80 and 90",intro:"The awkward ones. 70 is sixty ten, 80 is four twenties, 90 is four twenties ten. Belgium and Switzerland say septante and nonante instead.",items:[{value:"70",fr:"soixante-dix",ipa:"swasɑ̃tdis",note:"sixty ten"},{value:"71",fr:"soixante‿et onze",ipa:"swasɑ̃teɔ̃z",note:"sixty and eleven"},{value:"75",fr:"soixante-quinze",ipa:"swasɑ̃tkɛ̃z",note:"sixty fifteen"},{value:"80",fr:"quatre-vingt(s)",ipa:"katʁəvɛ̃",note:"four twenties"},{value:"81",fr:"quatre-vingt-un",ipa:"katʁəvɛ̃œ̃",note:"no et here, and no s on vingt"},{value:"90",fr:"quatre-vingt-dix",ipa:"katʁəvɛ̃dis",note:"four twenties ten"},{value:"99",fr:"quatre-vingt-dix-neuf",ipa:"katʁəvɛ̃diznœf"}]},{id:"big",title:"100 to a billion",intro:"cent takes an s only when it is multiplied and ends the number. mille never changes.",items:[{value:"100",fr:"cen(t)",ipa:"sɑ̃"},{value:"101",fr:"cent un",ipa:"sɑ̃œ̃"},{value:"200",fr:"deux cent(s)",ipa:"dø sɑ̃"},{value:"1 000",fr:"mille",ipa:"mil"},{value:"2 000",fr:"deux mille",ipa:"dø mil"},{value:"1 000 000",fr:"un million",ipa:"œ̃ miljɔ̃"},{value:"1 000 000 000",fr:"un milliar(d)",ipa:"œ̃ miljaʁ"}]}],gp=[{fr:"bonjour",ipa:"bɔ̃ʒuʁ",pos:"interjection",en:"hello, good morning",level:"A1",theme:"basics",ex:p("Bonjour, madame.","bɔ̃ʒuʁ, madam.","Hello, madam.")},{fr:"merci",ipa:"mɛʁsi",pos:"interjection",en:"thank you",level:"A1",theme:"basics",ex:p("Merci beaucoup.","mɛʁsi boku.","Thank you very much.")},{fr:"oui",ipa:"wi",pos:"adverb",en:"yes",level:"A1",theme:"basics",ex:p("Oui, bien sûr.","wi, bjɛ̃ syʁ.","Yes, of course.")},{fr:"non",ipa:"nɔ̃",pos:"adverb",en:"no",level:"A1",theme:"basics",ex:p("Non, merci.","nɔ̃, mɛʁsi.","No, thank you.")},{fr:"la maison",ipa:"la mɛzɔ̃",pos:"noun",gender:"f",en:"house, home",level:"A1",theme:"home",ex:p("Nous rentrons à la maison.","nu ʁɑ̃tʁɔ̃ a la mɛzɔ̃.","We are going home.")},{fr:"l'ami",ipa:"lami",pos:"noun",gender:"m",en:"friend",level:"A1",theme:"people",ex:p("C'est mon‿ami Paul.","sɛ mɔ̃nami pɔl.","This is my friend Paul.")},{fr:"la famille",ipa:"la famij",pos:"noun",gender:"f",en:"family",level:"A1",theme:"family",ex:p("Ma famille habite à Katmandou.","ma famij abit a katmandu.","My family lives in Kathmandu.")},{fr:"le père",ipa:"lə pɛʁ",pos:"noun",gender:"m",en:"father",level:"A1",theme:"family",ex:p("Mon père est médecin.","mɔ̃ pɛʁ ɛ medsɛ̃.","My father is a doctor.")},{fr:"la mère",ipa:"la mɛʁ",pos:"noun",gender:"f",en:"mother",level:"A1",theme:"family",ex:p("Ma mère parle trois langues.","ma mɛʁ paʁl tʁwa lɑ̃ɡ.","My mother speaks three languages.")},{fr:"le frère",ipa:"lə fʁɛʁ",pos:"noun",gender:"m",en:"brother",level:"A1",theme:"family",ex:p("J'ai un frère.","ʒe œ̃ fʁɛʁ.","I have a brother.")},{fr:"la sœur",ipa:"la sœʁ",pos:"noun",gender:"f",en:"sister",level:"A1",theme:"family",ex:p("Ma sœur a vingt‿ans.","ma sœʁ a vɛ̃tɑ̃.","My sister is twenty.")},{fr:"l'eau",ipa:"lo",pos:"noun",gender:"f",en:"water",level:"A1",theme:"food",ex:p("Un verre d'eau, s'il vous plaît.","œ̃ vɛʁ do, sil vu plɛ.","A glass of water, please.")},{fr:"le pain",ipa:"lə pɛ̃",pos:"noun",gender:"m",en:"bread",level:"A1",theme:"food",ex:p("J'achète du pain.","ʒaʃɛt dy pɛ̃.","I am buying bread.")},{fr:"le café",ipa:"lə kafe",pos:"noun",gender:"m",en:"coffee, café",level:"A1",theme:"food",ex:p("Un café, s'il vous plaît.","œ̃ kafe, sil vu plɛ.","A coffee, please.")},{fr:"le fromage",ipa:"lə fʁɔmaʒ",pos:"noun",gender:"m",en:"cheese",level:"A1",theme:"food",ex:p("La France a beaucoup de fromages.","la fʁɑ̃s a boku də fʁɔmaʒ.","France has a lot of cheeses.")},{fr:"la pomme",ipa:"la pɔm",pos:"noun",gender:"f",en:"apple",level:"A1",theme:"food",ex:p("Je mange une pomme.","ʒə mɑ̃ʒ yn pɔm.","I am eating an apple.")},{fr:"le livre",ipa:"lə livʁ",pos:"noun",gender:"m",en:"book",level:"A1",theme:"school",ex:p("Ce livre est‿intéressant.","sə livʁ ɛtɛ̃teʁesɑ̃.","This book is interesting.")},{fr:"l'école",ipa:"lekɔl",pos:"noun",gender:"f",en:"school",level:"A1",theme:"school",ex:p("Les‿enfants vont à l'école.","lezɑ̃fɑ̃ vɔ̃ a lekɔl.","The children go to school.")},{fr:"la ville",ipa:"la vil",pos:"noun",gender:"f",en:"town, city",level:"A1",theme:"city",ex:p("Paris est‿une grande ville.","paʁi ɛtyn ɡʁɑ̃d vil.","Paris is a big city.")},{fr:"la rue",ipa:"la ʁy",pos:"noun",gender:"f",en:"street",level:"A1",theme:"city",ex:p("J'habite dans cette rue.","ʒabit dɑ̃ sɛt ʁy.","I live on this street.")},{fr:"le train",ipa:"lə tʁɛ̃",pos:"noun",gender:"m",en:"train",level:"A1",theme:"travel",ex:p("Le train part à huit‿heures.","lə tʁɛ̃ paʁ a ɥitœʁ.","The train leaves at eight.")},{fr:"la gare",ipa:"la ɡaʁ",pos:"noun",gender:"f",en:"train station",level:"A1",theme:"travel",ex:p("Où est la gare ?","u ɛ la ɡaʁ ?","Where is the station?")},{fr:"le jour",ipa:"lə ʒuʁ",pos:"noun",gender:"m",en:"day",level:"A1",theme:"time",ex:p("Je travaille tous les jours.","ʒə tʁavaj tu le ʒuʁ.","I work every day.")},{fr:"la nuit",ipa:"la nɥi",pos:"noun",gender:"f",en:"night",level:"A1",theme:"time",ex:p("Bonne nuit !","bɔn nɥi !","Good night!")},{fr:"aujourd'hui",ipa:"oʒuʁdɥi",pos:"adverb",en:"today",level:"A1",theme:"time",ex:p("Aujourd'hui, c'est lundi.","oʒuʁdɥi, sɛ lœ̃di.","Today is Monday.")},{fr:"toujours",ipa:"tuʒuʁ",pos:"adverb",en:"always, still",level:"A1",theme:"time",ex:p("Il est toujours en retard.","ilɛ tuʒuʁ ɑ̃ ʁətaʁ.","He is always late.")},{fr:"le temps",ipa:"lə tɑ̃",pos:"noun",gender:"m",en:"time, weather",level:"A1",theme:"weather",ex:p("Quel temps fait-il ?","kɛl tɑ̃ fɛtil ?","What is the weather like?")},{fr:"le soleil",ipa:"lə sɔlɛj",pos:"noun",gender:"m",en:"sun",level:"A1",theme:"weather",ex:p("Le soleil brille.","lə sɔlɛj bʁij.","The sun is shining.")},{fr:"la pluie",ipa:"la plɥi",pos:"noun",gender:"f",en:"rain",level:"A1",theme:"weather",ex:p("J'aime la pluie.","ʒɛm la plɥi.","I like the rain.")},{fr:"la tête",ipa:"la tɛt",pos:"noun",gender:"f",en:"head",level:"A1",theme:"body",ex:p("J'ai mal à la tête.","ʒe mal a la tɛt.","I have a headache.")},{fr:"la main",ipa:"la mɛ̃",pos:"noun",gender:"f",en:"hand",level:"A1",theme:"body",ex:p("Lave-toi les mains.","lav twa le mɛ̃.","Wash your hands.")},{fr:"l'œil",ipa:"lœj",pos:"noun",gender:"m",plural:{fr:"les‿yeux",ipa:"lezjø"},en:"eye",level:"A1",theme:"body",ex:p("Elle a les‿yeux verts.","ɛla lezjø vɛʁ.","She has green eyes.")},{fr:"le médecin",ipa:"lə medsɛ̃",pos:"noun",gender:"m",en:"doctor",level:"A1",theme:"health",ex:p("Je dois voir le médecin.","ʒə dwa vwaʁ lə medsɛ̃.","I need to see the doctor.")},{fr:"le travail",ipa:"lə tʁavaj",pos:"noun",gender:"m",plural:{fr:"les travaux",ipa:"le tʁavo"},en:"work, job",level:"A1",theme:"work",ex:p("Je vais au travail.","ʒə vɛ o tʁavaj.","I am going to work.")},{fr:"le téléphone",ipa:"lə telefɔn",pos:"noun",gender:"m",en:"phone",level:"A1",theme:"technology",ex:p("Mon téléphone ne marche pas.","mɔ̃ telefɔn nə maʁʃ pa.","My phone is not working.")},{fr:"l'ordinateur",ipa:"lɔʁdinatœʁ",pos:"noun",gender:"m",en:"computer",level:"A1",theme:"technology",ex:p("J'ai un nouvel‿ordinateur.","ʒe œ̃ nuvɛlɔʁdinatœʁ.","I have a new computer.")},{fr:"la montagne",ipa:"la mɔ̃taɲ",pos:"noun",gender:"f",en:"mountain",level:"A1",theme:"nature",ex:p("Le Népal a de très hautes montagnes.","lə nepal a də tʁɛ ot mɔ̃taɲ.","Nepal has very high mountains.")},{fr:"l'arbre",ipa:"laʁbʁ",pos:"noun",gender:"m",en:"tree",level:"A1",theme:"nature",ex:p("Il y a un‿arbre devant la maison.","ilja œ̃naʁbʁ dəvɑ̃ la mɛzɔ̃.","There is a tree in front of the house.")},{fr:"le chat",ipa:"lə ʃa",pos:"noun",gender:"m",en:"cat",level:"A1",theme:"nature",ex:p("Le chat dort sur le lit.","lə ʃa dɔʁ syʁ lə li.","The cat is sleeping on the bed.")},{fr:"la chemise",ipa:"la ʃəmiz",pos:"noun",gender:"f",en:"shirt",level:"A1",theme:"clothes",ex:p("Cette chemise est trop grande.","sɛt ʃəmiz ɛ tʁo ɡʁɑ̃d.","This shirt is too big.")},{fr:"heureux",ipa:"œʁø",pos:"adjective",fem:{fr:"heureuse",ipa:"œʁøz"},en:"happy",level:"A1",theme:"emotions",ex:p("Je suis très‿heureux.","ʒə sɥi tʁɛzœʁø.","I am very happy.")},{fr:"triste",ipa:"tʁist",pos:"adjective",en:"sad",level:"A1",theme:"emotions",ex:p("Pourquoi es-tu triste ?","puʁkwa ɛty tʁist ?","Why are you sad?")},{fr:"grand",ipa:"ɡʁɑ̃",pos:"adjective",fem:{fr:"grande",ipa:"ɡʁɑ̃d"},en:"big, tall",level:"A1",theme:"basics",ex ame time. That is why every noun in this app is shown with le, la or l' and a gender tag.",examples:[p("le livre","lə livʁ","the book, masculine"),p("la table","la tabl","the table, feminine"),p("un garçon et une fille","œ̃ ɡaʁsɔ̃ e yn fij","a boy and a girl"),p("l'ami, l'amie","lami, lami","the friend, male and female, said the same"),p("les‿enfants","lezɑ̃fɑ̃","the children")],mistakes:[{wrong:"le table",right:"la table",note:"Guessing the gender from English. Always learn the article with the noun."},{wrong:"le ami",right:"l'ami",note:"le and la drop their vowel before a vowel sound."},{wrong:"les amis, said ले आमी",right:"les‿amis, said लेज़ामी",note:"The s of les comes back as z before a vowel."}],exceptions:["Some endings are good clues. Nouns ending in -tion, -sion, -té and -ure are almost always feminine: la nation, la liberté, la voiture.","Nouns ending in -ment, -age and -isme are almost always masculine: le moment, le fromage. But la page, la plage and l'image are feminine, so the clue is a guide, not a law."]},{id:"adjective-place",title:"Adjectives usually come after the noun",level:"A1",topic:"Adjectives",rule:"Most French adjectives follow the noun: une voiture rouge, a red car. The adjective also agrees with the noun, adding -e for feminine and -s for plural, even when that changes nothing in speech.",why:"French puts the thing first and the description after it. A small group of very common adjectives goes before the noun instead. Remember them as BAGS: Beauty (beau, joli), Age (jeune, vieux, nouveau), Goodness (bon, mauvais) and Size (grand, petit).",examples:[p("une voiture rouge","yn vwatyʁ ʁuʒ","a red car"),p("un film‿intéressant","œ̃ filmɛ̃teʁesɑ̃","an interesting film"),p("une petite maison","yn pətit mɛzɔ̃","a small house"),p("un bon restaurant","œ̃ bɔ̃ ʁɛstɔʁɑ̃","a good restaurant"),p("des fleurs blanches","de flœʁ blɑ̃ʃ","white flowers")],mistakes:[{wrong:"une rouge voiture",right:"une voiture rouge",note:"Colours always come after the noun."},{wrong:"une maison petit",right:"une petite maison",note:"petit is a BAGS adjective. It goes first and agrees with maison."}],exceptions:["Some adjectives change meaning with their place. un grand homme is a great man, un homme grand is a tall man.","mon ancien professeur is my former teacher, un bâtiment ancien is an old building."]},{id:"negation",title:"Saying no with ne ... pas",level:"A1",topic:"Negation",rule:"To make a verb negative, put ne before it and pas after it. Je parle, I speak. Je ne parle pas, I do not speak. ne becomes n' before a vowel.",why:"French wraps the verb in two pieces. In compound tenses the two pieces go around the helper verb: je n'ai pas mangé. In everyday speech French people drop the ne almost every time, so you will hear je parle pas. Write the ne, but do not expect to hear it.",examples:[p("Je ne parle pas‿anglais.","ʒən paʁl pazɑ̃ɡlɛ.","I do not speak English."),p("Il n'aime pas le café.","il nɛm pa lə kafe.","He does not like coffee."),p("Nous n'avons pas mangé.","nu navɔ̃ pa mɑ̃ʒe.","We have not eaten."),p("Ce n'est pas grave.","sə nɛ pa ɡʁav.","It does not matter."),p("Je sais pas.","ʃɛ pa.","I do not know, everyday speech")],mistakes:[{wrong:"Je pas parle.",right:"Je ne parle pas.",note:"pas goes after the verb, not before it."},{wrong:"Je ne ai pas faim.",right:"Je n'ai pas faim.",note:"ne becomes n' before a vowel."},{wrong:"Je n'ai mangé pas.",right:"Je n'ai pas mangé.",note:"In compound tenses ne and pas go around avoir or être."}],exceptions:["Other words can take the place of pas: ne ... jamais, never. ne ... plus, no longer. ne ... rien, nothing. ne ... personne, nobody.","After a negative, un, une and des become de: j'ai un chien, je n'ai pas de chien."]}],bp=/^[aɑeɛioɔuyøœəɥ]/;function Us(r){return bp.test(r.normalize("NFD"))}function xp(r,c){return/[pbtdkɡgfvszʃʒmnɲlʁj]$/.test(r)&&Us(c)?r+c:r+" "+c}function Ir(r,[c,d],o=!1){const m=Us(d);let j;switch(r){case 0:j=m?{fr:"j'"+c,ipa:"ʒ"+d}:{fr:"je "+c,ipa:"ʒə "+d};b
