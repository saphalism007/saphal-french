k","Vous‿avez cinq minutes ?","vuzave sɛ̃ minyt ?","Do you have five minutes?","formal","The polite way to ask for a quick word.","A1"),y("Work","Je vous‿envoie le rapport ce soir.","ʒə vuzɑ̃vwa lə ʁapɔʁ sə swaʁ.","I will send you the report tonight.","formal","The present for a near plan.","A2"),y("Work","Pouvez-vous me rappeler demain ?","puve vu mə ʁaple dəmɛ̃ ?","Could you call me back tomorrow?","formal","Inversion sounds polite and professional.","A2"),y("Work","Je suis‿en télétravail aujourd'hui.","ʒə sɥizɑ̃ teletʁavaj oʒuʁdɥi.","I am working from home today.","neutral","le télétravail, remote work.","A2"),y("Work","Quel est le délai ?","kɛlɛ lə delɛ ?","What is the deadline?","neutral","le délai, the time allowed.","A2"),y("Work","C'est noté.","sɛ nɔte.","Noted.","neutral","A short way to confirm you have understood.","A2"),y("Work","Je suis d'accord avec vous.","ʒə sɥi dakɔʁ avɛk vu.","I agree with you.","formal","In a meeting.","A1"),y("Work","Bonne fin de journée !","bɔn fɛ̃ də ʒuʁne !","Have a good rest of the day!","neutral","The usual goodbye in the afternoon at work.","A1"),y("Work","Cordialement","kɔʁdjalmɑ̃","Kind regards","formal","The standard ending for a work email.","A2"),y("Work","Je vous remercie pour votre‿aide.","ʒə vu ʁəmɛʁsi puʁ vɔtʁɛd.","Thank you for your help.","formal","remercier, a formal way to thank.","A2"),y("Work","Je suis‿en retard, désolé.","ʒə sɥizɑ̃ ʁətaʁ, dezɔle.","Sorry, I am running late.","neutral","Send it before the meeting starts.","A1")],fy=["Greetings","Learning French","Small talk","Opinions","Plans","Home","Restaurant","Shopping","Directions","Transport","Hotel","Time and weather","Bank and post","Doctor","Emergencies","Phone","Work"],Af=[...[{situation:"Greetings",fr:"Bonjour, comment‿allez-vous ?",ipa:"bɔ̃ʒuʁ, kɔmɑ̃talevu ?",en:"Hello, how are you?",register:"formal",use:"With anyone you do not know well, and with older people.",level:"A1"},{situation:"Greetings",fr:"Salut, ça va ?",ipa:"saly, sa va ?",en:"Hi, how is it going?",register:"casual",use:"With friends, family and people your own age.",level:"A1"},{situation:"Greetings",fr:"Ça va bien, merci. Et toi ?",ipa:"sa va bjɛ̃, mɛʁsi. e twa ?",en:"Fine, thanks. And you?",register:"casual",use:"The answer to ça va. Say et vous instead of et toi to someone you call vous.",level:"A1"},{situation:"Greetings",fr:"Enchanté.",ipa:"ɑ̃ʃɑ̃te.",en:"Pleased to meet you.",register:"neutral",use:"When you meet someone for the first time. A woman writes enchantée, it sounds the same.",level:"A1"},{situation:"Greetings",fr:"Je m'appelle Saphal.",ipa:"ʒə mapɛl safal.",en:"My name is Saphal.",register:"neutral",use:"Introducing yourself in any situation.",level:"A1"},{situation:"Greetings",fr:"Bonne journée !",ipa:"bɔn ʒuʁne !",en:"Have a nice day!",register:"neutral",use:"When leaving a shop or saying goodbye during the day. In the evening, bonne soirée.",level:"A1"},{situation:"Restaurant",fr:"Une table pour deux, s'il vous plaît.",ipa:"yn tabl puʁ dø, sil vu plɛ.",en:"A table for two, please.",register:"neutral",use:"Arriving at a restaurant.",level:"A1"},{situation:"Restaurant",fr:"Qu'est-ce que vous me conseillez ?",ipa:"kɛskə vu mə kɔ̃seje ?",en:"What do you recommend?",register:"formal",use:"Asking the waiter for advice.",level:"A2"},{situation:"Restaurant",fr:"Je voudrais l'addition, s'il vous plaît.",ipa:"ʒə vudʁɛ ladisjɔ̃, sil vu plɛ.",en:"I would like the bill, please.",register:"formal",use:"With waiters and anyone you do not know. In France the bill only comes when you ask for it.",level:"A1",spoken:{fr:"L'addition, s'il vous plaît.",ipa:"ladisjɔ̃, sil vu plɛ."}},{situation:"Shopping",fr:"Combien ça coûte ?",ipa:"kɔ̃bjɛ̃ sa kut ?",en:"How much does it cost?",register:"neutral",use:"In any shop or market.",level:"A1"},{situation:"Shopping",fr:"Je regarde seulement, merci.",ipa:"ʒə ʁəɡaʁd sœlmɑ̃, mɛʁsi.",en:"I am just looking, thank you.",register:"neutral",use:"When a shop assistant offers to help.",level:"A1"},{situation:"Shopping",fr:"Vous‿acceptez la carte ?",ipa:"vuzaksɛpte la kaʁt ?",en:"Do you take cards?",register:"formal",use:"Before paying in a small shop or market.",level:"A1"},{situation:"Directions",fr:"Excusez-moi, où est la gare ?",ipa:"ɛkskyze mwa, u ɛ la ɡaʁ ?",en:"Excuse me, where is the station?",register:"formal",use:"Stopping a stranger in the street.",level:"A1"},{situation:"Directions",fr:"C'est loin d'ici ?",ipa:"sɛ lwɛ̃ disi ?",en:"Is it far from here?",register:"neutral",use:"After asking for directions.",level:"A1"},{situation:"Directions",fr:"Tournez à gauche, puis tout droit.",ipa:"tuʁne a ɡoʃ, pɥi tu dʁwa.",en:"Turn left, then go straight on.",register:"neutral",use:"What you will hear when you ask the way.",level:"A1"},{situation:"Doctor",fr:"J'ai mal au ventre.",ipa:"ʒe mal o vɑ̃tʁ.",en:"My stomach hurts.",register:"neutral",use:"avoir mal à + body part works for any pain: j'ai mal à la tête, j'ai mal aux dents.",level:"A1"},{situation:"Doctor",fr:"Je suis‿allergique à la pénicilline.",ipa:"ʒə sɥizalɛʁʒik a la penisilin.",en:"I am allergic to penicillin.",register:"neutral",use:"Telling a doctor or pharmacist about an allergy.",level:"A2"},{situation:"Phone",fr:"Allô, c'est Saphal à l'appareil.",ipa:"alo, sɛ safal a lapaʁɛj.",en:"Hello, this is Saphal speaking.",register:"neutral",use:"allô is only used on the phone, never face to face.",level:"A2"},{situation:"Phone",fr:"Pouvez-vous répéter, s'il vous plaît ?",ipa:"puve vu ʁepete, sil vu plɛ ?",en:"Could you repeat that, please?",register:"formal",use:"Whenever you did not catch something.",level:"A1",spoken:{fr:"Pardon ?",ipa:"paʁdɔ̃ ?"}},{situation:"Small talk",fr:"Vous venez d'où ?",ipa:"vu vəne du ?",en:"Where are you from?",register:"formal",use:"Polite small talk with someone new.",level:"A1",spoken:{fr:"Tu viens d'où ?",ipa:"ty vjɛ̃ du ?"}},{situation:"Small talk",fr:"Je viens du Népal.",ipa:"ʒə vjɛ̃ dy nepal.",en:"I come from Nepal.",register:"neutral",use:"du because le Népal is masculine: de + le becomes du.",level:"A1"},{situation:"Work",fr:"Je travaille dans la finance.",ipa:"ʒə tʁavaj dɑ̃ la finɑ̃s.",en:"I work in finance.",register:"neutral",use:"Saying what field you work in.",level:"A1"},{situation:"Work",fr:"On peut se tutoyer ?",ipa:"ɔ̃ pø sə tytwaje ?",en:"Shall we say tu to each other?",register:"neutral",use:"The polite way to move from vous to tu with a colleague.",level:"A2"}],...ry,...cy],kf=[{kind:"spoken",fr:"Ça marche.",ipa:"sa maʁʃ.",en:"That works, okay.",literal:"That walks.",register:"casual",use:"Agreeing to a plan. Very common with friends and in shops.",level:"A1"},{kind:"spoken",fr:"C'est pas grave.",ipa:"sɛ pa ɡʁav.",en:"No worries, it does not matter.",register:"casual",use:"When someone apologises. The ne is dropped, as it nearly always is in speech.",level:"A1"},{kind:"filler",fr:"Du coup",ipa:"dy ku",en:"So, as a result",register:"casual",use:"Heard constantly to link ideas in speech. Avoid it in writing.",level:"A2"},{kind:"filler",fr:"Bref",ipa:"bʁɛf",en:"Anyway, long story short",register:"neutral",use:"To wrap up a story and get to the point.",level:"A2"},{kind:"filler",fr:"Bof",ipa:"bɔf",en:"Meh, not really",register:"casual",use:"A shrug in one word, for something that does not impress you.",level:"A2"},{kind:"slang",fr:"Ouais",ipa:"wɛ",en:"Yeah",register:"casual",use:"The everyday spoken oui among friends.",level:"A1"},{kind:"slang",fr:"Grave !",ipa:"ɡʁav !",en:"Totally! Seriously!",register:"casual",use:"Young people use it to agree strongly: Tu viens ? Grave !",level:"B1"},{kind:"spoken",fr:"Laisse tomber.",ipa:"lɛs tɔ̃be.",en:"Forget it, never mind.",literal:"Let it fall.",register:"casual",use:"To drop a subject or a plan.",level:"A2"},{kind:"spoken",fr:"Tant pis.",ipa:"tɑ̃ pi.",en:"Too bad, never mind.",register:"neutral",use:"Accepting something you cannot change.",level:"A2"},{kind:"idiom",fr:"Il pleut des cordes.",ipa:"il plø de kɔʁd.",en:"It is pouring with rain.",literal:"It is raining ropes.",register:"neutral",use:"Talking about heavy rain.",level:"A2"},{kind:"idiom",fr:"Coûter les‿yeux de la tête",ipa:"kute lezjø də la tɛt",en:"To cost a fortune",literal:"To cost the eyes from the head.",register:"neutral",use:"Ce téléphone coûte les yeux de la tête.",level:"B1"},{kind:"idiom",fr:"Poser un lapin",ipa:"poze œ̃ lapɛ̃",en:"To stand someone up",literal:"To put down a rabbit.",register:"casual",use:"Il m'a posé un lapin, he stood me up.",level:"B1"},{kind:"idiom",fr:"Avoir le cafard",ipa:"avwaʁ lə kafaʁ",en:"To feel down",literal:"To have the cockroach.",register:"casual",use:"J'ai le cafard ce soir, I feel low tonight.",level:"B1"},{kind:"idiom",fr:"Avoir la flemme",ipa:"avwaʁ la flɛm",en:"To not be bothered to do something",register:"casual",use:"J'ai la flemme de cuisiner, I cannot be bothered to cook.",level:"B1"},{kind:"idiom",fr:"Avoir un coup de foudre",ipa:"avwaʁ œ̃ ku də fudʁ",en:"To fall in love at first sight",literal:"To have a strike of lightning.",register:"neutral",use:"Talking about love, or about a place you instantly loved.",level:"B1"},{kind:"idiom",fr:"Être dans la lune",ipa:"ɛtʁ dɑ̃ la lyn",en:"To be daydreaming",literal:"To be in the moon.",register:"neutral",use:"For someone whose mind is elsewhere.",level:"B1"}],dy=[{id:"journee",title:"Ma journée",level:"A1",intro:"A daily routine, with reflexive verbs.",lines:[f("Je me lève à sept‿heures.","ʒə mə lɛv a sɛtœʁ.","I get up at seven."),f("Je prends une douche et je m'habille.","ʒə pʁɑ̃ yn duʃ e ʒə mabij.","I have a shower and get dressed."),f("Au petit-déjeuner, je bois du thé avec du lait.","o pətideʒœne, ʒə bwa dy te avɛk dy lɛ.","At breakfast I drink tea with milk."),f("Je vais au bureau en bus.","ʒə vɛ o byʁo ɑ̃ bys.","I go to the office by bus."),f("Je travaille de neuf‿heures à cinq‿heures.","ʒə tʁavaj də nœvœʁ a sɛ̃kœʁ.","I work from nine to five."),f("Le soir, je cuisine et j'appelle ma famille.","lə swaʁ, ʒə kɥizin e ʒapɛl ma famij.","In the evening I cook and call my family."),f("Je me couche vers onze‿heures.","ʒə mə kuʃ vɛʁ ɔ̃zœʁ.","I go to bed at around eleven.")],notes:["Reflexive verbs describe the routine: je me lève, je m'habille, je me couche.","en bus, en train, en voiture, but à pied and à vélo.","de neuf heures à cinq heures, from nine to five.","There is no elision before onze: vers onze heures, never vers l'onze."]},{id:"famille",title:"Ma famille",level:"A1",intro:"Describing a family, with avoir, être and s'appeler.",lines:[f("J'ai une petite famille.","ʒe yn pətit famij.","I have a small family."),f("Mon père s'appelle Ram et ma mère s'appelle Sita.","mɔ̃ pɛʁ sapɛl ʁam e ma mɛʁ sapɛl sita.","My father is called Ram and my mother is called Sita."),f("J'ai une sœur. Elle a vingt-cinq‿ans.","ʒe yn sœʁ. ɛla vɛ̃tsɛ̃kɑ̃.","I have a sister. She is twenty five."),f("Elle est‿infirmière à Pokhara.","ɛlɛtɛ̃fiʁmjɛʁ a pɔkaʁa.","She is a nurse in Pokhara."),f("Mes grands-parents habitent avec mes parents.","me ɡʁɑ̃paʁɑ̃ abit avɛk me paʁɑ̃.","My grandparents live with my parents."),f("Le dimanche, nous mangeons tous‿ensemble.","lə dimɑ̃ʃ, nu mɑ̃ʒɔ̃ tusɑ̃sɑ̃bl.","On Sundays we all eat together."),f("Ma famille me manque beaucoup.","ma famij mə mɑ̃k boku.","I miss my family a lot.")],notes:["avoir for age: elle a vingt-cinq ans, literally she has twenty five years.","Jobs take no article after être: elle est infirmière.","tous as a pronoun is said with its s: nous mangeons tous, तूस.","Ma famille me manque, literally my family is missing to me, means I miss my family. The order is the reverse of English."]},{id:"weekend-paris",title:"Un week-end à Paris",level:"A2",intro:"A short story in the passé composé.",lines:[f("Le week-end dernier, je suis‿allé à Paris avec des‿amis.","lə wikɛnd dɛʁnje, ʒə sɥizale a paʁi avɛk dezami.","Last weekend I went to Paris with some friends."),f("Nous‿avons pris le train samedi matin.","nuzavɔ̃ pʁi lə tʁɛ̃ samdi matɛ̃.","We took the train on Saturday morning."),f("D'abord, nous‿avons visité le musée d'Orsay.","dabɔʁ, nuzavɔ̃ vizite lə myze dɔʁsɛ.","First we visited the Musée d'Orsay."),f("Ensuite, nous‿avons mangé dans‿un petit restaurant du Marais.","ɑ̃sɥit, nuzavɔ̃ mɑ̃ʒe dɑ̃zœ̃ pəti ʁɛstɔʁɑ̃ dy maʁɛ.","Then we ate in a little restaurant in the Marais."),f("Le soir, nous nous sommes promenés le long de la Seine.","lə swaʁ, nu nu sɔm pʁɔmne lə lɔ̃ də la sɛn.","In the evening we walked along the Seine."),f("Dimanche, il a plu toute la journée, alors nous sommes rentrés tôt.","dimɑ̃ʃ, il a ply tut la ʒuʁne, alɔʁ nu sɔm ʁɑ̃tʁe to.","On Sunday it rained all day, so we came home early."),f("C'était‿un week-end fatigant mais génial !","setɛtœ̃ wikɛnd fatiɡɑ̃ mɛ ʒenjal !","It was a tiring but brilliant weekend!")],notes:["The passé composé tells a series of completed events: nous avons pris, nous avons visité.","aller, rentrer and se promener use être: je suis allé, nous sommes rentrés, nous nous sommes promenés.","D'abord, ensuite, alors: first, then, so. These words give a story its order.","C'était, it was, is the imparfait of être, used for an opinion about the past."]},{id:"quartier",title:"Mon quartier",level:"A2",intro:"Describing where you live, with il y a and y.",lines:[f("J'habite dans‿un quartier calme, près du centre-ville.","ʒabit dɑ̃zœ̃ kaʁtje kalm, pʁɛ dy sɑ̃tʁəvil.","I live in a quiet area, near the town centre."),f("Au coin de ma rue, il y a une boulangerie et une pharmacie.","o kwɛ̃ də ma ʁy, ilja yn bulɑ̃ʒʁi e yn faʁmasi.","On the corner of my street there is a bakery and a pharmacy."),f("Le mardi et le samedi, il y a un marché sur la place.","lə maʁdi e lə samdi, ilja œ̃ maʁʃe syʁ la plas.","On Tuesdays and Saturdays there is a market in the square."),f("Mes voisins sont gentils, mais un peu bruyants.","me vwazɛ̃ sɔ̃ ʒɑ̃ti, mɛ œ̃ pø bʁɥijɑ̃.","My neighbours are kind, but a bit noisy."),f("Le seul problème, c'est qu'il n'y a pas de parc.","lə sœl pʁɔblɛm, sɛ kil nja pa də paʁk.","The only problem is that there is no park."),f("Pour courir, je dois prendre le bus jusqu'au bois.","puʁ kuʁiʁ, ʒə dwa pʁɑ̃dʁ lə bys ʒysko bwa.","To go running I have to take the bus to the woods."),f("Mais globalement, je m'y sens bien.","mɛ ɡlɔbalmɑ̃, ʒə mi sɑ̃ bjɛ̃.","But overall I feel at home here.")],notes:["il y a, there is or there are, never changes for the plural.","le mardi with le means every Tuesday.","je m'y sens bien uses y for the place: I feel good there.","il n'y a pas de: after a negative, de replaces un, une, des."]},{id:"enfance",title:"Quand j'étais petit",level:"A2",intro:"Childhood memories in the imparfait, with one event in the passé composé.",lines:[f("Quand j'étais petit, j'habitais dans‿un village près de Pokhara.","kɑ̃ ʒetɛ pəti, ʒabitɛ dɑ̃zœ̃ vilaʒ pʁɛ də pɔkaʁa.","When I was little, I lived in a village near Pokhara."),f("Tous les matins, je marchais une‿heure pour aller à l'école.","tu le matɛ̃, ʒə maʁʃɛ ynœʁ puʁ ale a lekɔl.","Every morning I walked for an hour to get to school."),f("Il n'y avait pas de voitures, seulement des chèvres et des vaches.","il njavɛ pa də vwatyʁ, sœlmɑ̃ de ʃɛvʁ e de vaʃ.","There were no cars, only goats and cows."),f("Le soir, ma grand-mère racontait des‿histoires au coin du feu.","lə swaʁ, ma ɡʁɑ̃mɛʁ ʁakɔ̃tɛ dezistwaʁ o kwɛ̃ dy fø.","In the evenings my grandmother told stories by the fire."),f("Nous n'avions pas grand-chose, mais nous‿étions‿heureux.","nu navjɔ̃ pa ɡʁɑ̃ʃoz, mɛ nuzetjɔ̃zœʁø.","We did not have much, but we were happy."),f("Un jour, mon père a trouvé du travail à Katmandou.","œ̃ ʒuʁ, mɔ̃ pɛʁ a tʁuve dy tʁavaj a katmandu.","One day my father found work in Kathmandu."),f("Et toute notre vie a changé.","e tut nɔtʁ vi a ʃɑ̃ʒe.","And our whole life changed.")],notes:["The imparfait describes how life used to be: j'habitais, je marchais, il n'y avait pas.","Un jour, one day, signals a single event, so the story switches to the passé composé: mon père a trouvé.","pas grand-chose means not much."]},{id:"apprendre",title:"Apprendre une langue",level:"B1",intro:"A short opinion piece with linking words.",lines:[f("On dit souvent qu'il est difficile d'apprendre une langue à l'âge adulte.","ɔ̃ di suvɑ̃ kilɛ difisil dapʁɑ̃dʁ yn lɑ̃ɡ a lɑʒ adylt.","People often say it is hard to learn a language as an adult."),f("Pourtant, les‿adultes ont‿un grand‿avantage : ils savent pourquoi ils‿apprennent.","puʁtɑ̃, lezadylt ɔ̃tœ̃ ɡʁɑ̃tavɑ̃taʒ : il sav puʁkwa ilzapʁɛn.","Yet adults have a great advantage: they know why they are learning."),f("Le plus‿important n'est pas d'avoir du talent, mais d'être régulier.","lə plyzɛ̃pɔʁtɑ̃ nɛ pa davwaʁ dy talɑ̃, mɛ dɛtʁ ʁeɡylje.","The most important thing is not talent, but regularity."),f("Quinze minutes par jour valent mieux que deux‿heures le dimanche.","kɛ̃z minyt paʁ ʒuʁ val mjø kə døzœʁ lə dimɑ̃ʃ.","Fifteen minutes a day are worth more than two hours on Sunday."),f("Il faut aussi accepter de faire des‿erreurs, car c'est‿en se trompant qu'on progresse.","il fo osi aksɛpte də fɛʁ dezeʁœʁ, kaʁ sɛtɑ̃ sə tʁɔ̃pɑ̃ kɔ̃ pʁɔɡʁɛs.","You also have to accept making mistakes, because it is by getting things wrong that you improve."),f("Enfin, écouter des natifs, même sans tout comprendre, entraîne l'oreille.","ɑ̃fɛ̃, ekute de natif, mɛm sɑ̃ tu kɔ̃pʁɑ̃dʁ, ɑ̃tʁɛn lɔʁɛj.","Finally, listening to native speakers, even without understanding everything, trains the ear."),f("Bref, la patience est la clé.","bʁɛf, la pasjɑ̃s ɛ la kle.","In short, patience is the key.")],notes:["Il est difficile de + infinitive: it is difficult to.","valoir mieux, to be better: quinze minutes valent mieux que deux heures.","en se trompant, by making mistakes, is the gérondif: en + present participle.","car is a written word for because. In speech people say parce que.","Pourtant, enfin, bref: yet, finally, in short. They give an argument its shape."]},{id:"marche",title:"Le marché, un lieu de vie",level:"B1",intro:"A description of French market culture.",lines:[f("En France, le marché est bien plus qu'un‿endroit où l'on fait ses courses.","ɑ̃ fʁɑ̃s, lə maʁʃe ɛ bjɛ̃ ply kœ̃nɑ̃dʁwa u lɔ̃ fɛ se kuʁs.","In France the market is much more than a place to shop."),f("C'est‿un lieu de rencontre, où les‿habitants du quartier se retrouvent chaque semaine.","sɛtœ̃ ljø də ʁɑ̃kɔ̃tʁ, u lezabitɑ̃ dy kaʁtje sə ʁətʁuv ʃak smɛn.","It is a meeting place, where local people get together every week."),f("Les producteurs viennent de la campagne pour vendre leurs fruits, leurs légumes et leurs fromages.","le pʁɔdyktœʁ vjɛn də la kɑ̃paɲ puʁ vɑ̃dʁ lœʁ fʁɥi, lœʁ leɡym e lœʁ fʁɔmaʒ.","Farmers come in from the countryside to sell their fruit, vegetables and cheeses."),f("On goûte, on discute, on compare les prix.","ɔ̃ ɡut, ɔ̃ diskyt, ɔ̃ kɔ̃paʁ le pʁi.","People taste, chat and compare prices."),f("Les marchands connaissent leurs clients par leur prénom.","le maʁʃɑ̃ kɔnɛs lœʁ klijɑ̃ paʁ lœʁ pʁenɔ̃.","Stallholders know their customers by their first names."),f("Pour beaucoup de Français, acheter au marché, c'est soutenir l'économie locale.","puʁ boku də fʁɑ̃sɛ, aʃte o maʁʃe, sɛ sutniʁ lekɔnɔmi lɔkal.","For many French people, buying at the market means supporting the local economy."),f("Et puis, il y a ce plaisir simple de rentrer chez soi avec un panier plein.","e pɥi, ilja sə plɛziʁ sɛ̃pl də ʁɑ̃tʁe ʃe swa avɛk œ̃ panje plɛ̃.","And then there is the simple pleasure of going home with a full basket.")],notes:["où l'on: in careful writing l' is added before on after où, et or si, for the sound.","on is used for people in general: on goûte, on discute.","Et puis, and then, also adds one last point to an argument.","chez soi, at one's own home, goes with on and with general statements."]},{id:"teletravail",title:"Le télétravail",level:"B2",intro:"A balanced argument about working from home.",lines:[f("Depuis la pandémie, le télétravail s'est largement répandu en France.","dəpɥi la pɑ̃demi, lə teletʁavaj sɛ laʁʒəmɑ̃ ʁepɑ̃dy ɑ̃ fʁɑ̃s.","Since the pandemic, working from home has spread widely in France."),f("Pour de nombreux salariés, il représente un gain de temps considérable, puisqu'ils n'ont plus à se déplacer.","puʁ də nɔ̃bʁø salaʁje, il ʁəpʁezɑ̃t œ̃ ɡɛ̃ də tɑ̃ kɔ̃sideʁabl, pɥiskil nɔ̃ ply a sə deplase.","For many employees it saves a great deal of time, since they no longer have to travel."),f("Toutefois, cette nouvelle‿organisation n'est pas sans‿inconvénients.","tutfwa, sɛt nuvɛlɔʁɡanizasjɔ̃ nɛ pa sɑ̃zɛ̃kɔ̃venjɑ̃.","However, this new way of working is not without drawbacks."),f("Certains se sentent‿isolés et regrettent les‿échanges spontanés avec leurs collègues.","sɛʁtɛ̃ sə sɑ̃tizɔle e ʁəɡʁɛt lezeʃɑ̃ʒ spɔ̃tane avɛk lœʁ kɔlɛɡ.","Some feel isolated and miss spontaneous exchanges with colleagues."),f("D'autres ont du mal à séparer vie professionnelle et vie privée.","dotʁ ɔ̃ dy mal a sepaʁe vi pʁɔfɛsjɔnɛl e vi pʁive.","Others struggle to separate work from private life."),f("C'est pourquoi beaucoup d'entreprises adoptent aujourd'hui un modèle hybride, qui combine deux ou trois jours au bureau et le reste à domicile.","sɛ puʁkwa boku dɑ̃tʁəpʁiz adɔpt oʒuʁdɥi œ̃ mɔdɛl ibʁid, ki kɔ̃bin dø u tʁwa ʒuʁ o byʁo e lə ʁɛst a dɔmisil.","That is why many companies now use a hybrid model, combining two or three days in the office with the rest at home."),f("Reste à savoir si ce compromis durera.","ʁɛst a savwaʁ si sə kɔ̃pʁɔmi dyʁʁa.","It remains to be seen whether this compromise will last.")],notes:["Toutefois, however, and c'est pourquoi, that is why, structure an argument.","puisque, since, gives a reason the reader already accepts.","avoir du mal à + infinitive means to struggle to.","Reste à savoir si, it remains to be seen whether, is a typical way to end a written argument."]},{id:"ecologie",title:"L'écologie au quotidien",level:"B2",intro:"An opinion piece using the conditional and the subjunctive.",lines:[f("Face à l'urgence climatique, de plus‿en plus de Français modifient leurs‿habitudes.","fas a lyʁʒɑ̃s klimatik, də plyzɑ̃ ply də fʁɑ̃sɛ mɔdifi lœʁzabityd.","Faced with the climate emergency, more and more French people are changing their habits."),f("Ils trient leurs déchets, privilégient les transports en commun et réduisent leur consommation de viande.","il tʁi lœʁ deʃɛ, pʁivileʒ le tʁɑ̃spɔʁ ɑ̃ kɔmœ̃ e ʁedɥiz lœʁ kɔ̃sɔmasjɔ̃ də vjɑ̃d.","They sort their rubbish, favour public transport and eat less meat."),f("Le vélo, autrefois réservé aux sportifs, est devenu un moyen de transport à part‿entière.","lə velo, otʁəfwa ʁezɛʁve o spɔʁtif, ɛ dəvny œ̃ mwajɛ̃ də tʁɑ̃spɔʁ a paʁtɑ̃tjɛʁ.","The bicycle, once only for the sporty, has become a means of transport in its own right."),f("Pourtant, ces gestes individuels ne suffiront pas si les‿entreprises et l'État ne s'engagent pas davantage.","puʁtɑ̃, se ʒɛst ɛ̃dividɥɛl nə syfiʁɔ̃ pa si lezɑ̃tʁəpʁiz e leta nə sɑ̃ɡaʒ pa davɑ̃taʒ.","Yet these individual actions will not be enough unless businesses and the state commit further."),f("Il faudrait que les produits durables soient moins chers et plus faciles à trouver.","il fodʁɛ kə le pʁɔdɥi dyʁabl swa mwɛ̃ ʃɛʁ e ply fasil a tʁuve.","Sustainable products would need to be cheaper and easier to find."),f("Chacun peut‿agir à son‿échelle, mais le changement doit‿être collectif.","ʃakœ̃ pøtaʒiʁ a sɔ̃neʃɛl, mɛ lə ʃɑ̃ʒmɑ̃ dwatɛtʁ kɔlɛktif.","Everyone can act at their own level, but change has to be collective.")],notes:["de plus en plus de, more and more.","Il faudrait que, it would be necessary that, takes the subjunctive: soient.","à part entière means fully, in its own right.","à son échelle, at one's own level.","The future after si is wrong, but the future in the main clause is right: ne suffiront pas si les entreprises ne s'engagent pas."]}],hy=[{id:"saphal",title:"Je m'appelle Saphal",level:"A1",intro:"A short introduction with être, avoir and s'appeler.",lines:[f("Bonjour ! Je m'appelle Saphal.","bɔ̃ʒuʁ ! ʒə mapɛl safal.","Hello! My name is Saphal."),f("Je suis népalais et j'habite à Katmandou.","ʒə sɥi nepalɛ e ʒabit a katmandu.","I am Nepali and I live in Kathmandu."),f("Je parle népalais et anglais.","ʒə paʁl nepalɛ e ɑ̃ɡlɛ.","I speak Nepali and English."),f("Maintenant, j'apprends le français.","mɛ̃tnɑ̃, ʒapʁɑ̃ lə fʁɑ̃sɛ.","Now I am learning French."),f("C'est difficile, mais c'est très beau.","sɛ difisil, mɛ sɛ tʁɛ bo.","It is difficult, but it is very beautiful."),f("Un jour, je voudrais visiter Paris.","œ̃ ʒuʁ, ʒə vudʁɛ vizite paʁi.","One day, I would like to visit Paris.")],notes:["je m'appelle, literally I call myself, is how French gives a name.","j'habite à + town. je becomes j' because the h of habite is silent, so the word starts with a vowel sound.","Languages are masculine and take no capital letter: le français, l'anglais, le népalais.","je voudrais, I would like, is the polite way to say what you want.","et is never linked to the next word, so et anglais keeps a small break: ए आँग्लॅ."]},{id:"cafe",title:"Au café",level:"A1",intro:"A morning routine in the present tense.",lines:[f("Le matin, je vais au café près de chez moi.","lə matɛ̃, ʒə vɛ o kafe pʁɛ də ʃe mwa.","In the morning, I go to the café near my home."),f("Je commande un café et un croissant.","ʒə kɔmɑ̃d œ̃ kafe e œ̃ kʁwasɑ̃.","I order a coffee and a croissant."),f("Le serveur est très gentil.","lə sɛʁvœʁ ɛ tʁɛ ʒɑ̃ti.","The waiter is very kind."),f("Je lis le journal et je regarde les gens.","ʒə li lə ʒuʁnal e ʒə ʁəɡaʁd le ʒɑ̃.","I read the paper and watch the people."),f("À neuf‿heures, je pars au travail.","a nœvœʁ, ʒə paʁ o tʁavaj.","At nine, I leave for work.")],notes:["au is à + le joined together: je vais au café, never à le café.","chez moi means at my home. chez + a person means at that person's place: chez Paul.","neuf heures is said नभऱ. The f of neuf turns into v before heures and ans, one of the few places French does this."]}],xf=["A1","A2","B1","B2","C1"],au=[...hy,...dy].sort((o,u)=>xf.indexOf(o.level)-xf.indexOf(u.level)),O=(o,u,m,c)=>({speaker:o,fr:u,ipa:m,en:c}),my=[{id:"cafe-order",title:"Ordering at a café",level:"A1",setting:"A morning coffee at the counter of a Paris café.",speakers:["Saphal","Le serveur"],lines:[O(1,"Bonjour, vous désirez ?","bɔ̃ʒuʁ, vu deziʁe ?","Hello, what would you like?"),O(0,"Un café crème et un croissant, s'il vous plaît.","œ̃ kafe kʁɛm e œ̃ kʁwasɑ̃, sil vu plɛ.","A white coffee and a croissant, please."),O(1,"Sur place ou à emporter ?","syʁ plas u a ɑ̃pɔʁte ?","To have here or to take away?"),O(0,"Sur place.","syʁ plas.","To have here."),O(1,"Très bien. Autre chose ?","tʁɛ bjɛ̃. otʁ ʃoz ?","Very good. Anything else?"),O(0,"Non, merci. C'est combien ?","nɔ̃, mɛʁsi. sɛ kɔ̃bjɛ̃ ?","No, thanks. How much is it?"),O(1,"Quatre‿euros quarante.","katʁøʁo kaʁɑ̃t.","Four euros forty."),O(0,"Voilà. Merci beaucoup !","vwala. mɛʁsi boku !","Here you are. Thank you very much!")],notes:["vous désirez ? is how waiters and shop staff open the conversation.","sur place ou à emporter ? is asked in every café and bakery.","un café on its own is a small black espresso. For milk, ask for un café crème."]},{id:"train-ticket",title:"Buying a train ticket",level:"A1",setting:"At the ticket office of a railway station.",speakers:["Saphal","L'agent"],lines:[O(0,"Bonjour. Un billet pour Lyon, s'il vous plaît.","bɔ̃ʒuʁ. œ̃ bijɛ puʁ ljɔ̃, sil vu plɛ.","Hello. A ticket to Lyon, please."),O(1,"Aller simple ou aller-retour ?","ale sɛ̃pl u ale ʁətuʁ ?","Single or return?"),O(0,"Aller-retour. Je reviens dimanche.","ale ʁətuʁ. ʒə ʁəvjɛ̃ dimɑ̃ʃ.","Return. I am coming back on Sunday."),O(1,"Le train de neuf‿heures, ça vous va ?","lə tʁɛ̃ də nœvœʁ, sa vu va ?","The nine o'clock train, does that suit you?"),O(0,"Oui, parfait. C'est quel quai ?","wi, paʁfɛ. sɛ kɛl ke ?","Yes, perfect. Which platform?"),O(1,"Quai numéro trois. Ça fait quatre-vingts‿euros.","ke nymeʁo tʁwa. sa fɛ katʁəvɛ̃zøʁo.","Platform three. That is eighty euros."),O(0,"Je peux payer par carte ?","ʒə pø pɛje paʁ kaʁt ?","Can I pay by card?"),O(1,"Bien sûr. Bon voyage !","bjɛ̃ syʁ. bɔ̃ vwajaʒ !","Of course. Have a good trip!")],notes:["aller simple is a single, aller-retour a return.","ça vous va ? means does that suit you, heard constantly in shops and offices.","quatre-vingts keeps its s before euros, and the s is said as z."]},{id:"asking-way",title:"Asking the way",level:"A1",setting:"Saphal stops a woman in the street near the Seine.",speakers:["Saphal","Une passante"],lines:[O(0,"Excusez-moi, madame. Je cherche le musée du Louvre.","ɛkskyze mwa, madam. ʒə ʃɛʁʃ lə myze dy luvʁ.","Excuse me, madam. I am looking for the Louvre."),O(1,"Le Louvre ? Ce n'est pas loin.","lə luvʁ ? sə nɛ pa lwɛ̃.","The Louvre? It is not far."),O(1,"Allez tout droit jusqu'à la Seine, puis tournez à gauche.","ale tu dʁwa ʒyska la sɛn, pɥi tuʁne a ɡoʃ.","Go straight on to the Seine, then turn left."),O(0,"C'est‿à combien de minutes‿à pied ?","sɛta kɔ̃bjɛ̃ də minyta pje ?","How many minutes on foot is it?"),O(1,"Dix minutes, à peu près.","di minyt, a pø pʁɛ.","About ten minutes."),O(0,"Merci beaucoup, madame.","mɛʁsi boku, madam.","Thank you very much, madam."),O(1,"Je vous‿en prie. Bonne visite !","ʒə vuzɑ̃ pʁi. bɔn vizit !","You are welcome. Enjoy your visit!")],notes:["Start with excusez-moi and madame or monsieur when you stop a stranger.","jusqu'à means as far as.","à peu près means about, roughly."]},{id:"market",title:"At the market",level:"A1",setting:"A Saturday morning vegetable stall.",speakers:["Saphal","Le marchand"],lines:[O(1,"Bonjour ! Qu'est-ce qu'il vous faut ?","bɔ̃ʒuʁ ! kɛskil vu fo ?","Hello! What do you need?"),O(0,"Un kilo de tomates et des‿oignons, s'il vous plaît.","œ̃ kilo də tɔmat e dezɔɲɔ̃, sil vu plɛ.","A kilo of tomatoes and some onions, please."),O(1,"Combien d'oignons ?","kɔ̃bjɛ̃ dɔɲɔ̃ ?","How many onions?"),O(0,"Trois. Elles sont bonnes, vos fraises ?","tʁwa. ɛl sɔ̃ bɔn, vo fʁɛz ?","Three. Are your strawberries good?"),O(1,"Elles sont délicieuses, goûtez !","ɛl sɔ̃ delisjøz, ɡute !","They are delicious, try one!"),O(0,"Ah oui, c'est vrai. Une barquette aussi, alors.","a wi, sɛ vʁɛ. yn baʁkɛt osi, alɔʁ.","Oh yes, it is true. A punnet as well, then."),O(1,"Et avec ça ?","e avɛk sa ?","Anything else?"),O(0,"C'est tout, merci.","sɛ tu, mɛʁsi.","That is all, thank you."),O(1,"Ça vous fait sept‿euros cinquante.","sa vu fɛ sɛtøʁo sɛ̃kɑ̃t.","That comes to seven euros fifty.")],notes:["Et avec ça ? is what market sellers say to ask if you want anything else.","goûtez ! taste it! Sellers often let you try.","une barquette is the small box fruit is sold in."]},{id:"colleague",title:"Meeting a colleague",level:"A1",setting:"Saphal's first morning in a new office.",speakers:["Saphal","Thomas"],lines:[O(1,"Bonjour, vous‿êtes le nouveau comptable ?","bɔ̃ʒuʁ, vuzɛt lə nuvo kɔ̃tabl ?","Hello, are you the new accountant?"),O(0,"Oui, je m'appelle Saphal. Enchanté.","wi, ʒə mapɛl safal. ɑ̃ʃɑ̃te.","Yes, my name is Saphal. Pleased to meet you."),O(1,"Thomas, je travaille au service marketing.","tɔma, ʒə tʁavaj o sɛʁvis maʁketiŋ.","Thomas, I work in the marketing department."),O(0,"Ravi de vous rencontrer. Vous‿êtes‿ici depuis longtemps ?","ʁavi də vu ʁɑ̃kɔ̃tʁe. vuzɛtisi dəpɥi lɔ̃tɑ̃ ?","Delighted to meet you. Have you been here long?"),O(1,"Cinq‿ans. On peut se tutoyer, si tu veux.","sɛ̃kɑ̃. ɔ̃ pø sə tytwaje, si ty vø.","Five years. We can say tu, if you like."),O(0,"Avec plaisir ! Tu sais où est la cafétéria ?","avɛk plɛziʁ ! ty sɛ u ɛ la kafeteʁja ?","With pleasure! Do you know where the canteen is?"),O(1,"Au premier‿étage. Viens, je t'accompagne.","o pʁəmjeʁetaʒ. vjɛ̃, ʒə takɔ̃paɲ.","On the first floor. Come, I will take you.")],notes:["Colleagues often start with vous and switch to tu, usually when the more senior person suggests it.","le service means the department.","Listen for the moment both of them switch from vous to tu."]},{id:"pharmacy",title:"At the pharmacy",level:"A2",setting:"Saphal has had a cough for a few days.",speakers:["Saphal","La pharmacienne"],lines:[O(1,"Bonjour monsieur, je peux vous‿aider ?","bɔ̃ʒuʁ məsjø, ʒə pø vuzede ?","Hello sir, can I help you?"),O(0,"Oui, j'ai mal à la gorge et je tousse.","wi, ʒe mal a la ɡɔʁʒ e ʒə tus.","Yes, I have a sore throat and a cough."),O(1,"Depuis combien de temps ?","dəpɥi kɔ̃bjɛ̃ də tɑ̃ ?","For how long?"),O(0,"Depuis trois jours.","dəpɥi tʁwa ʒuʁ.","For three days."),O(1,"Vous‿avez de la fièvre ?","vuzave də la fjɛvʁ ?","Do you have a temperature?"),O(0,"Non, je ne crois pas.","nɔ̃, ʒən kʁwa pa.","No, I do not think so."),O(1,"Alors, prenez ce sirop trois fois par jour.","alɔʁ, pʁəne sə siʁo tʁwa fwa paʁ ʒuʁ.","Then take this syrup three times a day."),O(1,"Si ça ne va pas mieux dans trois jours, allez voir un médecin.","si sa nə va pa mjø dɑ̃ tʁwa ʒuʁ, ale vwaʁ œ̃ medsɛ̃.","If it is not better in three days, go and see a doctor."),O(0,"D'accord, merci beaucoup.","dakɔʁ, mɛʁsi boku.","Okay, thank you very much.")],notes:["depuis + present tense: je tousse depuis trois jours, I have been coughing for three days.","French pharmacists give real advice, so the pharmacy is the first stop for small problems.","prenez and allez are vous commands, used for instructions."]},{id:"hotel",title:"Checking in at a hotel",level:"A2",setting:"Arriving at a small hotel in the evening.",speakers:["Saphal","Le réceptionniste"],lines:[O(1,"Bonsoir, bienvenue à l'hôtel du Parc.","bɔ̃swaʁ, bjɛ̃vny a lotɛl dy paʁk.","Good evening, welcome to the Hôtel du Parc."),O(0,"Bonsoir. J'ai une réservation au nom de Saphal.","bɔ̃swaʁ. ʒe yn ʁezɛʁvasjɔ̃ o nɔ̃ də safal.","Good evening. I have a booking under the name Saphal."),O(1,"Oui, une chambre double pour trois nuits. Votre passeport, s'il vous plaît.","wi, yn ʃɑ̃bʁ dubl puʁ tʁwa nɥi. vɔtʁ paspɔʁ, sil vu plɛ.","Yes, a double room for three nights. Your passport, please."),O(0,"Voilà. Le petit-déjeuner est compris ?","vwala. lə pətideʒœne ɛ kɔ̃pʁi ?","Here you are. Is breakfast included?"),O(1,"Oui, de sept‿heures à dix‿heures, au rez-de-chaussée.","wi, də sɛtœʁ a dizœʁ, o ʁedʃose.","Yes, from seven to ten, on the ground floor."),O(0,"Et le code wifi ?","e lə kɔd wifi ?","And the wifi password?"),O(1,"Il est sur votre clé. Vous‿avez la chambre vingt-deux, au deuxième‿étage.","ilɛ syʁ vɔtʁ kle. vuzave la ʃɑ̃bʁ vɛ̃tdø, o døzjɛmetaʒ.","It is on your key. You have room twenty two, on the second floor."),O(0,"Merci, bonne soirée !","mɛʁsi, bɔn swaʁe !","Thank you, have a nice evening!")],notes:["le rez-de-chaussée is the ground floor. le premier étage is the floor above it.","compris means included.","Hotel staff use vous and very polite forms."]},{id:"weekend-plans",title:"Making plans for the weekend",level:"A2",setting:"Claire calls Saphal on a Thursday evening.",speakers:["Saphal","Claire"],lines:[O(1,"Salut Saphal ! Tu fais quoi ce week-end ?","saly safal ! ty fɛ kwa sə wikɛnd ?","Hi Saphal! What are you doing this weekend?"),O(0,"Rien de spécial. Pourquoi ?","ʁjɛ̃ də spesjal. puʁkwa ?","Nothing special. Why?"),O(1,"On va au marché samedi matin, tu veux venir ?","ɔ̃ va o maʁʃe samdi matɛ̃, ty vø vəniʁ ?","We are going to the market on Saturday morning, do you want to come?"),O(0,"Avec plaisir ! On se retrouve‿où ?","avɛk plɛziʁ ! ɔ̃ sə ʁətʁuvu ?","With pleasure! Where shall we meet?"),O(1,"Devant la boulangerie, à dix‿heures.","dəvɑ̃ la bulɑ̃ʒʁi, a dizœʁ.","Outside the bakery, at ten."),O(0,"Parfait. J'apporte quelque chose ?","paʁfɛ. ʒapɔʁt kɛlkə ʃoz ?","Perfect. Shall I bring anything?"),O(1,"Non, juste ton sac pour les courses !","nɔ̃, ʒyst tɔ̃ sak puʁ le kuʁs !","No, just your shopping bag!"),O(0,"Ça marche. À samedi !","sa maʁʃ. a samdi !","Okay. See you on Saturday!")],notes:["Tu fais quoi ? is the spoken way of asking what are you doing.","on se retrouve means we meet up.","faire les courses means to do the food shopping."]},{id:"doctor",title:"At the doctor",level:"A2",setting:"A visit to a GP after a bad night.",speakers:["Saphal","Le médecin"],lines:[O(1,"Bonjour, asseyez-vous. Qu'est-ce qui ne va pas ?","bɔ̃ʒuʁ, asɛje vu. kɛski nə va pa ?","Hello, sit down. What is the matter?"),O(0,"J'ai mal au ventre depuis hier soir.","ʒe mal o vɑ̃tʁ dəpɥi jɛʁ swaʁ.","I have had stomach ache since last night."),O(1,"Vous‿avez mangé quelque chose de spécial ?","vuzave mɑ̃ʒe kɛlkə ʃoz də spesjal ?","Did you eat anything unusual?"),O(0,"Des fruits de mer au restaurant.","de fʁɥi də mɛʁ o ʁɛstɔʁɑ̃.","Seafood at a restaurant."),O(1,"Je vais vous‿examiner. Allongez-vous ici.","ʒə vɛ vuzɛɡzamine. alɔ̃ʒe vu isi.","I am going to examine you. Lie down here."),O(1,"Ce n'est pas grave. Buvez beaucoup d'eau et reposez-vous.","sə nɛ pa ɡʁav. byve boku do e ʁəpoze vu.","It is not serious. Drink plenty of water and rest."),O(0,"Je peux aller travailler demain ?","ʒə pø ale tʁavaje dəmɛ̃ ?","Can I go to work tomorrow?"),O(1,"Restez à la maison deux jours. Je vous fais un‿arrêt de travail.","ʁɛste a la mɛzɔ̃ dø ʒuʁ. ʒə vu fɛ œ̃naʁɛ də tʁavaj.","Stay at home for two days. I will give you a sick note.")],notes:["Qu'est-ce qui ne va pas ? is how a doctor asks what is wrong.","asseyez-vous, allongez-vous and reposez-vous are reflexive verbs as vous commands.","un arrêt de travail is the official sick note for an employer."]},{id:"restaurant-phone",title:"Booking a table by phone",level:"A2",setting:"Saphal calls a restaurant to book for friends.",speakers:["Saphal","Le restaurant"],lines:[O(1,"Restaurant Le Petit Zinc, bonjour.","ʁɛstɔʁɑ̃ lə pəti zɛ̃k, bɔ̃ʒuʁ.","Le Petit Zinc restaurant, hello."),O(0,"Bonjour, je voudrais réserver une table pour ce soir.","bɔ̃ʒuʁ, ʒə vudʁɛ ʁezɛʁve yn tabl puʁ sə swaʁ.","Hello, I would like to book a table for tonight."),O(1,"Pour combien de personnes ?","puʁ kɔ̃bjɛ̃ də pɛʁsɔn ?","For how many people?"),O(0,"Pour quatre personnes, vers vingt‿heures.","puʁ katʁ pɛʁsɔn, vɛʁ vɛ̃tœʁ.","For four people, around eight."),O(1,"Désolé, à vingt‿heures c'est complet. Vingt‿et‿une‿heures, ça vous va ?","dezɔle, a vɛ̃tœʁ sɛ kɔ̃plɛ. vɛ̃teynœʁ, sa vu va ?","Sorry, eight is full. Does nine suit you?"),O(0,"Oui, très bien.","wi, tʁɛ bjɛ̃.","Yes, that is fine."),O(1,"C'est‿à quel nom ?","sɛta kɛl nɔ̃ ?","What name is it under?"),O(0,"Saphal. Ça s'écrit S, A, P, H, A, L.","safal. sa sekʁi ɛs, a, pe, aʃ, a, ɛl.","Saphal. It is spelt S, A, P, H, A, L."),O(1,"Parfait, à ce soir !","paʁfɛ, a sə swaʁ !","Perfect, see you tonight!")],notes:["c'est complet means it is full, for restaurants, trains and hotels.","Spelling your name uses the French letter names from the Alphabet section.","vers vingt heures means around eight, with the 24 hour clock."]},{id:"nepal-chat",title:"Talking about Nepal",level:"A2",setting:"Claire asks Saphal about home over coffee.",speakers:["Saphal","Claire"],lines:[O(1,"Tu viens du Népal, c'est ça ?","ty vjɛ̃ dy nepal, sɛ sa ?","You are from Nepal, right?"),O(0,"Oui, de Katmandou, la capitale.","wi, də katmandu, la kapital.","Yes, from Kathmandu, the capital."),O(1,"Il fait froid là-bas ?","il fɛ fʁwa laba ?","Is it cold there?"),O(0,"Ça dépend. En‿hiver, oui, mais l'été est chaud et pluvieux.","sa depɑ̃. ɑ̃nivɛʁ, wi, mɛ lete ɛ ʃo e plyvjø.","It depends. In winter yes, but the summer is hot and rainy."),O(1,"Et on parle quelle langue au Népal ?","e ɔ̃ paʁl kɛl lɑ̃ɡ o nepal ?","And what language do people speak in Nepal?"),O(0,"Le népali, surtout, mais il y a plus de cent langues.","lə nepali, syʁtu, mɛ ilja ply də sɑ̃ lɑ̃ɡ.","Mainly Nepali, but there are more than a hundred languages."),O(1,"C'est‿incroyable ! Et l'Everest, tu l'as vu ?","sɛtɛ̃kʁwajabl ! e levʁɛst, ty la vy ?","That is amazing! And Everest, have you seen it?"),O(0,"Seulement d'un‿avion ! Un jour, je ferai le trek jusqu'au camp de base.","sœlmɑ̃ dœ̃navjɔ̃ ! œ̃ ʒuʁ, ʒə fəʁe lə tʁɛk ʒysko kɑ̃ də baz.","Only from a plane! One day I will do the trek to base camp.")],notes:["c'est ça ? at the end of a sentence means right? or is that it?","là-bas means over there.","Countries: le Népal, l'Inde, la Chine. au Népal, en Inde, en Chine."]},{id:"family-dinner",title:"Dinner with a French family",level:"A2",setting:"Saphal is invited to dinner by a colleague's mother.",speakers:["Saphal","Madame Martin"],lines:[O(1,"Entrez, entrez ! Faites comme chez vous.","ɑ̃tʁe, ɑ̃tʁe ! fɛt kɔm ʃe vu.","Come in, come in! Make yourself at home."),O(0,"Merci pour l'invitation. J'ai apporté des fleurs.","mɛʁsi puʁ lɛ̃vitasjɔ̃. ʒe apɔʁte de flœʁ.","Thank you for inviting me. I brought some flowers."),O(1,"Oh, elles sont magnifiques ! Il ne fallait pas !","o, ɛl sɔ̃ maɲifik ! il nə falɛ pa !","Oh, they are beautiful! You should not have!"),O(1,"À table, tout le monde ! Vous‿aimez le poulet ?","a tabl, tu lə mɔ̃d ! vuzɛme lə pulɛ ?","Dinner is ready, everyone! Do you like chicken?"),O(0,"Oui, beaucoup. Ça sent très bon.","wi, boku. sa sɑ̃ tʁɛ bɔ̃.","Yes, very much. It smells very good."),O(1,"Servez-vous, je vous‿en prie.","sɛʁve vu, ʒə vuzɑ̃ pʁi.","Help yourself, please."),O(0,"C'est délicieux. Vous me donnerez la recette ?","sɛ delisjø. vu mə dɔnʁe la ʁəsɛt ?","It is delicious. Will you give me the recipe?"),O(1,"Avec plaisir ! Et au Népal, qu'est-ce qu'on mange ?","avɛk plɛziʁ ! e o nepal, kɛskɔ̃ mɑ̃ʒ ?","With pleasure! And in Nepal, what do people eat?"),O(0,"Du dal bhat, du riz avec des lentilles, presque tous les jours !","dy dal bat, dy ʁi avɛk de lɑ̃tij, pʁɛsk tu le ʒuʁ !","Dal bhat, rice with lentils, nearly every day!")],notes:["Il ne fallait pas, you should not have, is the polite reply to a gift.","Bring flowers, chocolates or wine when invited to a French home.","À table ! calls everyone to eat."]},{id:"police",title:"Reporting a stolen wallet",level:"B1",setting:"At the police station after a theft on the metro.",speakers:["Saphal","Le policier"],lines:[O(1,"Bonjour, qu'est-ce qui vous‿amène ?","bɔ̃ʒuʁ, kɛski vuzamɛn ?","Hello, what brings you here?"),O(0,"Je viens déclarer un vol. On m'a volé mon portefeuille dans le métro.","ʒə vjɛ̃ deklaʁe œ̃ vɔl. ɔ̃ ma vɔle mɔ̃ pɔʁtəfœj dɑ̃ lə metʁo.","I have come to report a theft. My wallet was stolen on the metro."),O(1,"Quand‿est-ce que c'est‿arrivé ?","kɑ̃tɛskə sɛtaʁive ?","When did it happen?"),O(0,"Ce matin, vers huit‿heures, sur la ligne quatre.","sə matɛ̃, vɛʁ ɥitœʁ, syʁ la liɲ katʁ.","This morning, around eight, on line four."),O(1,"Qu'est-ce qu'il y avait dedans ?","kɛskiljavɛ dədɑ̃ ?","What was in it?"),O(0,"Ma carte bancaire, mon permis de conduire et cinquante‿euros.","ma kaʁt bɑ̃kɛʁ, mɔ̃ pɛʁmi də kɔ̃dɥiʁ e sɛ̃kɑ̃tøʁo.","My bank card, my driving licence and fifty euros."),O(1,"Vous‿avez fait opposition sur votre carte ?","vuzave fɛ ɔpozisjɔ̃ syʁ vɔtʁ kaʁt ?","Have you stopped your card?"),O(0,"Oui, j'ai appelé ma banque tout de suite.","wi, ʒe aple ma bɑ̃k tutsɥit.","Yes, I called my bank straight away."),O(1,"Très bien. Je prépare votre déclaration. Signez ici, s'il vous plaît.","tʁɛ bjɛ̃. ʒə pʁepaʁ vɔtʁ deklaʁasjɔ̃. siɲe isi, sil vu plɛ.","Very good. I am preparing your statement. Sign here, please.")],notes:["on m'a volé, literally one stole from me, is how French says something was stolen.","faire opposition means to stop or cancel a card.","tout de suite, said तुत्स्युईत, means immediately.","il y avait, imparfait, describes what was in the wallet. on m'a volé, passé composé, tells what happened."]},{id:"flat",title:"Viewing a flat",level:"B1",setting:"Saphal visits a flat to rent with the owner.",speakers:["Saphal","La propriétaire"],lines:[O(1,"Voici le salon. Il est lumineux, il donne sur un jardin.","vwasi lə salɔ̃. ilɛ lyminø, il dɔn syʁ œ̃ ʒaʁdɛ̃.","Here is the living room. It is bright and looks onto a garden."),O(0,"C'est très joli. Le loyer, c'est combien par mois ?","sɛ tʁɛ ʒɔli. lə lwaje, sɛ kɔ̃bjɛ̃ paʁ mwa ?","It is very nice. How much is the rent per month?"),O(1,"Neuf cents‿euros, charges comprises.","nœf sɑ̃zøʁo, ʃaʁʒ kɔ̃pʁiz.","Nine hundred euros, bills included."),O(0,"Et le chauffage, il est‿électrique ?","e lə ʃofaʒ, ilɛtelɛktʁik ?","And the heating, is it electric?"),O(1,"Non, c'est le gaz. La cuisine est‿entièrement équipée.","nɔ̃, sɛ lə ɡaz. la kɥizin ɛtɑ̃tjɛʁmɑ̃ ekipe.","No, it is gas. The kitchen is fully equipped."),O(0,"Il faut verser une caution ?","il fo vɛʁse yn kosjɔ̃ ?","Do I have to pay a deposit?"),O(1,"Oui, un mois de loyer. Et il me faut vos trois dernières fiches de paie.","wi, œ̃ mwa də lwaje. e il mə fo vo tʁwa dɛʁnjɛʁ fiʃ də pɛ.","Yes, one month's rent. And I need your last three payslips."),O(0,"D'accord. Je peux réfléchir et vous rappeler demain ?","dakɔʁ. ʒə pø ʁefleʃiʁ e vu ʁaple dəmɛ̃ ?","All right. Can I think about it and call you back tomorrow?"),O(1,"Bien sûr, mais il y a d'autres visites cet‿après-midi.","bjɛ̃ syʁ, mɛ ilja dotʁ vizit sɛtapʁɛmidi.","Of course, but there are other viewings this afternoon.")],notes:["charges comprises means the building's bills are included in the rent.","une caution is the deposit.","Landlords usually ask for payslips, les fiches de paie, to check you can pay.","donner sur means to look onto."]},{id:"interview",title:"A job interview",level:"B1",setting:"Saphal interviews for an accounting job in Paris.",speakers:["Saphal","La recruteuse"],lines:[O(1,"Bonjour, asseyez-vous. Parlez-moi un peu de vous.","bɔ̃ʒuʁ, asɛje vu. paʁle mwa œ̃ pø də vu.","Hello, sit down. Tell me a little about yourself."),O(0,"Je suis comptable depuis sept‿ans. J'ai travaillé à Katmandou, puis à Londres.","ʒə sɥi kɔ̃tabl dəpɥi sɛtɑ̃. ʒe tʁavaje a katmandu, pɥi a lɔ̃dʁ.","I have been an accountant for seven years. I worked in Kathmandu, then in London."),O(1,"Pourquoi voulez-vous travailler chez nous ?","puʁkwa vule vu tʁavaje ʃe nu ?","Why do you want to work for us?"),O(0,"Votre‿entreprise est connue pour la qualité de son travail, et je voudrais vivre en France.","vɔtʁɑ̃tʁəpʁiz ɛ kɔny puʁ la kalite də sɔ̃ tʁavaj, e ʒə vudʁɛ vivʁ ɑ̃ fʁɑ̃s.","Your company is known for the quality of its work, and I would like to live in France."),O(1,"Quelles sont vos qualités ?","kɛl sɔ̃ vo kalite ?","What are your strengths?"),O(0,"Je suis rigoureux, organisé et j'aime travailler en‿équipe.","ʒə sɥi ʁiɡuʁø, ɔʁɡanize e ʒɛm tʁavaje ɑ̃nekip.","I am rigorous, organised and I like working in a team."),O(1,"Et votre français ?","e vɔtʁ fʁɑ̃sɛ ?","And your French?"),O(0,"Je l'apprends tous les jours. Je progresse vite, comme vous voyez !","ʒə lapʁɑ̃ tu le ʒuʁ. ʒə pʁɔɡʁɛs vit, kɔm vu vwaje !","I study it every day. I am improving fast, as you can see!"),O(1,"Très bien. Nous vous contacterons la semaine prochaine.","tʁɛ bjɛ̃. nu vu kɔ̃taktəʁɔ̃ la smɛn pʁɔʃɛn.","Very good. We will contact you next week.")],notes:["depuis with the present: je suis comptable depuis sept ans, I have been an accountant for seven years.","Parlez-moi de vous is the classic first question in an interview.","The passé composé is used for finished jobs: j'ai travaillé à Londres."]},{id:"complaint",title:"Returning a faulty phone",level:"B1",setting:"Saphal takes a new phone back to the shop.",speakers:["Saphal","Le vendeur"],lines:[O(0,"Bonjour. J'ai acheté ce téléphone la semaine dernière et il ne marche plus.","bɔ̃ʒuʁ. ʒe aʃte sə telefɔn la smɛn dɛʁnjɛʁ e il nə maʁʃ ply.","Hello. I bought this phone last week and it no longer works."),O(1,"Qu'est-ce qui se passe exactement ?","kɛski sə pas ɛɡzaktəmɑ̃ ?","What exactly is happening?"),O(0,"L'écran s'éteint tout seul et la batterie se vide en deux‿heures.","lekʁɑ̃ setɛ̃ tu sœl e la batʁi sə vid ɑ̃ døzœʁ.","The screen switches itself off and the battery runs down in two hours."),O(1,"Vous‿avez le ticket de caisse ?","vuzave lə tikɛ də kɛs ?","Do you have the receipt?"),O(0,"Oui, le voilà. Je voudrais un remboursement, s'il vous plaît.","wi, lə vwala. ʒə vudʁɛ œ̃ ʁɑ̃buʁsəmɑ̃, sil vu plɛ.","Yes, here it is. I would like a refund, please."),O(1,"Je ne peux pas vous rembourser, mais je peux l'échanger.","ʒən pø pa vu ʁɑ̃buʁse, mɛ ʒə pø leʃɑ̃ʒe.","I cannot refund you, but I can exchange it."),O(0,"Bon, d'accord. Mais si le nouveau a le même problème, je veux être remboursé.","bɔ̃, dakɔʁ. mɛ si lə nuvo a lə mɛm pʁɔblɛm, ʒə vø ɛtʁ ʁɑ̃buʁse.","Fine. But if the new one has the same problem, I want a refund."),O(1,"C'est noté. Je vous‿en donne un neuf tout de suite.","sɛ nɔte. ʒə vuzɑ̃ dɔn œ̃ nœf tutsɥit.","Noted. I will give you a new one straight away.")],notes:["le ticket de caisse is the receipt you need for any return.","un remboursement is a refund, rembourser to refund.","Bon, d'accord with a falling voice means fine, but I am not thrilled.","neuf here means brand new, not nine."]},{id:"bank",title:"Opening a bank account",level:"B1",setting:"Saphal meets an adviser at a bank branch.",speakers:["Saphal","Le conseiller"],lines:[O(1,"Bonjour monsieur, que puis-je faire pour vous ?","bɔ̃ʒuʁ məsjø, kə pɥiʒ fɛʁ puʁ vu ?","Hello sir, how can I help you?"),O(0,"Je voudrais‿ouvrir un compte courant.","ʒə vudʁɛzuvʁiʁ œ̃ kɔ̃t kuʁɑ̃.","I would like to open a current account."),O(1,"Très bien. Vous‿avez une pièce d'identité et un justificatif de domicile ?","tʁɛ bjɛ̃. vuzave yn pjɛs didɑ̃tite e œ̃ ʒystifikatif də dɔmisil ?","Very well. Do you have ID and proof of address?"),O(0,"Voici mon passeport et une facture d'électricité.","vwasi mɔ̃ paspɔʁ e yn faktyʁ delɛktʁisite.","Here is my passport and an electricity bill."),O(1,"Parfait. Vous voulez une carte de crédit ou une carte de débit ?","paʁfɛ. vu vule yn kaʁt də kʁedi u yn kaʁt də debi ?","Perfect. Do you want a credit card or a debit card?"),O(0,"Une carte de débit, ça suffit. Il y a des frais ?","yn kaʁt də debi, sa syfi. ilja de fʁɛ ?","A debit card is enough. Are there any fees?"),O(1,"Deux‿euros par mois. Vous recevrez votre carte dans‿une semaine.","døzøʁo paʁ mwa. vu ʁəsəvʁe vɔtʁ kaʁt dɑ̃zyn smɛn.","Two euros a month. You will receive your card within a week."),O(0,"Merci. Et pour faire un virement au Népal ?","mɛʁsi. e puʁ fɛʁ œ̃ viʁmɑ̃ o nepal ?","Thank you. And to make a transfer to Nepal?"),O(1,"C'est possible en ligne, je vais vous montrer.","sɛ pɔsibl ɑ̃ liɲ, ʒə vɛ vu mɔ̃tʁe.","You can do it online, I will show you.")],notes:["un justificatif de domicile is proof of address, usually a recent bill.","un virement is a bank transfer.","que puis-je faire pour vous ? is a very formal way to say how can I help."]},{id:"holiday-plans",title:"Planning a holiday",level:"B1",setting:"Claire and Saphal talk about the summer holidays.",speakers:["Saphal","Claire"],lines:[O(1,"Alors, ces vacances, tu pars où ?","alɔʁ, se vakɑ̃s, ty paʁ u ?","So, these holidays, where are you going?"),O(0,"Je vais aller en Bretagne. Je voudrais voir la mer et manger des crêpes !","ʒə vɛ ale ɑ̃ bʁətaɲ. ʒə vudʁɛ vwaʁ la mɛʁ e mɑ̃ʒe de kʁɛp !","I am going to Brittany. I would like to see the sea and eat crêpes!"),O(1,"Super ! Tu y vas comment ?","sypɛʁ ! ty i va kɔmɑ̃ ?","Great! How are you getting there?"),O(0,"En train. Si j'avais une voiture, je visiterais toute la côte.","ɑ̃ tʁɛ̃. si ʒavɛ yn vwatyʁ, ʒə vizitʁɛ tut la kot.","By train. If I had a car, I would visit the whole coast."),O(1,"Tu pourrais louer une voiture sur place.","ty puʁɛ lwe yn vwatyʁ syʁ plas.","You could hire a car when you get there."),O(0,"C'est‿une bonne‿idée. Mais je n'ai pas‿encore le permis français.","sɛtyn bɔnide. mɛ ʒə ne pazɑ̃kɔʁ lə pɛʁmi fʁɑ̃sɛ.","That is a good idea. But I do not have a French licence yet."),O(1,"Avec un permis international, ça devrait aller.","avɛk œ̃ pɛʁmi ɛ̃tɛʁnasjɔnal, sa dəvʁɛ ale.","With an international licence it should be fine."),O(0,"Je vais me renseigner. Merci du conseil !","ʒə vɛ mə ʁɑ̃sɛɲe. mɛʁsi dy kɔ̃sɛj !","I will look into it. Thanks for the advice!")],notes:["je vais aller is the near future, for plans.","si + imparfait, then the conditional: si j'avais une voiture, je visiterais.","ça devrait aller, it should be fine, uses the conditional of devoir.","se renseigner means to find out, to look into something."]}],py=[{id:"party",title:"Meeting someone new",level:"A1",setting:"Two people meet at a friend's party in Paris.",speakers:["Saphal","Claire"],lines:[{speaker:0,fr:"Bonsoir ! Je m'appelle Saphal.",ipa:"bɔ̃swaʁ ! ʒə mapɛl safal.",en:"Good evening! My name is Saphal."},{speaker:1,fr:"Enchantée, moi c'est Claire.",ipa:"
