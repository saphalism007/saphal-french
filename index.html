kɔ̃flɛks",sounds:"open è",vsEnglish:"The e of bed. The hat often marks an s that has disappeared: fête, feast.",vsNepali:"ऍ.",example:d("la fête","la fɛt","the party")},{letter:"ë",name:"e tréma",ipa:"ə tʁema",sounds:"said separately from the vowel before it",vsEnglish:"The two dots mean the vowel is said on its own.",vsNepali:"Say the two vowels one after the other.",example:d("Noël","nɔɛl","Christmas")},{letter:"à",name:"a accent grave",ipa:"a aksɑ̃ ɡʁav",sounds:"the same a",vsEnglish:"The sound does not change. It tells à, to, apart from a, has.",vsNepali:"आ.",example:d("à Paris","a paʁi","in Paris")},{letter:"â",name:"a accent circonflexe",ipa:"a aksɑ̃ siʁkɔ̃flɛks",sounds:"a, sometimes a little deeper",vsEnglish:"Most speakers say it like a normal a.",vsNepali:"आ.",example:d("le gâteau","lə ɡato","the cake")},{letter:"ô",name:"o accent circonflexe",ipa:"o aksɑ̃ siʁkɔ̃flɛks",sounds:"closed o",vsEnglish:"A pure, tight o.",vsNepali:"ओ, never ऑ.",example:d("l'hôtel","lotɛl","the hotel")},{letter:"î, û",name:"i et u accent circonflexe",ipa:"i e y aksɑ̃ siʁkɔ̃flɛks",sounds:"no change",vsEnglish:"The sound stays the same, the hat is a spelling memory.",vsNepali:"ई and यु as usual.",example:d("l'île","lil","the island")},{letter:"ù",name:"u accent grave",ipa:"y aksɑ̃ ɡʁav",sounds:"only in où",vsEnglish:"Used in one word, où, where, to tell it apart from ou, or.",vsNepali:"ऊ in où.",example:d("Où es-tu ?","u ɛty ?","Where are you?")},{letter:"ç",name:"c cédille",ipa:"se sedij",sounds:"always s",vsEnglish:"A c that sounds like s even before a, o or u.",vsNepali:"स.",example:d("le garçon","lə ɡaʁsɔ̃","the boy")},{letter:"œ",name:"e dans l'o",ipa:"ə dɑ̃ lo",sounds:"the open eu",vsEnglish:"No English match. A relaxed sound between the u of fur and the e of bed, with rounded lips.",vsNepali:"अ with rounded lips.",example:d("la sœur","la sœʁ","the sister")}],hf=[{letter:"ou",name:"",ipa:"u",sounds:"the ordinary oo",vsEnglish:"The oo of food, never the ou of house.",vsNepali:"ऊ.",example:d("vous","vu","you")},{letter:"oi",name:"",ipa:"wa",sounds:"wa",vsEnglish:"Always wa, as in the start of water.",vsNepali:"वा.",example:d("moi","mwa","me")},{letter:"oin",name:"",ipa:"wɛ̃",sounds:"w followed by the nasal e",vsEnglish:"No English match. wa with the nose open and the mouth flatter.",vsNepali:"वेँ.",example:d("loin","lwɛ̃","far")},{letter:"au, eau",name:"",ipa:"o",sounds:"closed o",vsEnglish:"A pure o, never ow.",vsNepali:"ओ.",example:d("l'eau, beau","lo, bo","water, beautiful")},{letter:"ai, ei",name:"",ipa:"ɛ",sounds:"open è",vsEnglish:"The e of bed. Never the ai of rain.",vsNepali:"ऍ. In j'ai and in verb endings -ai it is closer to ए.",example:d("la neige","la nɛʒ","the snow")},{letter:"eu, œu",name:"",ipa:"ø",sounds:"the rounded e, closed or open",vsEnglish:"No English match. Say the e of bed with rounded lips.",vsNepali:"अ॓ when it ends the syllable, अ before a spoken consonant.",example:d("deux, le cœur","dø, lə kœʁ","two, the heart")},{letter:"ui",name:"",ipa:"ɥi",sounds:"the u glide followed by ee",vsEnglish:"Like a very quick French u sliding into ee, in one beat.",vsNepali:"युई, said as one syllable.",example:d("huit","ɥit","eight")},{letter:"ien",name:"",ipa:"jɛ̃",sounds:"y followed by the nasal e",vsEnglish:"Like the yan of canyon, but nasal and with no n.",vsNepali:"येँ.",example:d("bien","bjɛ̃","well")},{letter:"an, en, am, em",name:"",ipa:"ɑ̃",sounds:"nasal a",vsEnglish:"The a of father pushed through the nose, with no n at the end.",vsNepali:"आँ.",example:d("l'enfant","lɑ̃fɑ̃","the child")},{letter:"in, im, ain, ein",name:"",ipa:"ɛ̃",sounds:"nasal e",vsEnglish:"The e of bed pushed through the nose, with no n at the end.",vsNepali:"एँ.",example:d("le pain","lə pɛ̃","the bread")},{letter:"on, om",name:"",ipa:"ɔ̃",sounds:"nasal o",vsEnglish:"A rounded o pushed through the nose, with no n at the end.",vsNepali:"ओँ.",example:d("le nom","lə nɔ̃","the name")},{letter:"un, um",name:"",ipa:"œ̃",sounds:"nasal u, often said like nasal e",vsEnglish:"No English match. Many French speakers now say it like in.",vsNepali:"अँ.",example:d("lundi","lœ̃di","Monday")},{letter:"ch",name:"",ipa:"ʃ",sounds:"sh",vsEnglish:"Always sh, never the ch of church.",vsNepali:"श.",example:d("le chat","lə ʃa","the cat")},{letter:"gn",name:"",ipa:"ɲ",sounds:"ny",vsEnglish:"The ny of canyon.",vsNepali:"ञ.",example:d("l'Espagne","lɛspaɲ","Spain")},{letter:"ph",name:"",ipa:"f",sounds:"f",vsEnglish:"f, as in English photo.",vsNepali:"फ, a true f.",example:d("la photo","la fɔto","the photo")},{letter:"th",name:"",ipa:"t",sounds:"t",vsEnglish:"Never the th of think or this. Just t.",vsNepali:"त.",example:d("le thé","lə te","the tea")},{letter:"qu",name:"",ipa:"k",sounds:"k",vsEnglish:"Just k, never kw.",vsNepali:"क.",example:d("qui","ki","who")},{letter:"gu",name:"",ipa:"ɡ",sounds:"hard g before e and i",vsEnglish:"The u is silent. It only keeps the g hard.",vsNepali:"ग.",example:d("la guitare","la ɡitaʁ","the guitar")},{letter:"ill, il",name:"",ipa:"j",sounds:"y",vsEnglish:"Usually y, not l. Exceptions: ville, mille, tranquille keep the l.",vsNepali:"य.",example:d("la fille","la fij","the girl")},{letter:"tion",name:"",ipa:"sjɔ̃",sounds:"syon",vsEnglish:"Never the shun of English nation.",vsNepali:"स्योँ.",example:d("la nation","la nasjɔ̃","the nation")},{letter:"-er, -ez, -et",name:"",ipa:"e",sounds:"é at the end of a word",vsEnglish:"The r and z are silent. -et is a little more open, like è.",vsNepali:"ए, or ऍ for -et.",example:d("le nez","lə ne","the nose")},{letter:"s, ss",name:"",ipa:"z",sounds:"z between two vowels, s when doubled",vsEnglish:"One s between vowels buzzes like z. Two make a clean s.",vsNepali:"ज़ or स.",example:d("le poisson, le poison","lə pwasɔ̃, lə pwazɔ̃","the fish, the poison")},{letter:"-ent",name:"",ipa:"ɑ̃",sounds:"nasal a, but silent in verbs",vsEnglish:"Silent at the end of a verb after ils or elles, nasal everywhere else.",vsNepali:"आँ, or nothing after ils.",example:d("ils parl(ent) souvent","il paʁl suvɑ̃","they often speak")},{letter:"y between vowels",name:"",ipa:"ɛj",sounds:"like i + i",vsEnglish:"payer is said as pai-yer: the y splits into two.",vsNepali:"ऍय.",example:d("payer","pɛje","to pay")}],Uv=[{id:"nasal",title:"Nasal vowels",rule:"French has four vowels said through the nose and the mouth at once. They are spelled with n or m after a vowel, but that n or m is not pronounced. The Devanagari marks them with ँ.",tip:"Say आ and let air escape through your nose. If your tongue touches the roof of your mouth for an n, you have gone too far.",examples:[d("le temps","lə tɑ̃","time, weather"),d("le pain","lə pɛ̃","bread"),d("bon","bɔ̃","good"),d("un","œ̃","one, a"),d("Ils sont contents.","il sɔ̃ kɔ̃tɑ̃.","They are happy.")]},{id:"u-ou",title:"u and ou",rule:"ou is the ordinary ऊ. u is a sound English and Nepali do not have: say ई, keep the tongue exactly there, and round the lips tightly. Mixing the two changes the word.",tip:"Whisper ई, then push your lips forward as if to whistle without moving your tongue.",examples:[d("vous, vu","vu, vy","you, seen"),d("tout, tu","tu, ty","all, you"),d("dessous, dessus","dəsu, dəsy","under, on top"),d("la roue, la rue","la ʁu, la ʁy","the wheel, the street")]},{id:"r",title:"The French R",rule:"The French r is made at the back of the throat, where you would gargle, near the place of ग़. The tip of the tongue stays down behind the bottom teeth. This app writes it ऱ.",tip:"Start from क, then loosen it until air rubs through instead of stopping. Practise with Paris, rouge and merci.",examples:[d("rouge","ʁuʒ","red"),d("Paris","paʁi","Paris"),d("merci","mɛʁsi","thank you"),d("trois","tʁwa","three"),d("Bonjour, Robert.","bɔ̃ʒuʁ, ʁɔbɛʁ.","Hello, Robert.")]},{id:"silent",title:"Silent final letters",rule:"Most final consonants are silent, and so is a final e. The verb ending -ent is always silent. The letters c, r, f and l are often pronounced at the end, remember them as CaReFuL. Faded letters on screen are the ones you do not say.",tip:"The -er of verbs is the big exception to CaReFuL: parler ends in ए, with no r.",examples:[d("beaucou(p)","boku","a lot"),d("ils parl(ent)","il paʁl","they speak"),d("gran(d)","ɡʁɑ̃","big"),d("avec","avɛk","with"),d("neuf","nœf","nine, new"),d("parle(r)","paʁle","to speak")]},{id:"liaison",title:"Liaison",rule:"A silent final consonant comes back to life when the next word starts with a vowel or a silent h, and the two words are said as one. s and x sound as z, d sounds as t. The tie ‿ shows where it happens.",tip:"Never after et, and never before an aspirated h: les héros is ले एऱो.",examples:[d("les‿amis","lezami","the friends"),d("vous‿avez","vuzave","you have"),d("un‿ami","œ̃nami","a friend"),d("deux‿heures","døzœʁ","two o'clock"),d("un grand‿homme","œ̃ ɡʁɑ̃tɔm","a great man")]},{id:"elision",title:"Elision",rule:"Small words ending in a vowel drop it before another vowel and take an apostrophe: le, la, je, me, te, se, de, ne and que. si becomes s' only before il and ils.",examples:[d("l'homme","lɔm","the man"),d("j'ai","ʒe","I have"),d("c'est","sɛ","it is"),d("qu'il","kil","that he"),d("s'il vous plaît","sil vu plɛ","please")]},{id:"light-e",title:"The light e that disappears",rule:"An e with no accent at the end of a syllable is a very light अ, and French drops it whenever it can. Inside a word or a phrase it disappears when only one consonant is said before it, and stays when dropping it would put three consonants together.",tip:"This is the main thing that makes beginners sound like they are reading. Drop it and you sound fluent.",examples:[d("samedi","samdi","Saturday"),d("maintenant","mɛ̃tnɑ̃","now"),d("la fenêtre","la fnɛtʁ","the window"),d("vendredi","vɑ̃dʁədi","Friday, the e stays"),d("Je ne sais pas.","ʒən sɛ pa.","I do not know.")]},{id:"eu",title:"The two eu sounds",rule:"eu has two sounds. Closed at the end of a word or before a z sound: say ए with rounded lips, written अ॓. Open before a pronounced consonant: a relaxed अ.",examples:[d("deux","dø","two"),d("peu","pø","little"),d("heureuse","œʁøz","happy, feminine"),d("la fleur","la flœʁ","the flower"),d("la sœur","la sœʁ","the sister")]},{id:"oi-gn",title:"oi and gn",rule:"oi is always वा. gn is ञ, like the ny in canyon. ill after a vowel is usually य.",examples:[d("moi","mwa","me"),d("la voiture","la vwatyʁ","the car"),d("la montagne","la mɔ̃taɲ","the mountain"),d("la campagne","la kɑ̃paɲ","the countryside"),d("le travail","lə tʁavaj","the work")]},{id:"rhythm",title:"Stress and rhythm",rule:"French words have no stressed syllable. Every syllable gets the same length and force, and only the last syllable of a group is a little longer. Say Paris as पा ऱी, evenly, not PA-ris.",tip:"Think of a sentence as a line of equal beads with a slightly bigger bead at the end.",examples:[d("Paris","paʁi","Paris"),d("la photographie","la fɔtɔɡʁafi","photography"),d("Je voudrais un café.","ʒə vudʁɛ œ̃ kafe.","I would like a coffee."),d("C'est‿impossible.","sɛtɛ̃pɔsibl.","It is impossible.")]}],Hv=[{id:"e-sounds",title:"Closed é and open è",rule:"French has two e sounds. Closed é is written é, and also -er, -ez at the end of a word and es in les, des, mes, tes, ses, ces. Open è is written è, ê, ai, ei, -et at the end of a word, and e before a pronounced consonant. The app writes the first ए and the second ऍ.",tip:"For ए smile and nearly close the mouth. For ऍ drop the jaw a little, as for the e of bed. et, and, is ए. est, is, is ऍ.",examples:[d("l'été","lete","the summer"),d("la mère","la mɛʁ","the mother"),d("le nez","lə ne","the nose"),d("la fête","la fɛt","the party"),d("le lait","lə lɛ","the milk"),d("et, est","e, ɛ","and, is")]},{id:"c-g",title:"Hard and soft c and g",rule:"c and g are hard, क and ग, before a, o, u and before consonants. They turn soft, स and झ़, before e, i and y. ç keeps a c soft before a, o, u, and an e after g does the same for g. gu keeps a g hard before e and i.",examples:[d("le café, le ciel","lə kafe, lə sjɛl","the coffee, the sky"),d("la gare, le gilet","la ɡaʁ, lə ʒilɛ","the station, the waistcoat"),d("le garçon","lə ɡaʁsɔ̃","the boy"),d("nous mangeons","nu mɑ̃ʒɔ̃","we eat"),d("la guerre","la ɡɛʁ","the war")]},{id:"s-z",title:"One s between vowels sounds like z",rule:"A single s between two vowels buzzes as z. A double ss, or an s at the start of a word or next to a consonant, is a clean s. Getting this wrong changes the word.",examples:[d("le poisson, le poison","lə pwasɔ̃, lə pwazɔ̃","the fish, the poison"),d("le dessert, le désert","lə desɛʁ, lə dezɛʁ","the dessert, the desert"),d("la maison","la mɛzɔ̃","the house"),d("la chose","la ʃoz","the thing")]},{id:"ill",title:"ill and il, the y sound",rule:"After a vowel, ill and a final il are said as य: travail, soleil. After a consonant, ill is usually ईय: fille. A few common words keep a real l: ville, mille, tranquille, and the words built on them.",examples:[d("la fille","la fij","the girl"),d("le travail","lə tʁavaj","the work"),d("la feuille","la fœj","the leaf"),d("la ville","la vil","the town"),d("mille","mil","a thousand"),d("tranquille","tʁɑ̃kil","calm, quiet")]},{id:"x",title:"The four sounds of x",rule:"x is क्स in most words, ग्ज़ in words starting ex- before a vowel, स in six, dix and soixante, and ज़ in liaison and in deuxième and sixième. At the end of a word it is usually silent.",examples:[d("le taxi","lə taksi","the taxi"),d("un‿exemple","œ̃nɛɡzɑ̃pl","an example"),d("soixante","swasɑ̃t","sixty"),d("deuxième","døzjɛm","second"),d("le pri(x)","lə pʁi","the price")]},{id:"glides",title:"Gliding i, ou and u",rule:"When i, ou or u come right before another vowel, they shrink into a quick y, w or the यु glide, and the two vowels make one syllable, not two.",examples:[d("le pied","lə pje","the foot"),d("la nation","la nasjɔ̃","the nation"),d("oui","wi","yes"),d("jouer","ʒwe","to play"),d("la nuit","la nɥi","the night")]},{id:"pure-vowels",title:"French vowels never slide",rule:"English vowels drift while you say them: go is really go-w and day is really de-y. French vowels hold still from start to finish. Keep the jaw and lips frozen until the sound ends.",tip:"Say café and stop dead on the é. If you hear a little y at the end, you are still speaking English.",examples:[d("beau","bo","beautiful"),d("le café","lə kafe","the coffee"),d("le mot","lə mo","the word"),d("le nez","lə ne","the nose")]},{id:"double",title:"Double letters are said once",rule:"French often doubles a consonant in spelling, but says it only once. A double letter mostly tells you about the vowel before it, which is open: pomme is पॉम.",examples:[d("la pomme","la pɔm","the apple"),d("la lettre","la lɛtʁ","the letter"),d("aller","ale","to go"),d("la terre","la tɛʁ","the earth")]},{id:"ent",title:"-ent, silent in verbs, nasal elsewhere",rule:"At the end of a verb after ils or elles, -ent is completely silent. Everywhere else, in nouns, adjectives and adverbs, -ent is the nasal आँ. A few words are spelled the same and only the grammar tells you which.",examples:[d("ils parl(ent)","il paʁl","they speak"),d("le moment","lə mɔmɑ̃","the moment"),d("souvent","suvɑ̃","often"),d("ils présid(ent), le président","il pʁezid, lə pʁezidɑ̃","they preside, the president"),d("lentement","lɑ̃tmɑ̃","slowly")]},{id:"liaison-rules",title:"Liaisons you must, may and must not make",rule:"Always make a liaison between a determiner and its noun, a pronoun and its verb, an adjective and the noun after it, and after short words like dans, chez, en, très. You may make it after a verb, which sounds more careful. Never make it after et, after a singular noun, or before an aspirated h.",examples:[d("mon‿ami","mɔ̃nami","my friend, always"),d("chez‿elle","ʃezɛl","at her place, always"),d("dans‿un mois","dɑ̃zœ̃ mwa","in a month, always"),d("je suis‿allé","ʒə sɥizale","I went, optional"),d("un‿étudiant anglais","œ̃netydjɑ̃ ɑ̃ɡlɛ","an English student, never after the noun")]},{id:"enchainement",title:"Linking a spoken consonant",rule:"When a word ends in a consonant you can hear and the next starts with a vowel, the consonant slides over and starts the next syllable. This is why French sounds like one long word.",examples:[d("il‿a","ila","he has"),d("elle‿aime","ɛlɛm","she loves"),d("avec‿elle","avɛkɛl","with her"),d("une‿amie","ynami","a friend"),d("Pierre‿arrive.","pjɛʁaʁiv.","Pierre is arriving.")]},{id:"h-aspire",title:"The aspirated h",rule:"h is never pronounced. But some words starting with h behave as if they started with a consonant: no liaison and no elision before them. Dictionaries mark them, and the common ones are worth learning by heart: le héros, la honte, le haricot, le hasard, la hauteur, le hibou, la Hollande, en haut.",examples:[d("les héros","le eʁo","the heroes"),d("le haricot","lə aʁiko","the bean"),d("l'homme, le héros","lɔm, lə eʁo","the man, the hero"),d("en haut","ɑ̃ o","upstairs")]},{id:"number-sounds",title:"Numbers that change before a word",rule:"six and dix drop their final sound before a consonant, and say it as z before a vowel. huit and cinq drop it before a consonant in careful speech. neuf turns its f into v before ans and heures.",examples:[d("six","sis","six"),d("si(x) livres","si livʁ","six books"),d("six‿enfants","sizɑ̃fɑ̃","six children"),d("di(x) minutes","di minyt","ten minutes"),d("neuf‿ans","nœvɑ̃","nine years")]},{id:"intonation",title:"The melody of a sentence",rule:"French rises a little at the end of each group of words and falls at the very end of a statement. A yes or no question simply rises at the end, with no change of word order. A question starting with a question word begins high and falls.",examples:[d("Tu viens.","ty vjɛ̃.","You are coming, falling"),d("Tu viens ?","ty vjɛ̃ ?","Are you coming, rising"),d("Où vas-tu ?","u vaty ?","Where are you going, high then falling"),d("Le matin, je travaille.","lə matɛ̃, ʒə tʁavaj.","In the morning I work, up then down")]}],Lv=["nasal","u-ou","r","e-sounds","eu","oi-gn","pure-vowels","c-g","s-z","ill","x","glides","double","silent","ent","light-e","elision","liaison","liaison-rules","enchainement","h-aspire","number-sounds","rhythm","intonation"],Bv=new Map([...Uv,...Hv].map(u=>[u.id,u])),Jv=Lv.map(u=>Bv.get(u)),mf=[{id:"0-20",title:"0 to 20",intro:"Learn these by heart. Everything else is built from them.",items:[{value:"0",fr:"zéro",ipa:"zeʁo"},{value:"1",fr:"un, une",ipa:"œ̃, yn",note:"une before a feminine noun: une pomme"},{value:"2",fr:"deu(x)",ipa:"dø"},{value:"3",fr:"troi(s)",ipa:"tʁwa"},{value:"4",fr:"quatre",ipa:"katʁ"},{value:"5",fr:"cinq",ipa:"sɛ̃k"},{value:"6",fr:"six",ipa:"sis",note:"si before a consonant: six livres, सी लीभ्ऱ"},{value:"7",fr:"sep(t)",ipa:"sɛt",note:"the p is silent, the t is said"},{value:"8",fr:"huit",ipa:"ɥit"},{value:"9",fr:"neuf",ipa:"nœf"},{value:"10",fr:"dix",ipa:"dis"},{value:"11",fr:"onze",ipa:"ɔ̃z"},{value:"12",fr:"douze",ipa:"duz"},{value:"13",fr:"treize",ipa:"tʁɛz"},{value:"14",fr:"quatorze",ipa:"katɔʁz"},{value:"15",fr:"quinze",ipa:"kɛ̃z"},{value:"16",fr:"seize",ipa:"sɛz"},{value:"17",fr:"dix-sept",ipa:"disɛt",note:"ten seven"},{value:"18",fr:"dix-huit",ipa:"dizɥit",note:"ten eight, the x sounds as z"},{value:"19",fr:"dix-neuf",ipa:"diznœf",note:"ten nine, the x sounds as z"},{value:"20",fr:"ving(t)",ipa:"vɛ̃"}]},{id:"tens",title:"21 to 69",intro:"Tens work as in English. Only 21, 31, 41, 51 and 61 use et, and. From 21 to 29 the t of vingt is said.",items:[{value:"21",fr:"vingt‿et un",ipa:"vɛ̃teœ̃"},{value:"22",fr:"vingt-deux",ipa:"vɛ̃tdø"},{value:"23",fr:"vingt-trois",ipa:"vɛ̃ttʁwa"},{value:"29",fr:"vingt-neuf",ipa:"vɛ̃tnœf"},{value:"30",fr:"trente",ipa:"tʁɑ̃t"},{value:"31",fr:"trente‿et un",ipa:"tʁɑ̃teœ̃"},{value:"32",fr:"trente-deux",ipa:"tʁɑ̃tdø"},{value:"40",fr:"quarante",ipa:"kaʁɑ̃t"},{value:"41",fr:"quarante‿et un",ipa:"kaʁɑ̃teœ̃"},{value:"44",fr:"quarante-quatre",ipa:"kaʁɑ̃tkatʁ"},{value:"50",fr:"cinquante",ipa:"sɛ̃kɑ̃t"},{value:"51",fr:"cinquante‿et un",ipa:"sɛ̃kɑ̃teœ̃"},{value:"57",fr:"cinquante-sept",ipa:"sɛ̃kɑ̃tsɛt"},{value:"60",fr:"soixante",ipa:"swasɑ̃t",note:"the x sounds as s"},{value:"61",fr:"soixante‿et un",ipa:"swasɑ̃teœ̃"},{value:"65",fr:"soixante-cinq",ipa:"swasɑ̃tsɛ̃k"},{value:"68",fr:"soixante-huit",ipa:"swasɑ̃tɥit"}]},{id:"70-99",title:"70, 80 and 90",intro:"The awkward ones. 70 is sixty ten, 80 is four twenties, 90 is four twenties ten. Belgium and Switzerland say septante and nonante instead.",items:[{value:"70",fr:"soixante-dix",ipa:"swasɑ̃tdis",note:"sixty ten"},{value:"71",fr:"soixante‿et onze",ipa:"swasɑ̃teɔ̃z",note:"sixty and eleven"},{value:"72",fr:"soixante-douze",ipa:"swasɑ̃tduz",note:"sixty twelve"},{value:"75",fr:"soixante-quinze",ipa:"swasɑ̃tkɛ̃z",note:"sixty fifteen"},{value:"77",fr:"soixante-dix-sept",ipa:"swasɑ̃tdisɛt",note:"sixty seventeen"},{value:"79",fr:"soixante-dix-neuf",ipa:"swasɑ̃tdiznœf",note:"sixty nineteen"},{value:"80",fr:"quatre-vingt(s)",ipa:"katʁəvɛ̃",note:"four twenties, with an s only when it ends the number"},{value:"81",fr:"quatre-vingt-un",ipa:"katʁəvɛ̃œ̃",note:"no et here, and no s on vingt"},{value:"82",fr:"quatre-vingt-deux",ipa:"katʁəvɛ̃dø"},{value:"85",fr:"quatre-vingt-cinq",ipa:"katʁəvɛ̃sɛ̃k"},{value:"88",fr:"quatre-vingt-huit",ipa:"katʁəvɛ̃ɥit",note:"the t of vingt stays silent from 81 to 99"},{value:"90",fr:"quatre-vingt-dix",ipa:"katʁəvɛ̃dis",note:"four twenties ten"},{value:"91",fr:"quatre-vingt-onze",ipa:"katʁəvɛ̃ɔ̃z",note:"four twenties eleven"},{value:"95",fr:"quatre-vingt-quinze",ipa:"katʁəvɛ̃kɛ̃z"},{value:"97",fr:"quatre-vingt-dix-sept",ipa:"katʁəvɛ̃disɛt"},{value:"99",fr:"quatre-vingt-dix-neuf",ipa:"katʁəvɛ̃diznœf"},{value:"70",en:"70 in Belgium and Switzerland",fr:"septante",ipa:"sɛptɑ̃t"},{value:"90",en:"90 in Belgium and Switzerland",fr:"nonante",ipa:"nɔnɑ̃t"}]},{id:"big",title:"100 to a billion",intro:"cent takes an s only when it is multiplied and ends the number. mille never changes. million and milliard are nouns, so they take de before what they count: un million d'habitants.",items:[{value:"100",fr:"cen(t)",ipa:"sɑ̃"},{value:"101",fr:"cent un",ipa:"sɑ̃œ̃"},{value:"110",fr:"cent dix",ipa:"sɑ̃ dis"},{value:"150",fr:"cent cinquante",ipa:"sɑ̃ sɛ̃kɑ̃t"},{value:"200",fr:"deux cent(s)",ipa:"dø sɑ̃"},{value:"250",fr:"deux cent cinquante",ipa:"dø sɑ̃ sɛ̃kɑ̃t",note:"no s on cent when another number follows"},{value:"300",fr:"trois cent(s)",ipa:"tʁwa sɑ̃"},{value:"999",fr:"neuf cent quatre-vingt-dix-neuf",ipa:"nœf sɑ̃ katʁəvɛ̃diznœf"},{value:"1 000",fr:"mille",ipa:"mil",note:"never un mille, just mille"},{value:"1 001",fr:"mille un",ipa:"mil œ̃"},{value:"1 500",fr:"mille cinq cent(s)",ipa:"mil sɛ̃ sɑ̃",note:"the q of cinq is dropped before cents"},{value:"2 000",fr:"deux mille",ipa:"dø mil",note:"never milles"},{value:"10 000",fr:"di(x) mille",ipa:"di mil"},{value:"100 000",fr:"cent mille",ipa:"sɑ̃ mil"},{value:"1 000 000",fr:"un million",ipa:"œ̃ miljɔ̃"},{value:"2 000 000",fr:"deux millions",ipa:"dø miljɔ̃"},{value:"1 000 000 000",fr:"un milliar(d)",ipa:"œ̃ miljaʁ"}]},{id:"years",title:"Years",intro:"Years are read as one full number, never split in two as English does.",items:[{value:"1990",fr:"mille neuf cent quatre-vingt-dix",ipa:"mil nœf sɑ̃ katʁəvɛ̃dis"},{value:"2000",fr:"l'an deux mille",ipa:"lɑ̃ dø mil",en:"the year 2000"},{value:"2026",fr:"en deux mille vingt-six",ipa:"ɑ̃ dø mil vɛ̃tsis",en:"in 2026"}]},{id:"ordinals",title:"First, second, third",intro:"Add -ième to the number, dropping a final e. Only first is irregular. Written 1er, 2e, 3e.",items:[{value:"1er",fr:"premier, première",ipa:"pʁəmje, pʁəmjɛʁ",en:"first",note:"the only irregular one, with a feminine form"},{value:"2e",fr:"deuxième",ipa:"døzjɛm",en:"second",note:"also second, seconde when there are only two"},{value:"3e",fr:"troisième",ipa:"tʁwazjɛm",en:"third"},{value:"4e",fr:"quatrième",ipa:"katʁijɛm",en:"fourth",note:"quatre loses its e"},{value:"5e",fr:"cinquième",ipa:"sɛ̃kjɛm",en:"fifth",note:"cinq takes a u"},{value:"6e",fr:"sixième",ipa:"sizjɛm",en:"sixth"},{value:"7e",fr:"septième",ipa:"sɛtjɛm",en:"seventh"},{value:"8e",fr:"huitième",ipa:"ɥitjɛm",en:"eighth"},{value:"9e",fr:"neuvième",ipa:"nœvjɛm",en:"ninth",note:"the f of neuf becomes v"},{value:"10e",fr:"dixième",ipa:"dizjɛm",en:"tenth"},{value:"11e",fr:"onzième",ipa:"ɔ̃zjɛm",en:"eleventh"},{value:"20e",fr:"vingtième",ipa:"vɛ̃tjɛm",en:"twentieth"},{value:"21e",fr:"vingt‿et unième",ipa:"vɛ̃teynjɛm",en:"twenty first"},{value:"100e",fr:"centième",ipa:"sɑ̃tjɛm",en:"hundredth"}]},{id:"days",title:"Days of the week",intro:"Days and months take no capital letter in French. The week starts on Monday.",items:[{value:"Mon",en:"Monday",fr:"lundi",ipa:"lœ̃di"},{value:"Tue",en:"Tuesday",fr:"mardi",ipa:"maʁdi"},{value:"Wed",en:"Wednesday",fr:"mercredi",ipa:"mɛʁkʁədi"},{value:"Thu",en:"Thursday",fr:"jeudi",ipa:"ʒødi"},{value:"Fri",en:"Friday",fr:"vendredi",ipa:"vɑ̃dʁədi"},{value:"Sat",en:"Saturday",fr:"samedi",ipa:"samdi"},{value:"Sun",en:"Sunday",fr:"dimanche",ipa:"dimɑ̃ʃ"},{value:"on Mon",en:"every Monday",fr:"le lundi",ipa:"lə lœ̃di",note:"le + day means every week on that day"}]},{id:"months",title:"Months",intro:"en or au mois de before a month: en mai, in May.",items:[{value:"Jan",en:"January",fr:"janvier",ipa:"ʒɑ̃vje"},{value:"Feb",en:"February",fr:"février",ipa:"fevʁije"},{value:"Mar",en:"March",fr:"mars",ipa:"maʁs",note:"the s is said"},{value:"Apr",en:"April",fr:"avril",ipa:"avʁil"},{value:"May",en:"May",fr:"mai",ipa:"mɛ"},{value:"Jun",en:"June",fr:"juin",ipa:"ʒɥɛ̃"},{value:"Jul",en:"July",fr:"juillet",ipa:"ʒɥijɛ"},{value:"Aug",en:"August",fr:"aoû(t)",ipa:"ut",note:"said ऊत or ऊ, the a is silent"},{value:"Sep",en:"September",fr:"septembre",ipa:"sɛptɑ̃bʁ",note:"here the p is said"},{value:"Oct",en:"October",fr:"octobre",ipa:"ɔktɔbʁ"},{value:"Nov",en:"November",fr:"novembre",ipa:"nɔvɑ̃bʁ"},{value:"Dec",en:"December",fr:"décembre",ipa:"desɑ̃bʁ"}]},{id:"dates",title:"Dates",intro:"le + number + month. Only the first of the month uses an ordinal.",items:[{value:"1/5",en:"the first of May",fr:"le premier mai",ipa:"lə pʁəmje mɛ"},{value:"14/7",en:"the fourteenth of July",fr:"le quatorze juillet",ipa:"lə katɔʁz ʒɥijɛ",note:"Bastille Day"},{value:"19/10",en:"Monday the nineteenth of October",fr:"lundi dix-neuf octobre",ipa:"lœ̃di diznœf ɔktɔbʁ"},{value:"8/3",en:"the eighth of March",fr:"le huit mars",ipa:"lə ɥit maʁs",note:"no elision before huit: le huit, never l'huit"},{value:"11/9",en:"the eleventh of September",fr:"le onze septembre",ipa:"lə ɔ̃z sɛptɑ̃bʁ",note:"no elision before onze either"},{value:"date",en:"What is the date today?",fr:"On est le combien aujourd'hui ?",ipa:"ɔ̃nɛ lə kɔ̃bjɛ̃ oʒuʁdɥi ?",note:"everyday way to ask the date"}]},{id:"time",title:"Telling the time",intro:"Il est + number + heure(s). Timetables and shops use the 24 hour clock.",items:[{value:"ask",en:"What time is it?",fr:"Quelle heure est-il ?",ipa:"kɛlœʁ ɛtil ?"},{value:"1:00",en:"It is one o'clock.",fr:"Il est‿une heure.",ipa:"ilɛtynœʁ."},{value:"2:00",en:"It is two o'clock.",fr:"Il est deux‿heures.",ipa:"ilɛ døzœʁ."},{value:"3:15",en:"It is quarter past three.",fr:"Il est trois‿heures et quart.",ipa:"ilɛ tʁwazœʁ e kaʁ."},{value:"4:30",en:"It is half past four.",fr:"Il est quatre heures et demie.",ipa:"ilɛ katʁœʁ e dəmi."},{value:"5:45",en:"It is quarter to six.",fr:"Il est six‿heures moins le quart.",ipa:"ilɛ sizœʁ mwɛ̃ lə kaʁ.",note:"six hours minus the quarter"},{value:"6:10",en:"ten past six",fr:"six‿heures dix",ipa:"sizœʁ dis"},{value:"7:50",en:"ten to eight",fr:"huit‿heures moins dix",ipa:"ɥitœʁ mwɛ̃ dis"},{value:"12:00",en:"noon",fr:"midi",ipa:"midi"},{value:"0:00",en:"midnight",fr:"minuit",ipa:"minɥi"},{value:"13:00",en:"1 pm",fr:"treize heures",ipa:"tʁɛzœʁ"},{value:"20:30",en:"8.30 pm",fr:"vingt‿heures trente",ipa:"vɛ̃tœʁ tʁɑ̃t"},{value:"at 9",en:"at nine o'clock",fr:"à neuf‿heures",ipa:"a nœvœʁ",note:"neuf becomes नभ before heures"}]},{id:"money",title:"Money and prices",intro:"French writes a comma for decimals and a space between thousands: 1 250,50 €. Say the euros, then the cents, often without t level:"A1",theme:"work",ex:d("Je vais au travail.","ʒə vɛ o tʁavaj.","I am going to work.")},{fr:"le téléphone",ipa:"lə telefɔn",pos:"noun",gender:"m",en:"phone",level:"A1",theme:"technology",ex:d("Mon téléphone ne marche pas.","mɔ̃ telefɔn nə maʁʃ pa.","My phone is not working.")},{fr:"l'ordinateur",ipa:"lɔʁdinatœʁ",pos:"noun",gender:"m",en:"computer",level:"A1",theme:"technology",ex:d("J'ai un nouvel‿ordinateur.","ʒe œ̃ nuvɛlɔʁdinatœʁ.","I have a new computer.")},{fr:"la montagne",ipa:"la mɔ̃taɲ",pos:"noun",gender:"f",en:"mountain",level:"A1",theme:"nature",ex:d("Le Népal a de très hautes montagnes.","lə nepal a də tʁɛ ot mɔ̃taɲ.","Nepal has very high mountains.")},{fr:"l'arbre",ipa:"laʁbʁ",pos:"noun",gender:"m",en:"tree",level:"A1",theme:"nature",ex:d("Il y a un‿arbre devant la maison.","ilja œ̃naʁbʁ dəvɑ̃ la mɛzɔ̃.","There is a tree in front of the house.")},{fr:"le chat",ipa:"lə ʃa",pos:"noun",gender:"m",en:"cat",level:"A1",theme:"nature",ex:d("Le chat dort sur le lit.","lə ʃa dɔʁ syʁ lə li.","The cat is sleeping on the bed.")},{fr:"la chemise",ipa:"la ʃəmiz",pos:"noun",gender:"f",en:"shirt",level:"A1",theme:"clothes",ex:d("Cette chemise est trop grande.","sɛt ʃəmiz ɛ tʁo ɡʁɑ̃d.","This shirt is too big.")},{fr:"heureux",ipa:"œʁø",pos:"adjective",fem:{fr:"heureuse",ipa:"œʁøz"},en:"happy",level:"A1",theme:"emotions",ex:d("Je suis très‿heureux.","ʒə sɥi tʁɛzœʁø.","I am very happy.")},{fr:"triste",ipa:"tʁist",pos:"adjective",en:"sad",level:"A1",theme:"emotions",ex:d("Pourquoi es-tu triste ?","puʁkwa ɛty tʁist ?","Why are you sad?")},{fr:"grand",ipa:"ɡʁɑ̃",pos:"adjective",fem:{fr:"grande",ipa:"ɡʁɑ̃d"},en:"big, tall",level:"A1",theme:"basics",ex:d("Mon frère est grand.","mɔ̃ fʁɛʁ ɛ ɡʁɑ̃.","My brother is tall.")},{fr:"petit",ipa:"pəti",pos:"adjective",fem:{fr:"petite",ipa:"pətit"},en:"small, little",level:"A1",theme:"basics",ex:d("J'ai un petit chien.","ʒe œ̃ pəti ʃjɛ̃.","I have a small dog.")},{fr:"bon",ipa:"bɔ̃",pos:"adjective",fem:{fr:"bonne",ipa:"bɔn"},en:"good",level:"A1",theme:"basics",ex:d("C'est très bon !","sɛ tʁɛ bɔ̃ !","It is very good!")},{fr:"beau",ipa:"bo",pos:"adjective",fem:{fr:"belle",ipa:"bɛl"},en:"beautiful, handsome",level:"A1",theme:"basics",ex:d("Il fait beau aujourd'hui.","il fɛ bo oʒuʁdɥi.","The weather is nice today.")},{fr:"cher",ipa:"ʃɛʁ",pos:"adjective",en:"expensive, dear",level:"A1",theme:"shopping",ex:d("C'est trop cher.","sɛ tʁo ʃɛʁ.","It is too expensive.")},{fr:"manger",ipa:"mɑ̃ʒe",pos:"verb",en:"to eat",level:"A1",theme:"food",ex:d("On mange à midi.","ɔ̃ mɑ̃ʒ a midi.","We eat at noon.")},{fr:"parler",ipa:"paʁle",pos:"verb",en:"to speak, to talk",level:"A1",theme:"basics",ex:d("Vous parlez français ?","vu paʁle fʁɑ̃sɛ ?","Do you speak French?")},{fr:"aimer",ipa:"eme",pos:"verb",en:"to love, to like",level:"A1",theme:"emotions",ex:d("J'aime le chocolat.","ʒɛm lə ʃɔkɔla.","I love chocolate.")},{fr:"acheter",ipa:"aʃte",pos:"verb",en:"to buy",level:"A1",theme:"shopping",ex:d("Je voudrais acheter un billet.","ʒə vudʁɛ aʃte œ̃ bijɛ.","I would like to buy a ticket.")}],...Yv,...Gv,...Qv,...Vv],Xv=[{id:"partitive",title:"du, de la, des: some",level:"A1",topic:"Gender and articles",rule:"For an amount of something you cannot count, French uses du for masculine words, de la for feminine words, de l' before a vowel, and des for plurals. English often says some or nothing at all, but French always needs the article.",why:"French does not allow a bare noun after a verb. Je mange pain is impossible. du and de la are de joined with le and la, and they mean a part of something, not all of it.",examples:[d("Je bois du café.","ʒə bwa dy kafe.","I drink coffee."),d("Tu veux de la soupe ?","ty vø də la sup ?","Do you want some soup?"),d("Il y a de l'eau.","ilja də lo.","There is some water."),d("J'achète des pommes.","ʒaʃɛt de pɔm.","I am buying apples.")],mistakes:[{wrong:"Je mange pain.",right:"Je mange du pain.",note:"A noun after a verb needs an article."},{wrong:"J'aime du café.",right:"J'aime le café.",note:"With aimer, adorer, détester and préférer you talk about a thing in general, so use le, la, les."}],exceptions:["After a negative, du, de la and des all become de: je ne bois pas de café.","After amounts too: beaucoup de café, un kilo de pommes, un peu d'eau."]},{id:"contractions",title:"au, aux, du, des: à and de with le",level:"A1",topic:"Gender and articles",rule:"When à or de meets le or les, they melt into one word. à + le is au, à + les is aux, de + le is du, de + les is des. With la and l' nothing changes: à la, à l', de la, de l'.",why:"It is purely a sound rule, as old as the language. Nobody ever says à le. It is one of the most common words you will hear.",examples:[d("Je vais au cinéma.","ʒə vɛ o sinema.","I am going to the cinema."),d("Il parle aux‿enfants.","il paʁl ozɑ̃fɑ̃.","He is talking to the children."),d("Je viens du Népal.","ʒə vjɛ̃ dy nepal.","I come from Nepal."),d("Elle est à la gare.","ɛlɛ a la ɡaʁ.","She is at the station."),d("le livre de l'étudiant","lə livʁ də letydjɑ̃","the student's book")],mistakes:[{wrong:"Je vais à le marché.",right:"Je vais au marché.",note:"à + le always becomes au."},{wrong:"la voiture de le professeur",right:"la voiture du professeur",note:"de + le always becomes du."}]},{id:"plurals",title:"Making nouns plural",level:"A1",topic:"Plurals",rule:"Most nouns add an s in the plural, and that s is silent. You hear the plural only in the article: le livre, les livres sound the same apart from ल and ले. Nouns in -eau and -eu add x, nouns in -al usually change to -aux, and nouns already ending in s, x or z do not change.",why:"Because the s is silent, French relies on le, la and les to tell one from many. Listen to the little word before the noun.",examples:[d("le livre, les livres","lə livʁ, le livʁ","the book, the books"),d("un gâteau, des gâteaux","œ̃ ɡato, de ɡato","a cake, cakes"),d("un journal, des journaux","œ̃ ʒuʁnal, de ʒuʁno","a newspaper, newspapers"),d("le prix, les prix","lə pʁi, le pʁi","the price, the prices"),d("un œil, des‿yeux","œ̃nœj, dezjø","an eye, eyes")],mistakes:[{wrong:"les livres, said ले लीभ्ऱस",right:"les livres, said ले लीभ्ऱ",note:"The plural s is never pronounced, except in liaison."},{wrong:"des gâteaus",right:"des gâteaux",note:"Nouns in -eau take x."}],exceptions:["Some -al nouns just add s: les festivals, les bals.","Seven nouns in -ou take x: bijou, caillou, chou, genou, hibou, joujou, pou. Everything else in -ou takes s.","Truly irregular: un œil, des yeux. le ciel, les cieux. monsieur, messieurs. madame, mesdames."]},{id:"adjective-agreement",title:"Adjectives agree with their noun",level:"A1",topic:"Adjectives",rule:"An adjective takes the gender and number of its noun. Add e for feminine and s for plural. Often you only hear the change in the feminine, where a silent final consonant comes back to life: petit is पती, petite is पतीत.",why:"Agreement ties the description to the right noun. For your ear, the feminine is the useful clue: if you hear the last consonant, the noun is probably feminine.",examples:[d("un petit chat, une petite maison","œ̃ pəti ʃa, yn pətit mɛzɔ̃","a little cat, a little house"),d("Il est grand. Elle est grande.","ilɛ ɡʁɑ̃. ɛlɛ ɡʁɑ̃d.","He is tall. She is tall."),d("des chemises bleues","de ʃəmiz blø","blue shirts"),d("un homme heureux, une femme heureuse","œ̃nɔm œʁø, yn fam œʁøz","a happy man, a happy woman")],mistakes:[{wrong:"Elle est content.",right:"Elle est contente.",note:"The adjective follows the person, here feminine."},{wrong:"une table noire, said with no r",right:"une table noire, said with the r",note:"noir and noire sound the same, both with ऱ. Only adjectives with a silent final consonant change sound."}],exceptions:["Adjectives already ending in e do not change for feminine: jeune, rouge, facile.","Common patterns: -eux becomes -euse (heureuse), -if becomes -ive (sportive), -er becomes -ère (chère), -on becomes -onne (bonne), -el becomes -elle.","beau, nouveau and vieux have a special form before a masculine vowel: un bel homme, un nouvel ami, un vieil arbre."]},{id:"subject-pronouns",title:"Subject pronouns, and tu or vous",level:"A1",topic:"Pronouns",rule:"je I, tu you, il he or it, elle she or it, on we or one, nous we, vous you, ils they, elles they for an all female group. tu is for one person you know well. vous is for one person you do not know well, or for any group.",why:"tu and vous work like तँ, तिमी and तपाईं in Nepali: they show closeness and respect. Use vous with strangers, shopkeepers and anyone older or senior, until they suggest tu.",examples:[d("Tu viens ce soir ?","ty vjɛ̃ sə swaʁ ?","Are you coming tonight? to a friend"),d("Vous‿êtes madame Martin ?","vuzɛt madam maʁtɛ̃ ?","Are you Mrs Martin? polite"),d("On va au cinéma.","ɔ̃ va o sinema.","We are going to the cinema."),d("Ils sont‿étudiants.","il sɔ̃tetydjɑ̃.","They are students.")],mistakes:[{wrong:"Tu‿es le directeur ?",right:"Vous‿êtes le directeur ?",note:"Saying tu to a stranger or a boss sounds rude."},{wrong:"On allons au parc.",right:"On va au parc.",note:"on means we but takes the il form of the verb."}],exceptions:["In speech, on replaces nous almost all the time: on y va, let's go.","A mixed group of men and women is ils, even if only one is a man."]},{id:"object-pronouns",title:"Object pronouns: le, la, les, lui, leur",level:"A2",topic:"Pronouns",rule:"To avoid repeating a noun, French replaces it with a short pronoun placed before the verb. le, la, les replace a direct object, the thing or person the action happens to. lui and leur replace a person after à. me, te, nous, vous work for both.",why:"English puts the pronoun after the verb, I see him. French puts it before, je le vois, I him see. This is the single biggest word order change for an English speaker.",examples:[d("Je vois Marie. Je la vois.","ʒə vwa maʁi. ʒə la vwa.","I see Marie. I see her."),d("Tu aimes ce film ? Oui, je l'aime.","ty ɛm sə film ? wi, ʒə lɛm.","Do you like this film? Yes, I like it."),d("Je parle à Paul. Je lui parle.","ʒə paʁl a pɔl. ʒə lɥi paʁl.","I speak to Paul. I speak to him."),d("Il nous‿invite.","il nuzɛ̃vit.","He is inviting us."),d("Je ne les connais pas.","ʒən le kɔnɛ pa.","I do not know them.")],mistakes:[{wrong:"Je vois la.",right:"Je la vois.",note:"The pronoun goes before the verb."},{wrong:"Je le parle.",right:"Je lui parle.",note:"parler à takes lui, because of the à."}],exceptions:["In a positive command the pronoun goes after, joined by a hyphen, and me becomes moi: regarde-moi, donne-le.","With two verbs it goes before the infinitive: je vais le faire."]},{id:"y-en",title:"y and en",level:"A2",topic:"Pronouns",rule:"y replaces a place or anything after à: j'y vais, I am going there. en replaces anything after de, including amounts: j'en veux deux, I want two of them. Both go before the verb.",why:"These two tiny words are everywhere in speech and have no English equivalent. They let you answer without repeating the noun.",examples:[d("Tu vas à Paris ? Oui, j'y vais.","ty va a paʁi ? wi, ʒi vɛ.","Are you going to Paris? Yes, I am going there."),d("On‿y va !","ɔ̃nija !","Let's go!"),d("Tu as des frères ? J'en‿ai deux.","ty a de fʁɛʁ ? ʒɑ̃ne dø.","Do you have brothers? I have two."),d("Il y a du pain ? Oui, il y en a.","ilja dy pɛ̃ ? wi, iljɑ̃na.","Is there any bread? Yes, there is some.")],mistakes:[{wrong:"J'ai deux.",right:"J'en ai deux.",note:"With a number and no noun, French needs en."},{wrong:"Je vais.",right:"J'y vais.",note:"aller always needs a place, and y stands for it."}]},{id:"possessives",title:"My, your, his: mon, ma, mes",level:"A1",topic:"Possessives and demonstratives",rule:"The possessive agrees with the thing owned, not with the owner. mon, ton, son before a masculine noun, ma, ta, sa before a feminine one, mes, tes, ses for plurals. notre, votre, leur for one thing, nos, vos, leurs for several.",why:"son and sa mean both his and her. sa voiture can be his car or her car: the car is feminine, the owner does not matter.",examples:[d("mon frère, ma sœur, mes parents","mɔ̃ fʁɛʁ, ma sœʁ, me paʁɑ̃","my brother, my sister, my parents"),d("Paul et sa mère","pɔl e sa mɛʁ","Paul and his mother"),d("Marie et son père","maʁi e sɔ̃ pɛʁ","Marie and her father"),d("C'est votre valise ?","sɛ vɔtʁ valiz ?","Is this your suitcase?"),d("mon‿amie","mɔ̃nami","my friend, female")],mistakes:[{wrong:"Marie et sa père",right:"Marie et son père",note:"père is masculine, so son, whoever the owner is."},{wrong:"ma amie",right:"mon amie",note:"Before a vowel sound, ma, ta, sa become mon, ton, son, for the sound."}]},{id:"demonstratives",title:"This and that: ce, cet, cette, ces",level:"A1",topic:"Possessives and demonstratives",rule:"ce before a masculine noun, cet before a masculine noun starting with a vowel or silent h, cette before a feminine noun, ces for all plurals. Add -ci for this one here and -là for that one there.",why:"French uses one word for this and that, and only adds -ci or -là when you need to contrast two things.",examples:[d("ce livre","sə livʁ","this book"),d("cet‿homme","sɛtɔm","this man"),d("cette ville","sɛt vil","this town"),d("ces chaussures","se ʃosyʁ","these shoes"),d("Je préfère ce pull-ci.","ʒə pʁefɛʁ sə pylsi.","I prefer this jumper here.")],mistakes:[{wrong:"ce‿ami",right:"cet‿ami",note:"Before a vowel, ce becomes cet. It sounds just like cette."}]},{id:"questions",title:"Asking questions",level:"A1",topic:"Questions",rule:"There are three ways to ask the same question. Raise your voice at the end: Tu viens ? Put est-ce que in front: Est-ce que tu viens ? Or swap the verb and pronoun, which is formal: Viens-tu ? Question words go at the start or, in speech, at the end.",why:"The three ways differ only in formality. In everyday speech French people mostly use the rising voice. Inversion is for writing and polite speech.",examples:[d("Tu parles français ?","ty paʁl fʁɑ̃sɛ ?","Do you speak French? everyday"),d("Est-ce que tu parles français ?","ɛskə ty paʁl fʁɑ̃sɛ ?","Do you speak French? neutral"),d("Parlez-vous français ?","paʁle vu fʁɑ̃sɛ ?","Do you speak French? formal"),d("Où est-ce que tu habites ?","u ɛskə ty abit ?","Where do you live?"),d("Tu habites où ?","ty abit u ?","Where do you live? everyday")],mistakes:[{wrong:"Est-ce que tu viens, said with the voice falling",right:"Est-ce que tu viens ? with the voice rising",note:"A yes or no question rises at the end."},{wrong:"Parle-il français ?",right:"Parle-t-il français ?",note:"In inversion, add t between two vowels so they do not clash."}],exceptions:["Question words: qui who, quoi or que what, où where, quand when, comment how, pourquoi why, combien how much, quel which.","quel agrees with its noun: quel livre, quelle heure, quels amis, quelles villes."]},{id:"places",title:"à, en, au with towns and countries",level:"A1",topic:"Prepositions",rule:"For towns use à: à Paris, à Katmandou. For feminine countries, most ending in e, use en: en France, en Inde. For masculine countries use au: au Népal, au Japon. For plural countries use aux: aux États-Unis. The same words mean both in and to.",why:"The preposition follows the gender of the country. Learn each country with its article: la France, le Népal, les États-Unis.",examples:[d("J'habite à Katmandou.","ʒabit a katmandu.","I live in Kathmandu."),d("Je vais en France.","ʒə vɛ ɑ̃ fʁɑ̃s.","I am going to France."),d("Il travaille au Népal.","il tʁavaj o nepal.","He works in Nepal."),d("Elle vit aux‿États-Unis.","ɛl vi ozetazyni.","She lives in the United States.")],mistakes:[{wrong:"en Népal",right:"au Népal",note:"le Népal is masculine."},{wrong:"à France",right:"en France",note:"à is for towns, en for feminine countries."}],exceptions:["Masculine countries starting with a vowel take en: en Iran, en Irak.","From a place: de for towns and feminine countries (je viens de France), du for masculine (du Népal), des for plural (des États-Unis)."]},{id:"prepositions-place",title:"Where things are",level:"A1",topic:"Prepositions",rule:"dans in, sur on, sous under, devant in front of, derrière behind, entre between, à côté de next to, en face de opposite, près de near, loin de far from. The ones ending in de follow the de rules: à côté du parc.",why:"These are the words you need to ask for and give directions.",examples:[d("Le chat est sous la table.","lə ʃa ɛ su la tabl.","The cat is under the table."),d("La banque est‿à côté de la poste.","la bɑ̃k ɛta kote də la pɔst.","The bank is next to the post office."),d("Il y a un café en face du musée.","ilja œ̃ kafe ɑ̃ fas dy myze.","There is a café opposite the museum."),d("J'habite près de la gare.","ʒabit pʁɛ də la ɡaʁ.","I live near the station.")],mistakes:[{wrong:"à côté de le parc",right:"à côté du parc",note:"de + le becomes du."}]},{id:"comparison",title:"More, less, as: comparing",level:"A2",topic:"Comparatives",rule:"plus ... que more than, moins ... que less than, aussi ... que as ... as, with adjectives and adverbs. For the most, put le, la or les before plus: le plus grand, the biggest.",why:"French builds every comparison with the same three words instead of adding -er and -est.",examples:[d("Paris est plus grand que Lyon.","paʁi ɛ ply ɡʁɑ̃ kə ljɔ̃.","Paris is bigger than Lyon."),d("Le train est moins cher que l'avion.","lə tʁɛ̃ ɛ mwɛ̃ ʃɛʁ kə lavjɔ̃.","The train is cheaper than the plane."),d("Il est‿aussi grand que moi.","ilɛtosi ɡʁɑ̃ kə mwa.","He is as tall as me."),d("C'est la plus belle ville du monde.","sɛ la ply bɛl vil dy mɔ̃d.","It is the most beautiful city in the world.")],mistakes:[{wrong:"plus bon",right:"meilleur",note:"good, better, best: bon, meilleur, le meilleur."},{wrong:"plus bien",right:"mieux",note:"well, better: bien, mieux. Je parle mieux maintenant."},{wrong:"plus grand de Lyon",right:"plus grand que Lyon",note:"than is que. de is used after a superlative: le plus grand du monde."}],exceptions:["With nouns use plus de, moins de, autant de: plus de temps, autant d'amis."]},{id:"relatives",title:"qui, que, où, dont: who, which, that",level:"A2",topic:"Relative clauses",rule:"qui when the next word is a verb, because qui is the subject. que when a new subject follows. où for places and times, where or when. dont replaces something after de: whose, of which.",why:"English can often drop that: the book I read. French never can: le livre que je lis. Choosing qui or que is about grammar, not about people or things.",examples:[d("L'homme qui parle est mon père.","lɔm ki paʁl ɛ mɔ̃ pɛʁ.","The man who is speaking is my father."),d("Le livre que je lis est‿intéressant.","lə livʁ kə ʒə li ɛtɛ̃teʁesɑ̃.","The book I am reading is interesting."),d("La ville où j'habite est petite.","la vil u ʒabit ɛ pətit.","The town where I live is small."),d("Le jour où je suis‿arrivé, il pleuvait.","lə ʒuʁ u ʒə sɥizaʁive, il pløvɛ.","The day I arrived, it was raining."),d("le film dont je parle","lə film dɔ̃ ʒə paʁl","the film I am talking about")],mistakes:[{wrong:"Le livre je lis",right:"Le livre que je lis",note:"French never drops que."},{wrong:"L'homme que parle",right:"L'homme qui parle",note:"A verb comes straight after, so qui."}],exceptions:["que becomes qu' before a vowel: le film qu'il regarde. qui never changes."]},{id:"present-regular",title:"The present tense of regular verbs",level:"A1",topic:"Verb tenses",rule:"Take off -er, -ir or -re and add the endings. -er: e, es, e, ons, ez, ent. -ir: is, is, it, issons, issez, issent. -re: s, s, nothing, ons, ez, ent. The present covers both I speak and I am speaking.",why:"French has no separate -ing tense. je mange means I eat and I am eating. For something happening right now you can add être en train de: je suis en train de manger.",examples:[d("Je parle, nous parlons.","ʒə paʁl, nu paʁlɔ̃.","I speak, we speak."),d("Tu finis à quelle heure ?","ty fini a kɛlœʁ ?","What time do you finish?"),d("Ils vendent des fruits.","il vɑ̃d de fʁɥi.","They sell fruit."),d("Je suis‿en train de cuisiner.","ʒə sɥizɑ̃ tʁɛ̃ də kɥizine.","I am cooking right now.")],mistakes:[{wrong:"Je suis manger.",right:"Je mange.",note:"Never put être before another verb to make an -ing form."},{wrong:"ils parlent, said ईल पाऱ्लाँ",right:"ils parlent, said ईल पाऱ्ल",note:"The -ent of verbs is always silent."}]},{id:"passe-compose",title:"The passé composé: what happened",level:"A1",topic:"Verb tenses",rule:"For a completed action in the past, use avoir or être in the present plus the past participle: j'ai mangé, je suis allé. Most verbs use avoir. About twenty verbs of movement or change of state use être, and so do all reflexive verbs.",why:"It is the everyday past tense, for I did and I have done alike. The être verbs are worth learning as a group: aller, venir, arriver, partir, entrer, sortir, monter, descendre, naître, mourir, rester, tomber, retourner, rentrer, devenir, revenir.",examples:[d("J'ai mangé une pomme.","ʒe mɑ̃ʒe yn pɔm.","I ate an apple."),d("Nous‿avons fini.","nuzavɔ̃ fini.","We have finished."),d("Elle est partie hier.","ɛlɛ paʁti jɛʁ.","She left yesterday."),d("Ils sont venus en train.","il sɔ̃ vəny ɑ̃ tʁɛ̃.","They came by train."),d("Je me suis levé tôt.","ʒə mə sɥi ləve to.","I got up early.")],mistakes:[{wrong:"J'ai allé au cinéma.",right:"Je suis allé au cinéma.",note:"aller takes être."},{wrong:"Elle est parti.",right:"Elle est partie.",note:"With être the participle agrees with the subject, like an adjective."}],exceptions:["Regular participles: -er gives é (parlé), -ir gives i (fini), -re gives u (vendu).","Common irregular participles: fait, dit, pris, mis, écrit, vu, lu, bu, eu, été, pu, voulu, su, venu, ouvert."]},{id:"imparfait",title:"Imparfait or passé composé",level:"A2",topic:"Verb tenses",rule:"The imparfait describes how things were, what used to happen, and what was going on. The passé composé tells what happened, a single completed event. In a story, the imparfait sets the scene and the passé composé moves the action.",why:"Think of a film: the imparfait is the background, the passé composé is what happens in front of it. Il pleuvait quand je suis sorti, it was raining when I went out.",examples:[d("Quand j'étais petit, j'habitais à Pokhara.","kɑ̃ ʒetɛ pəti, ʒabitɛ a pɔkaʁa.","When I was little, I lived in Pokhara."),d("Il pleuvait quand je suis sorti.","il pløvɛ kɑ̃ ʒə sɥi sɔʁti.","It was raining when I went out."),d("Avant, on allait à la plage chaque été.","avɑ̃, ɔ̃nalɛ a la plaʒ ʃak ete.","We used to go to the beach every summer."),d("Hier, je suis‿allé à la plage.","jɛʁ, ʒə sɥizale a la plaʒ.","Yesterday I went to the beach.")],mistakes:[{wrong:"Quand j'ai été petit...",right:"Quand j'étais petit...",note:"A description of a past state takes the imparfait."},{wrong:"Hier, j'allais au cinéma.",right:"Hier, je suis allé au cinéma.",note:"A single completed event takes the passé composé."}],exceptions:["Form the imparfait from the nous form of the present without -ons, then add ais, ais, ait, ions, iez, aient. Only être is irregular: j'étais."]},{id:"future",title:"Talking about the future",level:"A1",topic:"Verb tenses",rule:"For plans and the near future, use aller + infinitive: je vais manger, I am going to eat. For the future in general, use the futur simple: the infinitive plus ai, as, a, ons, ez, ont. je mangerai, I will eat.",why:"aller + infinitive is what you will hear most in conversation, and it needs only one verb to learn. The futur simple is more formal and more certain.",examples:[d("Je vais partir demain.","ʒə vɛ paʁtiʁ dəmɛ̃.","I am going to leave tomorrow."),d("On va voir.","ɔ̃ va vwaʁ.","We will see."),d("Je parlerai français couramment.","ʒə paʁləʁe fʁɑ̃sɛ kuʁamɑ̃.","I will speak French fluently."),d("Quand tu seras grand, tu comprendras.","kɑ̃ ty səʁa ɡʁɑ̃, ty kɔ̃pʁɑ̃dʁa.","When you are older, you will understand.")],mistakes:[{wrong:"Quand je suis à Paris, je t'appellerai.",right:"Quand je serai à Paris, je t'appellerai.",note:"After quand about the future, French uses the future in both parts."}],exceptions:["Irregular future stems: être ser-, avoir aur-, aller ir-, faire fer-, pouvoir pourr-, vouloir voudr-, voir verr-, venir viendr-, devoir devr-, savoir saur-."]},{id:"conditional",title:"The conditional: would",level:"A2",topic:"Verb tenses",rule:"The conditional is the future stem with the imparfait endings: je voudrais, tu pourrais, il serait. Use it for polite requests, wishes, advice and imagined situations.",why:"It is the key to sounding polite. je veux is blunt, je voudrais is how adults ask for things.",examples:[d("Je voudrais un thé, s'il vous plaît.","ʒə vudʁɛ œ̃ te, sil vu plɛ.","I would like a tea, please."),d("Pourriez-vous m'aider ?","puʁje vu mede ?","Could you help me?"),d("Tu devrais te reposer.","ty dəvʁɛ tə ʁəpoze.","You should rest."),d("Ce serait génial !","sə səʁɛ ʒenjal !","That would be great!")],mistakes:[{wrong:"Je veux une bière.",right:"Je voudrais une bière.",note:"Not wrong, but blunt. Use the conditional to order."}]},{id:"si-clauses",title:"If sentences",level:"B1",topic:"Verb tenses",rule:"si + present, then future: si tu viens, on ira au parc. si + imparfait, then conditional: si j'avais le temps, je voyagerais. Never put the future or the conditional right after si.",why:"The tense after si tells how likely the idea is. Present means a real possibility, imparfait means an imagined one.",examples:[d("S'il pleut, je reste à la maison.","sil plø, ʒə ʁɛst a la mɛzɔ̃.","If it rains, I stay at home."),d("Si tu viens, on‿ira au parc.","si ty vjɛ̃, ɔ̃niʁa o paʁk.","If you come, we will go to the park."),d("Si j'avais de l'argent, je voyagerais.","si ʒavɛ də laʁʒɑ̃, ʒə vwajaʒʁɛ.","If I had money, I would travel."),d("Si j'étais toi, je partirais.","si ʒetɛ twa, ʒə paʁtiʁɛ.","If I were you, I would leave.")],mistakes:[{wrong:"Si j'aurais le temps...",right:"Si j'avais le temps...",note:"Never the conditional after si. Use the imparfait."},{wrong:"Si il pleut",right:"S'il pleut",note:"si becomes s' before il and ils only."}]},{id:"subjunctive",title:"The subjunctive",level:"B1",topic:"The subjunctive",rule:"After expressions of necessity, wish, emotion and doubt followed by que, the verb goes into the subjunctive: il faut que je parte, I have to leave. It is formed from the ils form of the present: ils partent, que je parte.",why:"The subjunctive marks something wanted, feared or needed rather than stated as fact. The trigger is almost always a verb of feeling or wanting plus que and a different subject.",examples:[d("Il faut que tu viennes.","il fo kə ty vjɛn.","You have to come."),d("Je veux que tu sois heureux.","ʒə vø kə ty swa œʁø.","I want you to be happy."),d("Je suis content que tu sois là.","ʒə sɥi kɔ̃tɑ̃ kə ty swa la.","I am glad you are here."),d("Bien qu'il soit tard, je travaille.","bjɛ̃ kil swa taʁ, ʒə tʁavaj.","Although it is late, I am working.")],mistakes:[{wrong:"Il faut que tu viens.",right:"Il faut que tu viennes.",note:"il faut que always takes the subjunctive."},{wrong:"Je veux que je parte.",right:"Je veux partir.",note:"With the same subject, use the infinitive, not que."}],exceptions:["Fully irregular: être (que je sois), avoir (que j'aie), aller (que j'aille), faire (que je fasse), pouvoir (que je puisse), savoir (que je sache), vouloir (que je veuille).","penser que and croire que take the normal indicative: je pense qu'il vient. In the negative they take the subjunctive: je ne pense pas qu'il vienne."]},{id:"reflexive",title:"Reflexive verbs: se lever, s'appeler",level:"A1",topic:"Pronouns",rule:"Some verbs carry a pronoun that refers back to the subject: je me lève, tu te lèves, il se lève, nous nous levons, vous vous levez, ils se lèvent. Many daily routine verbs work this way.",why:"In French you literally get yourself up and wash yourself. In the past these verbs use être: je me suis levé.",examples:[d("Je m'appelle Saphal.","ʒə mapɛl safal.","My name is Saphal."),d("Je me lève à six‿heures.","ʒə mə lɛv a sizœʁ.","I get up at six."),d("Tu te souviens de moi ?","ty tə suvjɛ̃ də mwa ?","Do you remember me?"),d("Elle s'est reposée.","ɛl sɛ ʁəpoze.","She rested.")],mistakes:[{wrong:"Je lève à six heures.",right:"Je me lève à six heures.",note:"Without me it means I lift something."},{wrong:"Je me suis brossé mes dents.",right:"Je me suis brossé les dents.",note:"With body parts French uses le, la, les, not my."}]},{id:"imperative",title:"Giving instructions: the imperative",level:"A1",topic:"Verb tenses",rule:"Use the tu, nous or vous form of the present without the pronoun: viens, venons, venez. For -er verbs the tu form loses its s: parle, mange, va. The nous form means let's.",why:"vous is used for politeness and for groups, so on signs and in shops you will mostly see the vous form: entrez, poussez, tirez.",examples:[d("Viens ici !","vjɛ̃ isi !","Come here!"),d("Parlez plus lentement, s'il vous plaît.","paʁle ply lɑ̃tmɑ̃, sil vu plɛ.","Speak more slowly, please."),d("Allons-y !","alɔ̃zi !","Let's go!"),d("Ne touche pas !","nə tuʃ pa !","Do not touch!")],mistakes:[{wrong:"Parles plus fort !",right:"Parle plus fort !",note:"-er verbs drop the s in the tu command."}],exceptions:["être, avoir and savoir use their subjunctive forms: sois sage, aie confiance, sachez que."]},{id:"adverbs",title:"Adverbs: -ment and where they go",level:"A2",topic:"Adverbs",rule:"Many adverbs are made by adding -ment to the feminine adjective: lente, lentement. Adjectives ending in a vowel add -ment to the masculine: vrai, vraiment. The adverb usually goes right after the verb.",why:"-ment works like -ly in English. Placing the adverb after the verb is the opposite of English, where it often comes before: I often go, je vais souvent.",examples:[d("Il parle lentement.","il paʁl lɑ̃tmɑ̃.","He speaks slowly."),d("C'est vraiment bon.","sɛ vʁɛmɑ̃ bɔ̃.","It is really good."),d("Je vais souvent au cinéma.","ʒə vɛ suvɑ̃ o sinema.","I often go to the cinema."),d("J'ai bien dormi.","ʒe bjɛ̃ dɔʁmi.","I slept well.")],mistakes:[{wrong:"Je souvent vais au cinéma.",right:"Je vais souvent au cinéma.",note:"The adverb follows the verb."},{wrong:"Il parle bon français.",right:"Il parle bien français.",note:"bon is an adjective, good. bien is the adverb, well."}],exceptions:["-ant and -ent adjectives become -amment and -emment, both said आमाँ: couramment, évidemment.","In compound tenses short adverbs go between the helper and the participle: j'ai bien mangé, il est déjà parti."]},{id:"time-expressions",title:"depuis, pendant, il y a",level:"A2",topic:"Prepositions",rule:"depuis + present tense for something that started in the past and is still going on. pendant for a length of time that is finished. il y a + time for ago.",why:"English says I have been living here for two years. French says I live here since two years: j'habite ici depuis deux ans. The present tense is the key.",examples:[d("J'habite à Paris depuis deux‿ans.","ʒabit a paʁi dəpɥi døzɑ̃.","I have been living in Paris for two years."),d("J'ai habité à Lyon pendant trois‿ans.","ʒe abite a ljɔ̃ pɑ̃dɑ̃ tʁwazɑ̃.","I lived in Lyon for three years."),d("Je suis‿arrivé il y a une semaine.","ʒə sɥizaʁive ilja yn smɛn.","I arrived a week ago.")],mistakes:[{wrong:"J'ai habité ici depuis deux ans.",right:"J'habite ici depuis deux ans.",note:"An action still going on takes the present with depuis."},{wrong:"il y a une semaine, meaning there is a week",right:"il y a une semaine, meaning a week ago",note:"With a time expression, il y a means ago."}]},{id:"cest-ilest",title:"C'est or il est",level:"A2",topic:"Pronouns",rule:"Use c'est before a noun with an article or a name: c'est un médecin, c'est Paul. Use il est or elle est before an adjective or a bare job: il est médecin, elle est gentille.",why:"Both mean it is, he is or she is. The word after decides which one French uses.",examples:[d("C'est‿un‿ami.","sɛtœ̃nami.","He is a friend."),d("Il est professeur.","ilɛ pʁɔfesœʁ.","He is a teacher."),d("C'est Marie.","sɛ maʁi.","It is Marie."),d("Elle est très sympa.","ɛlɛ tʁɛ sɛ̃pa.","She is very nice."),d("C'est beau !","sɛ bo !","It is beautiful! about a general idea")],mistakes:[{wrong:"Il est un médecin.",right:"Il est médecin, or c'est un médecin.",note:"Jobs take no article after il est."}]}],Zv=[...[{id:"gender",title:"Every noun is masculine or feminine",level:"A1",topic:"Gender and articles",rule:"Every French noun is either masculine or feminine, even objects and ideas. The gender decides the word for the and a: le and un for masculine, la and une for feminine. Before a vowel or a silent h, le and la both become l'. In the plural both become les, and un or une become des.",why:"Gender belongs to the word, not to the thing. A table is feminine and a book is masculine for historical reasons only, so it cannot be worked out from the meaning. Learn every noun with its article so you learn the gender at the same time. That is why every noun in this app is shown with le, la or l' and a gender tag.",examples:[d("le livre","lə livʁ","the book, masculine"),d("la table","la tabl","the table, feminine"),d("un garçon et une fille","œ̃ ɡaʁsɔ̃ e yn fij","a boy and a girl"),d("l'ami, l'amie","lami, lami","the friend, male and female, said the same"),d("les‿enfants","lezɑ̃fɑ̃","the children")],mistakes:[{wrong:"le table",right:"la table",note:"Guessing the gender from English. Always learn the article with the noun."},{wrong:"le ami",right:"l'ami",note:"le and la drop their vowel before a vowel sound."},{wrong:"les amis, said ले आमी",right:"les‿amis, said लेज़ामी",note:"The s of les comes back as z before a vowel."}],exceptions:["Some endings are good clues. Nouns ending in -tion, -sion, -té and -ure are almost always feminine: la nation, la liberté, la voiture.","Nouns ending in -ment, -age and -isme are almost always masculine: le moment, le fromage. But la page, la plage and l'image are feminine, so the clue is a guide, not a law."]},{id:"adjective-place",title:"Adjectives usually come after the noun",level:"A1",topic:"Adjectives",rule:"Most French adjectives follow the noun: une voiture rouge, a red car. The adjective also agrees with the noun, adding -e for feminine and -s for plural, even when that changes nothing in speech.",why:"French puts the thing first and the description after it. A small group of very common adjectives goes before the noun instead. Remember them as BAGS: Beauty (beau, joli), Age (jeune, vieux, nouveau), Goodness (bon, mauvais) and Size (grand, petit).",examples:[d("une voiture rouge","yn vwatyʁ ʁuʒ","a red car"),d("un film‿intéressant","œ̃ filmɛ̃teʁesɑ̃","an interesting film"),d("une petite maison","yn pətit mɛzɔ̃","a small house"),d("un bon restaurant","œ̃ bɔ̃ ʁɛstɔʁɑ̃","a good restaurant"),d("des fleurs blanches","de flœʁ blɑ̃ʃ","white flowers")],mistakes:[{wrong:"une rouge voiture",right:"une voiture rouge",note:"Colours always come after the noun."},{wrong:"une maison petit",right:"une petite maison",note:"petit is a BAGS adjective. It goes first and agrees with maison."}],exceptions:["Some adjectives change meaning with their place. un grand homme is a great man, un homme grand is a tall man.","mon ancien professeur is my former teacher, un bâtiment ancien is an old building."]},{id:"negation",title:"Saying no with ne ... pas",level:"A1",topic:"Negation",rule:"To make a verb negative, put ne before it and pas after it. Je parle, I speak. Je ne parle pas, I do not speak. ne becomes n' before a vowel.",why:"French wraps the verb in two pieces. In compound tenses the two pieces go around the helper verb: je n'ai pas mangé. In everyday speech French people drop the ne almost every time, so you will hear je parle pas. Write the ne, but do not expect to hear it.",examples:[d("Je ne parle pas‿anglais.","ʒən paʁl pazɑ̃ɡlɛ.","I do not speak English."),d("Il n'aime pas le café.","il nɛm pa lə kafe.","He does not like coffee."),d("Nous n'avons pas mangé.","nu navɔ̃ pa mɑ̃ʒe.","We have not eaten."),d("Ce n'est pas grave.","sə nɛ pa ɡʁav.","It does not matter."),d("Je sais pas.","ʃɛ pa.","I do not know, everyday speech")],mistak ien, merci. Et toi ?",ipa:"sa va bjɛ̃, mɛʁsi. e twa ?",en:"Fine, thanks. And you?",register:"casual",use:"The answer to ça va. Say et vous instead of et toi to someone you call vous.",level:"A1"},{situation:"Greetings",fr:"Enchanté.",ipa:"ɑ̃ʃɑ̃te.",en:"Pleased to meet you.",register:"neutral",use:"When you meet someone for the first time. A woman writes enchantée, it sounds the same.",level:"A1"},{situation:"Greetings",fr:"Je m'appelle Saphal.",ipa:"ʒə mapɛl safal.",en:"My name is Saphal.",register:"neutral",use:"Introducing yourself in any situation.",level:"A1"},{situation:"Greetings",fr:"Bonne journée !",ipa:"bɔn ʒuʁne !",en:"Have a nice day!",register:"neutral",use:"When leaving a shop or saying goodbye during the day. In the evening, bonne soirée.",level:"A1"},{situation:"Restaurant",fr:"Une table pour deux, s'il vous plaît.",ipa:"yn tabl puʁ dø, sil vu plɛ.",en:"A table for two, please.",register:"neutral",use:"Arriving at a restaurant.",level:"A1"},{situation:"Restaurant",fr:"Qu'est-ce que vous me conseillez ?",ipa:"kɛskə vu mə kɔ̃seje ?",en:"What do you recommend?",register:"formal",use:"Asking the waiter for advice.",level:"A2"},{situation:"Restaurant",fr:"Je voudrais l'addition, s'il vous plaît.",ipa:"ʒə vudʁɛ ladisjɔ̃, sil vu plɛ.",en:"I would like the bill, please.",register:"formal",use:"With waiters and anyone you do not know. In France the bill only comes when you ask for it.",level:"A1",spoken:{fr:"L'addition, s'il vous plaît.",ipa:"ladisjɔ̃, sil vu plɛ."}},{situation:"Shopping",fr:"Combien ça coûte ?",ipa:"kɔ̃bjɛ̃ sa kut ?",en:"How much does it cost?",register:"neutral",use:"In any shop or market.",level:"A1"},{situation:"Shopping",fr:"Je regarde seulement, merci.",ipa:"ʒə ʁəɡaʁd sœlmɑ̃, mɛʁsi.",en:"I am just looking, thank you.",register:"neutral",use:"When a shop assistant offers to help.",level:"A1"},{situation:"Shopping",fr:"Vous‿acceptez la carte ?",ipa:"vuzaksɛpte la kaʁt ?",en:"Do you take cards?",register:"formal",use:"Before paying in a small shop or market.",level:"A1"},{situation:"Directions",fr:"Excusez-moi, où est la gare ?",ipa:"ɛkskyze mwa, u ɛ la ɡaʁ ?",en:"Excuse me, where is the station?",register:"formal",use:"Stopping a stranger in the street.",level:"A1"},{situation:"Directions",fr:"C'est loin d'ici ?",ipa:"sɛ lwɛ̃ disi ?",en:"Is it far from here?",register:"neutral",use:"After asking for directions.",level:"A1"},{situation:"Directions",fr:"Tournez à gauche, puis tout droit.",ipa:"tuʁne a ɡoʃ, pɥi tu dʁwa.",en:"Turn left, then go straight on.",register:"neutral",use:"What you will hear when you ask the way.",level:"A1"},{situation:"Doctor",fr:"J'ai mal au ventre.",ipa:"ʒe mal o vɑ̃tʁ.",en:"My stomach hurts.",register:"neutral",use:"avoir mal à + body part works for any pain: j'ai mal à la tête, j'ai mal aux dents.",level:"A1"},{situation:"Doctor",fr:"Je suis‿allergique à la pénicilline.",ipa:"ʒə sɥizalɛʁʒik a la penisilin.",en:"I am allergic to penicillin.",register:"neutral",use:"Telling a doctor or pharmacist about an allergy.",level:"A2"},{situation:"Phone",fr:"Allô, c'est Saphal à l'appareil.",ipa:"alo, sɛ safal a lapaʁɛj.",en:"Hello, this is Saphal speaking.",register:"neutral",use:"allô is only used on the phone, never face to face.",level:"A2"},{situation:"Phone",fr:"Pouvez-vous répéter, s'il vous plaît ?",ipa:"puve vu ʁepete, sil vu plɛ ?",en:"Could you repeat that, please?",register:"formal",use:"Whenever you did not catch something.",level:"A1",spoken:{fr:"Pardon ?",ipa:"paʁdɔ̃ ?"}},{situation:"Small talk",fr:"Vous venez d'où ?",ipa:"vu vəne du ?",en:"Where are you from?",register:"formal",use:"Polite small talk with someone new.",level:"A1",spoken:{fr:"Tu viens d'où ?",ipa:"ty vjɛ̃ du ?"}},{situation:"Small talk",fr:"Je viens du Népal.",ipa:"ʒə vjɛ̃ dy nepal.",en:"I come from Nepal.",register:"neutral",use:"du because le Népal is masculine: de + le becomes du.",level:"A1"},{situation:"Work",fr:"Je travaille dans la finance.",ipa:"ʒə tʁavaj dɑ̃ la finɑ̃s.",en:"I work in finance."
