"nɔɛl","Christmas")},{letter:"à",name:"a accent grave",ipa:"a aksɑ̃ ɡʁav",sounds:"the same a",vsEnglish:"The sound does not change. It tells à, to, apart from a, has.",vsNepali:"आ.",example:h("à Paris","a paʁi","in Paris")},{letter:"â",name:"a accent circonflexe",ipa:"a aksɑ̃ siʁkɔ̃flɛks",sounds:"a, sometimes a little deeper",vsEnglish:"Most speakers say it like a normal a.",vsNepali:"आ.",example:h("le gâteau","lə ɡato","the cake")},{letter:"ô",name:"o accent circonflexe",ipa:"o aksɑ̃ siʁkɔ̃flɛks",sounds:"closed o",vsEnglish:"A pure, tight o.",vsNepali:"ओ, never ऑ.",example:h("l'hôtel","lotɛl","the hotel")},{letter:"î, û",name:"i et u accent circonflexe",ipa:"i e y aksɑ̃ siʁkɔ̃flɛks",sounds:"no change",vsEnglish:"The sound stays the same, the hat is a spelling memory.",vsNepali:"ई and यु as usual.",example:h("l'île","lil","the island")},{letter:"ù",name:"u accent grave",ipa:"y aksɑ̃ ɡʁav",sounds:"only in où",vsEnglish:"Used in one word, où, where, to tell it apart from ou, or.",vsNepali:"ऊ in où.",example:h("Où es-tu ?","u ɛty ?","Where are you?")},{letter:"ç",name:"c cédille",ipa:"se sedij",sounds:"always s",vsEnglish:"A c that sounds like s even before a, o or u.",vsNepali:"स.",example:h("le garçon","lə ɡaʁsɔ̃","the boy")},{letter:"œ",name:"e dans l'o",ipa:"ə dɑ̃ lo",sounds:"the open eu",vsEnglish:"No English match. A relaxed sound between the u of fur and the e of bed, with rounded lips.",vsNepali:"अ with rounded lips.",example:h("la sœur","la sœʁ","the sister")}],Wr=[{letter:"ou",name:"",ipa:"u",sounds:"the ordinary oo",vsEnglish:"The oo of food, never the ou of house.",vsNepali:"ऊ.",example:h("vous","vu","you")},{letter:"oi",name:"",ipa:"wa",sounds:"wa",vsEnglish:"Always wa, as in the start of water.",vsNepali:"वा.",example:h("moi","mwa","me")},{letter:"oin",name:"",ipa:"wɛ̃",sounds:"w followed by the nasal e",vsEnglish:"No English match. wa with the nose open and the mouth flatter.",vsNepali:"वेँ.",example:h("loin","lwɛ̃","far")},{letter:"au, eau",name:"",ipa:"o",sounds:"closed o",vsEnglish:"A pure o, never ow.",vsNepali:"ओ.",example:h("l'eau, beau","lo, bo","water, beautiful")},{letter:"ai, ei",name:"",ipa:"ɛ",sounds:"open è",vsEnglish:"The e of bed. Never the ai of rain.",vsNepali:"ऍ. In j'ai and in verb endings -ai it is closer to ए.",example:h("la neige","la nɛʒ","the snow")},{letter:"eu, œu",name:"",ipa:"ø",sounds:"the rounded e, closed or open",vsEnglish:"No English match. Say the e of bed with rounded lips.",vsNepali:"अ॓ when it ends the syllable, अ before a spoken consonant.",example:h("deux, le cœur","dø, lə kœʁ","two, the heart")},{letter:"ui",name:"",ipa:"ɥi",sounds:"the u glide followed by ee",vsEnglish:"Like a very quick French u sliding into ee, in one beat.",vsNepali:"युई, said as one syllable.",example:h("huit","ɥit","eight")},{letter:"ien",name:"",ipa:"jɛ̃",sounds:"y followed by the nasal e",vsEnglish:"Like the yan of canyon, but nasal and with no n.",vsNepali:"येँ.",example:h("bien","bjɛ̃","well")},{letter:"an, en, am, em",name:"",ipa:"ɑ̃",sounds:"nasal a",vsEnglish:"The a of father pushed through the nose, with no n at the end.",vsNepali:"आँ.",example:h("l'enfant","lɑ̃fɑ̃","the child")},{letter:"in, im, ain, ein",name:"",ipa:"ɛ̃",sounds:"nasal e",vsEnglish:"The e of bed pushed through the nose, with no n at the end.",vsNepali:"एँ.",example:h("le pain","lə pɛ̃","the bread")},{letter:"on, om",name:"",ipa:"ɔ̃",sounds:"nasal o",vsEnglish:"A rounded o pushed through the nose, with no n at the end.",vsNepali:"ओँ.",example:h("le nom","lə nɔ̃","the name")},{letter:"un, um",name:"",ipa:"œ̃",sounds:"nasal u, often said like nasal e",vsEnglish:"No English match. Many French speakers now say it like in.",vsNepali:"अँ.",example:h("lundi","lœ̃di","Monday")},{letter:"ch",name:"",ipa:"ʃ",sounds:"sh",vsEnglish:"Always sh, never the ch of church.",vsNepali:"श.",example:h("le chat","lə ʃa","the cat")},{letter:"gn",name:"",ipa:"ɲ",sounds:"ny",vsEnglish:"The ny of canyon.",vsNepali:"ञ.",example:h("l'Espagne","lɛspaɲ","Spain")},{letter:"ph",name:"",ipa:"f",sounds:"f",vsEnglish:"f, as in English photo.",vsNepali:"फ, a true f.",example:h("la photo","la fɔto","the photo")},{letter:"th",name:"",ipa:"t",sounds:"t",vsEnglish:"Never the th of think or this. Just t.",vsNepali:"त.",example:h("le thé","lə te","the tea")},{letter:"qu",name:"",ipa:"k",sounds:"k",vsEnglish:"Just k, never kw.",vsNepali:"क.",example:h("qui","ki","who")},{letter:"gu",name:"",ipa:"ɡ",sounds:"hard g before e and i",vsEnglish:"The u is silent. It only keeps the g hard.",vsNepali:"ग.",example:h("la guitare","la ɡitaʁ","the guitar")},{letter:"ill, il",name:"",ipa:"j",sounds:"y",vsEnglish:"Usually y, not l. Exceptions: ville, mille, tranquille keep the l.",vsNepali:"य.",example:h("la fille","la fij","the girl")},{letter:"tion",name:"",ipa:"sjɔ̃",sounds:"syon",vsEnglish:"Never the shun of English nation.",vsNepali:"स्योँ.",example:h("la nation","la nasjɔ̃","the nation")},{letter:"-er, -ez, -et",name:"",ipa:"e",sounds:"é at the end of a word",vsEnglish:"The r and z are silent. -et is a little more open, like è.",vsNepali:"ए, or ऍ for -et.",example:h("le nez","lə ne","the nose")},{letter:"s, ss",name:"",ipa:"z",sounds:"z between two vowels, s when doubled",vsEnglish:"One s between vowels buzzes like z. Two make a clean s.",vsNepali:"ज़ or स.",example:h("le poisson, le poison","lə pwasɔ̃, lə pwazɔ̃","the fish, the poison")},{letter:"-ent",name:"",ipa:"ɑ̃",sounds:"nasal a, but silent in verbs",vsEnglish:"Silent at the end of a verb after ils or elles, nasal everywhere else.",vsNepali:"आँ, or nothing after ils.",example:h("ils parl(ent) souvent","il paʁl suvɑ̃","they often speak")},{letter:"y between vowels",name:"",ipa:"ɛj",sounds:"like i + i",vsEnglish:"payer is said as pai-yer: the y splits into two.",vsNepali:"ऍय.",example:h("payer","pɛje","to pay")}],gp=[{id:"nasal",title:"Nasal vowels",rule:"French has four vowels said through the nose and the mouth at once. They are spelled with n or m after a vowel, but that n or m is not pronounced. The Devanagari marks them with ँ.",tip:"Say आ and let air escape through your nose. If your tongue touches the roof of your mouth for an n, you have gone too far.",examples:[h("le temps","lə tɑ̃","time, weather"),h("le pain","lə pɛ̃","bread"),h("bon","bɔ̃","good"),h("un","œ̃","one, a"),h("Ils sont contents.","il sɔ̃ kɔ̃tɑ̃.","They are happy.")]},{id:"u-ou",title:"u and ou",rule:"ou is the ordinary ऊ. u is a sound English and Nepali do not have: say ई, keep the tongue exactly there, and round the lips tightly. Mixing the two changes the word.",tip:"Whisper ई, then push your lips forward as if to whistle without moving your tongue.",examples:[h("vous, vu","vu, vy","you, seen"),h("tout, tu","tu, ty","all, you"),h("dessous, dessus","dəsu, dəsy","under, on top"),h("la roue, la rue","la ʁu, la ʁy","the wheel, the street")]},{id:"r",title:"The French R",rule:"The French r is made at the back of the throat, where you would gargle, near the place of ग़. The tip of the tongue stays down behind the bottom teeth. This app writes it ऱ.",tip:"Start from क, then loosen it until air rubs through instead of stopping. Practise with Paris, rouge and merci.",examples:[h("rouge","ʁuʒ","red"),h("Paris","paʁi","Paris"),h("merci","mɛʁsi","thank you"),h("trois","tʁwa","three"),h("Bonjour, Robert.","bɔ̃ʒuʁ, ʁɔbɛʁ.","Hello, Robert.")]},{id:"silent",title:"Silent final letters",rule:"Most final consonants are silent, and so is a final e. The verb ending -ent is always silent. The letters c, r, f and l are often pronounced at the end, remember them as CaReFuL. Faded letters on screen are the ones you do not say.",tip:"The -er of verbs is the big exception to CaReFuL: parler ends in ए, with no r.",examples:[h("beaucou(p)","boku","a lot"),h("ils parl(ent)","il paʁl","they speak"),h("gran(d)","ɡʁɑ̃","big"),h("avec","avɛk","with"),h("neuf","nœf","nine, new"),h("parle(r)","paʁle","to speak")]},{id:"liaison",title:"Liaison",rule:"A silent final consonant comes back to life when the next word starts with a vowel or a silent h, and the two words are said as one. s and x sound as z, d sounds as t. The tie ‿ shows where it happens.",tip:"Never after et, and never before an aspirated h: les héros is ले एऱो.",examples:[h("les‿amis","lezami","the friends"),h("vous‿avez","vuzave","you have"),h("un‿ami","œ̃nami","a friend"),h("deux‿heures","døzœʁ","two o'clock"),h("un grand‿homme","œ̃ ɡʁɑ̃tɔm","a great man")]},{id:"elision",title:"Elision",rule:"Small words ending in a vowel drop it before another vowel and take an apostrophe: le, la, je, me, te, se, de, ne and que. si becomes s' only before il and ils.",examples:[h("l'homme","lɔm","the man"),h("j'ai","ʒe","I have"),h("c'est","sɛ","it is"),h("qu'il","kil","that he"),h("s'il vous plaît","sil vu plɛ","please")]},{id:"light-e",title:"The light e that disappears",rule:"An e with no accent at the end of a syllable is a very light अ, and French drops it whenever it can. Inside a word or a phrase it disappears when only one consonant is said before it, and stays when dropping it would put three consonants together.",tip:"This is the main thing that makes beginners sound like they are reading. Drop it and you sound fluent.",examples:[h("samedi","samdi","Saturday"),h("maintenant","mɛ̃tnɑ̃","now"),h("la fenêtre","la fnɛtʁ","the window"),h("vendredi","vɑ̃dʁədi","Friday, the e stays"),h("Je ne sais pas.","ʒən sɛ pa.","I do not know.")]},{id:"eu",title:"The two eu sounds",rule:"eu has two sounds. Closed at the end of a word or before a z sound: say ए with rounded lips, written अ॓. Open before a pronounced consonant: a relaxed अ.",examples:[h("deux","dø","two"),h("peu","pø","little"),h("heureuse","œʁøz","happy, feminine"),h("la fleur","la flœʁ","the flower"),h("la sœur","la sœʁ","the sister")]},{id:"oi-gn",title:"oi and gn",rule:"oi is always वा. gn is ञ, like the ny in canyon. ill after a vowel is usually य.",examples:[h("moi","mwa","me"),h("la voiture","la vwatyʁ","the car"),h("la montagne","la mɔ̃taɲ","the mountain"),h("la campagne","la kɑ̃paɲ","the countryside"),h("le travail","lə tʁavaj","the work")]},{id:"rhythm",title:"Stress and rhythm",rule:"French words have no stressed syllable. Every syllable gets the same length and force, and only the last syllable of a group is a little longer. Say Paris as पा ऱी, evenly, not PA-ris.",tip:"Think of a sentence as a line of equal beads with a slightly bigger bead at the end.",examples:[h("Paris","paʁi","Paris"),h("la photographie","la fɔtɔɡʁafi","photography"),h("Je voudrais un café.","ʒə vudʁɛ œ̃ kafe.","I would like a coffee."),h("C'est‿impossible.","sɛtɛ̃pɔsibl.","It is impossible.")]}],yp=[{id:"e-sounds",title:"Closed é and open è",rule:"French has two e sounds. Closed é is written é, and also -er, -ez at the end of a word and es in les, des, mes, tes, ses, ces. Open è is written è, ê, ai, ei, -et at the end of a word, and e before a pronounced consonant. The app writes the first ए and the second ऍ.",tip:"For ए smile and nearly close the mouth. For ऍ drop the jaw a little, as for the e of bed. et, and, is ए. est, is, is ऍ.",examples:[h("l'été","lete","the summer"),h("la mère","la mɛʁ","the mother"),h("le nez","lə ne","the nose"),h("la fête","la fɛt","the party"),h("le lait","lə lɛ","the milk"),h("et, est","e, ɛ","and, is")]},{id:"c-g",title:"Hard and soft c and g",rule:"c and g are hard, क and ग, before a, o, u and before consonants. They turn soft, स and झ़, before e, i and y. ç keeps a c soft before a, o, u, and an e after g does the same for g. gu keeps a g hard before e and i.",examples:[h("le café, le ciel","lə kafe, lə sjɛl","the coffee, the sky"),h("la gare, le gilet","la ɡaʁ, lə ʒilɛ","the station, the waistcoat"),h("le garçon","lə ɡaʁsɔ̃","the boy"),h("nous mangeons","nu mɑ̃ʒɔ̃","we eat"),h("la guerre","la ɡɛʁ","the war")]},{id:"s-z",title:"One s between vowels sounds like z",rule:"A single s between two vowels buzzes as z. A double ss, or an s at the start of a word or next to a consonant, is a clean s. Getting this wrong changes the word.",examples:[h("le poisson, le poison","lə pwasɔ̃, lə pwazɔ̃","the fish, the poison"),h("le dessert, le désert","lə desɛʁ, lə dezɛʁ","the dessert, the desert"),h("la maison","la mɛzɔ̃","the house"),h("la chose","la ʃoz","the thing")]},{id:"ill",title:"ill and il, the y sound",rule:"After a vowel, ill and a final il are said as य: travail, soleil. After a consonant, ill is usually ईय: fille. A few common words keep a real l: ville, mille, tranquille, and the words built on them.",examples:[h("la fille","la fij","the girl"),h("le travail","lə tʁavaj","the work"),h("la feuille","la fœj","the leaf"),h("la ville","la vil","the town"),h("mille","mil","a thousand"),h("tranquille","tʁɑ̃kil","calm, quiet")]},{id:"x",title:"The four sounds of x",rule:"x is क्स in most words, ग्ज़ in words starting ex- before a vowel, स in six, dix and soixante, and ज़ in liaison and in deuxième and sixième. At the end of a word it is usually silent.",examples:[h("le taxi","lə taksi","the taxi"),h("un‿exemple","œ̃nɛɡzɑ̃pl","an example"),h("soixante","swasɑ̃t","sixty"),h("deuxième","døzjɛm","second"),h("le pri(x)","lə pʁi","the price")]},{id:"glides",title:"Gliding i, ou and u",rule:"When i, ou or u come right before another vowel, they shrink into a quick y, w or the यु glide, and the two vowels make one syllable, not two.",examples:[h("le pied","lə pje","the foot"),h("la nation","la nasjɔ̃","the nation"),h("oui","wi","yes"),h("jouer","ʒwe","to play"),h("la nuit","la nɥi","the night")]},{id:"pure-vowels",title:"French vowels never slide",rule:"English vowels drift while you say them: go is really go-w and day is really de-y. French vowels hold still from start to finish. Keep the jaw and lips frozen until the sound ends.",tip:"Say café and stop dead on the é. If you hear a little y at the end, you are still speaking English.",examples:[h("beau","bo","beautiful"),h("le café","lə kafe","the coffee"),h("le mot","lə mo","the word"),h("le nez","lə ne","the nose")]},{id:"double",title:"Double letters are said once",rule:"French often doubles a consonant in spelling, but says it only once. A double letter mostly tells you about the vowel before it, which is open: pomme is पॉम.",examples:[h("la pomme","la pɔm","the apple"),h("la lettre","la lɛtʁ","the letter"),h("aller","ale","to go"),h("la terre","la tɛʁ","the earth")]},{id:"ent",title:"-ent, silent in verbs, nasal elsewhere",rule:"At the end of a verb after ils or elles, -ent is completely silent. Everywhere else, in nouns, adjectives and adverbs, -ent is the nasal आँ. A few words are spelled the same and only the grammar tells you which.",examples:[h("ils parl(ent)","il paʁl","they speak"),h("le moment","lə mɔmɑ̃","the moment"),h("souvent","suvɑ̃","often"),h("ils présid(ent), le président","il pʁezid, lə pʁezidɑ̃","they preside, the president"),h("lentement","lɑ̃tmɑ̃","slowly")]},{id:"liaison-rules",title:"Liaisons you must, may and must not make",rule:"Always make a liaison between a determiner and its noun, a pronoun and its verb, an adjective and the noun after it, and after short words like dans, chez, en, très. You may make it after a verb, which sounds more careful. Never make it after et, after a singular noun, or before an aspirated h.",examples:[h("mon‿ami","mɔ̃nami","my friend, always"),h("chez‿elle","ʃezɛl","at her place, always"),h("dans‿un mois","dɑ̃zœ̃ mwa","in a month, always"),h("je suis‿allé","ʒə sɥizale","I went, optional"),h("un‿étudiant anglais","œ̃netydjɑ̃ ɑ̃ɡlɛ","an English student, never after the noun")]},{id:"enchainement",title:"Linking a spoken consonant",rule:"When a word ends in a consonant you can hear and the next starts with a vowel, the consonant slides over and starts the next syllable. This is why French sounds like one long word.",examples:[h("il‿a","ila","he has"),h("elle‿aime","ɛlɛm","she loves"),h("avec‿elle","avɛkɛl","with her"),h("une‿amie","ynami","a friend"),h("Pierre‿arrive.","pjɛʁaʁiv.","Pierre is arriving.")]},{id:"h-aspire",title:"The aspirated h",rule:"h is never pronounced. But some words starting with h behave as if they started with a consonant: no liaison and no elision before them. Dictionaries mark them, and the common ones are worth learning by heart: le héros, la honte, le haricot, le hasard, la hauteur, le hibou, la Hollande, en haut.",examples:[h("les héros","le eʁo","the heroes"),h("le haricot","lə aʁiko","the bean"),h("l'homme, le héros","lɔm, lə eʁo","the man, the hero"),h("en haut","ɑ̃ o","upstairs")]},{id:"number-sounds",title:"Numbers that change before a word",rule:"six and dix drop their final sound before a consonant, and say it as z before a vowel. huit and cinq drop it before a consonant in careful speech. neuf turns its f into v before ans and heures.",examples:[h("six","sis","six"),h("si(x) livres","si livʁ","six books"),h("six‿enfants","sizɑ̃fɑ̃","six children"),h("di(x) minutes","di minyt","ten minutes"),h("neuf‿ans","nœvɑ̃","nine years")]},{id:"intonation",title:"The melody of a sentence",rule:"French rises a little at the end of each group of words and falls at the very end of a statement. A yes or no question simply rises at the end, with no change of word order. A question starting with a question word begins high and falls.",examples:[h("Tu viens.","ty vjɛ̃.","You are coming, falling"),h("Tu viens ?","ty vjɛ̃ ?","Are you coming, rising"),h("Où vas-tu ?","u vaty ?","Where are you going, high then falling"),h("Le matin, je travaille.","lə matɛ̃, ʒə tʁavaj.","In the morning I work, up then down")]}],bp=["nasal","u-ou","r","e-sounds","eu","oi-gn","pure-vowels","c-g","s-z","ill","x","glides","double","silent","ent","light-e","elision","liaison","liaison-rules","enchainement","h-aspire","number-sounds","rhythm","intonation"],xp=new Map([...gp,...yp].map(c=>[c.id,c])),jp=bp.map(c=>xp.get(c)),$r=[{id:"0-20",title:"0 to 20",intro:"Learn these by heart. Everything else is built from them.",items:[{value:"0",fr:"zéro",ipa:"zeʁo"},{value:"1",fr:"un, une",ipa:"œ̃, yn",note:"une before a feminine noun: une pomme"},{value:"2",fr:"deu(x)",ipa:"dø"},{value:"3",fr:"troi(s)",ipa:"tʁwa"},{value:"4",fr:"quatre",ipa:"katʁ"},{value:"5",fr:"cinq",ipa:"sɛ̃k"},{value:"6",fr:"six",ipa:"sis",note:"si before a consonant: six livres, सी लीभ्ऱ"},{value:"7",fr:"sep(t)",ipa:"sɛt",note:"the p is silent, the t is said"},{value:"8",fr:"huit",ipa:"ɥit"},{value:"9",fr:"neuf",ipa:"nœf"},{value:"10",fr:"dix",ipa:"dis"},{value:"11",fr:"onze",ipa:"ɔ̃z"},{value:"12",fr:"douze",ipa:"duz"},{value:"13",fr:"treize",ipa:"tʁɛz"},{value:"14",fr:"quatorze",ipa:"katɔʁz"},{value:"15",fr:"quinze",ipa:"kɛ̃z"},{value:"16",fr:"seize",ipa:"sɛz"},{value:"17",fr:"dix-sept",ipa:"disɛt",note:"ten seven"},{value:"18",fr:"dix-huit",ipa:"dizɥit",note:"ten eight, the x sounds as z"},{value:"19",fr:"dix-neuf",ipa:"diznœf",note:"ten nine, the x sounds as z"},{value:"20",fr:"ving(t)",ipa:"vɛ̃"}]},{id:"tens",title:"21 to 69",intro:"Tens work as in English. Only 21, 31, 41, 51 and 61 use et, and. From 21 to 29 the t of vingt is said.",items:[{value:"21",fr:"vingt‿et un",ipa:"vɛ̃teœ̃"},{value:"22",fr:"vingt-deux",ipa:"vɛ̃tdø"},{value:"23",fr:"vingt-trois",ipa:"vɛ̃ttʁwa"},{value:"29",fr:"vingt-neuf",ipa:"vɛ̃tnœf"},{value:"30",fr:"trente",ipa:"tʁɑ̃t"},{value:"31",fr:"trente‿et un",ipa:"tʁɑ̃teœ̃"},{value:"32",fr:"trente-deux",ipa:"tʁɑ̃tdø"},{value:"40",fr:"quarante",ipa:"kaʁɑ̃t"},{value:"41",fr:"quarante‿et un",ipa:"kaʁɑ̃teœ̃"},{value:"44",fr:"quarante-quatre",ipa:"kaʁɑ̃tkatʁ"},{value:"50",fr:"cinquante",ipa:"sɛ̃kɑ̃t"},{value:"51",fr:"cinquante‿et un",ipa:"sɛ̃kɑ̃teœ̃"},{value:"57",fr:"cinquante-sept",ipa:"sɛ̃kɑ̃tsɛt"},{value:"60",fr:"soixante",ipa:"swasɑ̃t",note:"the x sounds as s"},{value:"61",fr:"soixante‿et un",ipa:"swasɑ̃teœ̃"},{value:"65",fr:"soixante-cinq",ipa:"swasɑ̃tsɛ̃k"},{value:"68",fr:"soixante-huit",ipa:"swasɑ̃tɥit"}]},{id:"70-99",title:"70, 80 and 90",intro:"The awkward ones. 70 is sixty ten, 80 is four twenties, 90 is four twenties ten. Belgium and Switzerland say septante and nonante instead.",items:[{value:"70",fr:"soixante-dix",ipa:"swasɑ̃tdis",note:"sixty ten"},{value:"71",fr:"soixante‿et onze",ipa:"swasɑ̃teɔ̃z",note:"sixty and eleven"},{value:"72",fr:"soixante-douze",ipa:"swasɑ̃tduz",note:"sixty twelve"},{value:"75",fr:"soixante-quinze",ipa:"swasɑ̃tkɛ̃z",note:"sixty fifteen"},{value:"77",fr:"soixante-dix-sept",ipa:"swasɑ̃tdisɛt",note:"sixty seventeen"},{value:"79",fr:"soixante-dix-neuf",ipa:"swasɑ̃tdiznœf",note:"sixty nineteen"},{value:"80",fr:"quatre-vingt(s)",ipa:"katʁəvɛ̃",note:"four twenties, with an s only when it ends the number"},{value:"81",fr:"quatre-vingt-un",ipa:"katʁəvɛ̃œ̃",note:"no et here, and no s on vingt"},{value:"82",fr:"quatre-vingt-deux",ipa:"katʁəvɛ̃dø"},{value:"85",fr:"quatre-vingt-cinq",ipa:"katʁəvɛ̃sɛ̃k"},{value:"88",fr:"quatre-vingt-huit",ipa:"katʁəvɛ̃ɥit",note:"the t of vingt stays silent from 81 to 99"},{value:"90",fr:"quatre-vingt-dix",ipa:"katʁəvɛ̃dis",note:"four twenties ten"},{value:"91",fr:"quatre-vingt-onze",ipa:"katʁəvɛ̃ɔ̃z",note:"four twenties eleven"},{value:"95",fr:"quatre-vingt-quinze",ipa:"katʁəvɛ̃kɛ̃z"},{value:"97",fr:"quatre-vingt-dix-sept",ipa:"katʁəvɛ̃disɛt"},{value:"99",fr:"quatre-vingt-dix-neuf",ipa:"katʁəvɛ̃diznœf"},{value:"70",en:"70 in Belgium and Switzerland",fr:"septante",ipa:"sɛptɑ̃t"},{value:"90",en:"90 in Belgium and Switzerland",fr:"nonante",ipa:"nɔnɑ̃t"}]},{id:"big",title:"100 to a billion",intro:"cent takes an s only when it is multiplied and ends the number. mille never changes. million and milliard are nouns, so they take de before what they count: un million d'habitants.",items:[{value:"100",fr:"cen(t)",ipa:"sɑ̃"},{value:"101",fr:"cent un",ipa:"sɑ̃œ̃"},{value:"110",fr:"cent dix",ipa:"sɑ̃ dis"},{value:"150",fr:"cent cinquante",ipa:"sɑ̃ sɛ̃kɑ̃t"},{value:"200",fr:"deux cent(s)",ipa:"dø sɑ̃"},{value:"250",fr:"deux cent cinquante",ipa:"dø sɑ̃ sɛ̃kɑ̃t",note:"no s on cent when another number follows"},{value:"300",fr:"trois cent(s)",ipa:"tʁwa sɑ̃"},{value:"999",fr:"neuf cent quatre-vingt-dix-neuf",ipa:"nœf sɑ̃ katʁəvɛ̃diznœf"},{value:"1 000",fr:"mille",ipa:"mil",note:"never un mille, just mille"},{value:"1 001",fr:"mille un",ipa:"mil œ̃"},{value:"1 500",fr:"mille cinq cent(s)",ipa:"mil sɛ̃ sɑ̃",note:"the q of cinq is dropped before cents"},{value:"2 000",fr:"deux mille",ipa:"dø mil",note:"never milles"},{value:"10 000",fr:"di(x) mille",ipa:"di mil"},{value:"100 000",fr:"cent mille",ipa:"sɑ̃ mil"},{value:"1 000 000",fr:"un million",ipa:"œ̃ miljɔ̃"},{value:"2 000 000",fr:"deux millions",ipa:"dø miljɔ̃"},{value:"1 000 000 000",fr:"un milliar(d)",ipa:"œ̃ miljaʁ"}]},{id:"years",title:"Years",intro:"Years are read as one full number, never split in two as English does.",items:[{value:"1990",fr:"mille neuf cent quatre-vingt-dix",ipa:"mil nœf sɑ̃ katʁəvɛ̃dis"},{value:"2000",fr:"l'an deux mille",ipa:"lɑ̃ dø mil",en:"the year 2000"},{value:"2026",fr:"en deux mille vingt-six",ipa:"ɑ̃ dø mil vɛ̃tsis",en:"in 2026"}]},{id:"ordinals",title:"First, second, third",intro:"Add -ième to the number, dropping a final e. Only first is irregular. Written 1er, 2e, 3e.",items:[{value:"1er",fr:"premier, première",ipa:"pʁəmje, pʁəmjɛʁ",en:"first",note:"the only irregular one, with a feminine form"},{value:"2e",fr:"deuxième",ipa:"døzjɛm",en:"second",note:"also second, seconde when there are only two"},{value:"3e",fr:"troisième",ipa:"tʁwazjɛm",en:"third"},{value:"4e",fr:"quatrième",ipa:"katʁijɛm",en:"fourth",note:"quatre loses its e"},{value:"5e",fr:"cinquième",ipa:"sɛ̃kjɛm",en:"fifth",note:"cinq takes a u"},{value:"6e",fr:"sixième",ipa:"sizjɛm",en:"sixth"},{value:"7e",fr:"septième",ipa:"sɛtjɛm",en:"seventh"},{value:"8e",fr:"huitième",ipa:"ɥitjɛm",en:"eighth"},{value:"9e",fr:"neuvième",ipa:"nœvjɛm",en:"ninth",note:"the f of neuf becomes v"},{value:"10e",fr:"dixième",ipa:"dizjɛm",en:"tenth"},{value:"11e",fr:"onzième",ipa:"ɔ̃zjɛm",en:"eleventh"},{value:"20e",fr:"vingtième",ipa:"vɛ̃tjɛm",en:"twentieth"},{value:"21e",fr:"vingt‿et unième",ipa:"vɛ̃teynjɛm",en:"twenty first"},{value:"100e",fr:"centième",ipa:"sɑ̃tjɛm",en:"hundredth"}]},{id:"days",title:"Days of the week",intro:"Days and months take no capital letter in French. The week starts on Monday.",items:[{value:"Mon",en:"Monday",fr:"lundi",ipa:"lœ̃di"},{value:"Tue",en:"Tuesday",fr:"mardi",ipa:"maʁdi"},{value:"Wed",en:"Wednesday",fr:"mercredi",ipa:"mɛʁkʁədi"},{value:"Thu",en:"Thursday",fr:"jeudi",ipa:"ʒødi"},{value:"Fri",en:"Friday",fr:"vendredi",ipa:"vɑ̃dʁədi"},{value:"Sat",en:"Saturday",fr:"samedi",ipa:"samdi"},{value:"Sun",en:"Sunday",fr:"dimanche",ipa:"dimɑ̃ʃ"},{value:"on Mon",en:"every Monday",fr:"le lundi",ipa:"lə lœ̃di",note:"le + day means every week on that day"}]},{id:"months",title:"Months",intro:"en or au mois de before a month: en mai, in May.",items:[{value:"Jan",en:"January",fr:"janvier",ipa:"ʒɑ̃vje"},{value:"Feb",en:"February",fr:"février",ipa:"fevʁije"},{value:"Mar",en:"March",fr:"mars",ipa:"maʁs",note:"the s is said"},{value:"Apr",en:"April",fr:"avril",ipa:"avʁil"},{value:"May",en:"May",fr:"mai",ipa:"mɛ"},{value:"Jun",en:"June",fr:"juin",ipa:"ʒɥɛ̃"},{value:"Jul",en:"July",fr:"juillet",ipa:"ʒɥijɛ"},{value:"Aug",en:"August",fr:"aoû(t)",ipa:"ut",note:"said ऊत or ऊ, the a is silent"},{value:"Sep",en:"September",fr:"septembre",ipa:"sɛptɑ̃bʁ",note:"here the p is said"},{value:"Oct",en:"October",fr:"octobre",ipa:"ɔktɔbʁ"},{value:"Nov",en:"November",fr:"novembre",ipa:"nɔvɑ̃bʁ"},{value:"Dec",en:"December",fr:"décembre",ipa:"desɑ̃bʁ"}]},{id:"dates",title:"Dates",intro:"le + number + month. Only the first of the month uses an ordinal.",items:[{value:"1/5",en:"the first of May",fr:"le premier mai",ipa:"lə pʁəmje mɛ"},{value:"14/7",en:"the fourteenth of July",fr:"le quatorze juillet",ipa:"lə katɔʁz ʒɥijɛ",note:"Bastille Day"},{value:"19/10",en:"Monday the nineteenth of October",fr:"lundi dix-neuf octobre",ipa:"lœ̃di diznœf ɔktɔbʁ"},{value:"8/3",en:"the eighth of March",fr:"le huit mars",ipa:"lə ɥit maʁs",note:"no elision before huit: le huit, never l'huit"},{value:"11/9",en:"the eleventh of September",fr:"le onze septembre",ipa:"lə ɔ̃z sɛptɑ̃bʁ",note:"no elision before onze either"},{value:"date",en:"What is the date today?",fr:"On est le combien aujourd'hui ?",ipa:"ɔ̃nɛ lə kɔ̃bjɛ̃ oʒuʁdɥi ?",note:"everyday way to ask the date"}]},{id:"time",title:"Telling the time",intro:"Il est + number + heure(s). Timetables and shops use the 24 hour clock.",items:[{value:"ask",en:"What time is it?",fr:"Quelle heure est-il ?",ipa:"kɛlœʁ ɛtil ?"},{value:"1:00",en:"It is one o'clock.",fr:"Il est‿une heure.",ipa:"ilɛtynœʁ."},{value:"2:00",en:"It is two o'clock.",fr:"Il est deux‿heures.",ipa:"ilɛ døzœʁ."},{value:"3:15",en:"It is quarter past three.",fr:"Il est trois‿heures et quart.",ipa:"ilɛ tʁwazœʁ e kaʁ."},{value:"4:30",en:"It is half past four.",fr:"Il est quatre heures et demie.",ipa:"ilɛ katʁœʁ e dəmi."},{value:"5:45",en:"It is quarter to six.",fr:"Il est six‿heures moins le quart.",ipa:"ilɛ sizœʁ mwɛ̃ lə kaʁ.",note:"six hours minus the quarter"},{value:"6:10",en:"ten past six",fr:"six‿heures dix",ipa:"sizœʁ dis"},{value:"7:50",en:"ten to eight",fr:"huit‿heures moins dix",ipa:"ɥitœʁ mwɛ̃ dis"},{value:"12:00",en:"noon",fr:"midi",ipa:"midi"},{value:"0:00",en:"midnight",fr:"minuit",ipa:"minɥi"},{value:"13:00",en:"1 pm",fr:"treize heures",ipa:"tʁɛzœʁ"},{value:"20:30",en:"8.30 pm",fr:"vingt‿heures trente",ipa:"vɛ̃tœʁ tʁɑ̃t"},{value:"at 9",en:"at nine o'clock",fr:"à neuf‿heures",ipa:"a nœvœʁ",note:"neuf becomes नभ before heures"}]},{id:"money",title:"Money and prices",intro:"French writes a comma for decimals and a space between thousands: 1 250,50 €. Say the euros, then the cents, often without the word centimes.",items:[{value:"1 €",en:"one euro",fr:"un‿euro",ipa:"œ̃nøʁo"},{value:"2 €",en:"two euros",fr:"deux‿euros",ipa:"døzøʁo"},{value:"3,50 €",en:"three euros fifty",fr:"trois‿euros cinquante",ipa:"tʁwazøʁo sɛ̃kɑ̃t"},{value:"0,99 €",en:"ninety nine cents",fr:"quatre-vingt-dix-neuf centimes",ipa:"katʁəvɛ̃diznœf sɑ̃tim"},{value:"20 €",en:"twenty euros",fr:"vingt‿euros",ipa:"vɛ
