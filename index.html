silent.",vsNepali:"स, or ज़ between vowels.",example:m("salut","saly","hi")},{letter:"T t",name:"té",ipa:"te",sounds:"t, silent at the end of most words. th is t",vsEnglish:"The tongue touches the teeth and there is no puff. th is never the English th.",vsNepali:"Exactly त, not ट.",example:m("le thé","lə te","the tea")},{letter:"U u",name:"u",ipa:"y",sounds:"the French u",vsEnglish:"No English sound matches. Say ee with your lips rounded tightly.",vsNepali:"Written यु. Say ई with the lips of ऊ. It is not ऊ.",example:m("tu","ty","you")},{letter:"V v",name:"vé",ipa:"ve",sounds:"v",vsEnglish:"The same as English v.",vsNepali:"Written भ, but say a true v with the teeth on the lip and no breath.",example:m("le vin","lə vɛ̃","the wine")},{letter:"W w",name:"double vé",ipa:"dubləve",sounds:"w or v, only in borrowed words",vsEnglish:"Usually like English w.",vsNepali:"व.",example:m("le week-end","lə wikɛnd","the weekend")},{letter:"X x",name:"ixe",ipa:"iks",sounds:"ks, gz, s or z. Often silent at the end",vsEnglish:"Like English x in the middle of words, silent at the end: deux.",vsNepali:"क्स, or not said at the end.",example:m("le taxi","lə taksi","the taxi")},{letter:"Y y",name:"i grec",ipa:"iɡʁɛk",sounds:"ee or y",vsEnglish:"The ee of see, or the y of yes before a vowel.",vsNepali:"ई or य.",example:m("les yeux","lezjø","the eyes")},{letter:"Z z",name:"zède",ipa:"zɛd",sounds:"z",vsEnglish:"The same as English z. Silent in the ending -ez.",vsNepali:"ज़, with the buzz.",example:m("zéro","zeʁo","zero")}],Wc=[{letter:"é",name:"e accent aigu",ipa:"ə aksɑ̃ eɡy",sounds:"closed é",vsEnglish:"Like the start of the a in face, but with no glide.",vsNepali:"ए, lips spread and nearly closed.",example:m("l'été","lete","the summer")},{letter:"è",name:"e accent grave",ipa:"ə aksɑ̃ ɡʁav",sounds:"open è",vsEnglish:"The e of bed.",vsNepali:"ऍ, the mouth more open than ए.",example:m("le père","lə pɛʁ","the father")},{letter:"ê",name:"e accent circonflexe",ipa:"ə aksɑ̃ siʁkɔ̃flɛks",sounds:"open è",vsEnglish:"The e of bed. The hat often marks an s that has disappeared: fête, feast.",vsNepali:"ऍ.",example:m("la fête","la fɛt","the party")},{letter:"ë",name:"e tréma",ipa:"ə tʁema",sounds:"said separately from the vowel before it",vsEnglish:"The two dots mean the vowel is said on its own.",vsNepali:"Say the two vowels one after the other.",example:m("Noël","nɔɛl","Christmas")},{letter:"à",name:"a accent grave",ipa:"a aksɑ̃ ɡʁav",sounds:"the same a",vsEnglish:"The sound does not change. It tells à, to, apart from a, has.",vsNepali:"आ.",example:m("à Paris","a paʁi","in Paris")},{letter:"â",name:"a accent circonflexe",ipa:"a aksɑ̃ siʁkɔ̃flɛks",sounds:"a, sometimes a little deeper",vsEnglish:"Most speakers say it like a normal a.",vsNepali:"आ.",example:m("le gâteau","lə ɡato","the cake")},{letter:"ô",name:"o accent circonflexe",ipa:"o aksɑ̃ siʁkɔ̃flɛks",sounds:"closed o",vsEnglish:"A pure, tight o.",vsNepali:"ओ, never ऑ.",example:m("l'hôtel","lotɛl","the hotel")},{letter:"î, û",name:"i et u accent circonflexe",ipa:"i e y aksɑ̃ siʁkɔ̃flɛks",sounds:"no change",vsEnglish:"The sound stays the same, the hat is a spelling memory.",vsNepali:"ई and यु as usual.",example:m("l'île","lil","the island")},{letter:"ù",name:"u accent grave",ipa:"y aksɑ̃ ɡʁav",sounds:"only in où",vsEnglish:"Used in one word, où, where, to tell it apart from ou, or.",vsNepali:"ऊ in où.",example:m("Où es-tu ?","u ɛty ?","Where are you?")},{letter:"ç",name:"c cédille",ipa:"se sedij",sounds:"always s",vsEnglish:"A c that sounds like s even before a, o or u.",vsNepali:"स.",example:m("le garçon","lə ɡaʁsɔ̃","the boy")},{letter:"œ",name:"e dans l'o",ipa:"ə dɑ̃ lo",sounds:"the open eu",vsEnglish:"No English match. A relaxed sound between the u of fur and the e of bed, with rounded lips.",vsNepali:"अ with rounded lips.",example:m("la sœur","la sœʁ","the sister")}],$c=[{letter:"ou",name:"",ipa:"u",sounds:"the ordinary oo",vsEnglish:"The oo of food, never the ou of house.",vsNepali:"ऊ.",example:m("vous","vu","you")},{letter:"oi",name:"",ipa:"wa",sounds:"wa",vsEnglish:"Always wa, as in the start of water.",vsNepali:"वा.",example:m("moi","mwa","me")},{letter:"oin",name:"",ipa:"wɛ̃",sounds:"w followed by the nasal e",vsEnglish:"No English match. wa with the nose open and the mouth flatter.",vsNepali:"वेँ.",example:m("loin","lwɛ̃","far")},{letter:"au, eau",name:"",ipa:"o",sounds:"closed o",vsEnglish:"A pure o, never ow.",vsNepali:"ओ.",example:m("l'eau, beau","lo, bo","water, beautiful")},{letter:"ai, ei",name:"",ipa:"ɛ",sounds:"open è",vsEnglish:"The e of bed. Never the ai of rain.",vsNepali:"ऍ. In j'ai and in verb endings -ai it is closer to ए.",example:m("la neige","la nɛʒ","the snow")},{letter:"eu, œu",name:"",ipa:"ø",sounds:"the rounded e, closed or open",vsEnglish:"No English match. Say the e of bed with rounded lips.",vsNepali:"अ॓ when it ends the syllable, अ before a spoken consonant.",example:m("deux, le cœur","dø, lə kœʁ","two, the heart")},{letter:"ui",name:"",ipa:"ɥi",sounds:"the u glide followed by ee",vsEnglish:"Like a very quick French u sliding into ee, in one beat.",vsNepali:"युई, said as one syllable.",example:m("huit","ɥit","eight")},{letter:"ien",name:"",ipa:"jɛ̃",sounds:"y followed by the nasal e",vsEnglish:"Like the yan of canyon, but nasal and with no n.",vsNepali:"येँ.",example:m("bien","bjɛ̃","well")},{letter:"an, en, am, em",name:"",ipa:"ɑ̃",sounds:"nasal a",vsEnglish:"The a of father pushed through the nose, with no n at the end.",vsNepali:"आँ.",example:m("l'enfant","lɑ̃fɑ̃","the child")},{letter:"in, im, ain, ein",name:"",ipa:"ɛ̃",sounds:"nasal e",vsEnglish:"The e of bed pushed through the nose, with no n at the end.",vsNepali:"एँ.",example:m("le pain","lə pɛ̃","the bread")},{letter:"on, om",name:"",ipa:"ɔ̃",sounds:"nasal o",vsEnglish:"A rounded o pushed through the nose, with no n at the end.",vsNepali:"ओँ.",example:m("le nom","lə nɔ̃","the name")},{letter:"un, um",name:"",ipa:"œ̃",sounds:"nasal u, often said like nasal e",vsEnglish:"No English match. Many French speakers now say it like in.",vsNepali:"अँ.",example:m("lundi","lœ̃di","Monday")},{letter:"ch",name:"",ipa:"ʃ",sounds:"sh",vsEnglish:"Always sh, never the ch of church.",vsNepali:"श.",example:m("le chat","lə ʃa","the cat")},{letter:"gn",name:"",ipa:"ɲ",sounds:"ny",vsEnglish:"The ny of canyon.",vsNepali:"ञ.",example:m("l'Espagne","lɛspaɲ","Spain")},{letter:"ph",name:"",ipa:"f",sounds:"f",vsEnglish:"f, as in English photo.",vsNepali:"फ, a true f.",example:m("la photo","la fɔto","the photo")},{letter:"th",name:"",ipa:"t",sounds:"t",vsEnglish:"Never the th of think or this. Just t.",vsNepali:"त.",example:m("le thé","lə te","the tea")},{letter:"qu",name:"",ipa:"k",sounds:"k",vsEnglish:"Just k, never kw.",vsNepali:"क.",example:m("qui","ki","who")},{letter:"gu",name:"",ipa:"ɡ",sounds:"hard g before e and i",vsEnglish:"The u is silent. It only keeps the g hard.",vsNepali:"ग.",example:m("la guitare","la ɡitaʁ","the guitar")},{letter:"ill, il",name:"",ipa:"j",sounds:"y",vsEnglish:"Usually y, not l. Exceptions: ville, mille, tranquille keep the l.",vsNepali:"य.",example:m("la fille","la fij","the girl")},{letter:"tion",name:"",ipa:"sjɔ̃",sounds:"syon",vsEnglish:"Never the shun of English nation.",vsNepali:"स्योँ.",example:m("la nation","la nasjɔ̃","the nation")},{letter:"-er, -ez, -et",name:"",ipa:"e",sounds:"é at the end of a word",vsEnglish:"The r and z are silent. -et is a little more open, like è.",vsNepali:"ए, or ऍ for -et.",example:m("le nez","lə ne","the nose")},{letter:"s, ss",name:"",ipa:"z",sounds:"z between two vowels, s when doubled",vsEnglish:"One s between vowels buzzes like z. Two make a clean s.",vsNepali:"ज़ or स.",example:m("le poisson, le poison","lə pwasɔ̃, lə pwazɔ̃","the fish, the poison")},{letter:"-ent",name:"",ipa:"ɑ̃",sounds:"nasal a, but silent in verbs",vsEnglish:"Silent at the end of a verb after ils or elles, nasal everywhere else.",vsNepali:"आँ, or nothing after ils.",example:m("ils parl(ent) souvent","il paʁl suvɑ̃","they often speak")},{letter:"y between vowels",name:"",ipa:"ɛj",sounds:"like i + i",vsEnglish:"payer is said as pai-yer: the y splits into two.",vsNepali:"ऍय.",example:m("payer","pɛje","to pay")}],jp=[{id:"nasal",title:"Nasal vowels",rule:"French has four vowels said through the nose and the mouth at once. They are spelled with n or m after a vowel, but that n or m is not pronounced. The Devanagari marks them with ँ.",tip:"Say आ and let air escape through your nose. If your tongue touches the roof of your mouth for an n, you have gone too far.",examples:[m("le temps","lə tɑ̃","time, weather"),m("le pain","lə pɛ̃","bread"),m("bon","bɔ̃","good"),m("un","œ̃","one, a"),m("Ils sont contents.","il sɔ̃ kɔ̃tɑ̃.","They are happy.")]},{id:"u-ou",title:"u and ou",rule:"ou is the ordinary ऊ. u is a sound English and Nepali do not have: say ई, keep the tongue exactly there, and round the lips tightly. Mixing the two changes the word.",tip:"Whisper ई, then push your lips forward as if to whistle without moving your tongue.",examples:[m("vous, vu","vu, vy","you, seen"),m("tout, tu","tu, ty","all, you"),m("dessous, dessus","dəsu, dəsy","under, on top"),m("la roue, la rue","la ʁu, la ʁy","the wheel, the street")]},{id:"r",title:"The French R",rule:"The French r is made at the back of the throat, where you would gargle, near the place of ग़. The tip of the tongue stays down behind the bottom teeth. This app writes it ऱ.",tip:"Start from क, then loosen it until air rubs through instead of stopping. Practise with Paris, rouge and merci.",examples:[m("rouge","ʁuʒ","red"),m("Paris","paʁi","Paris"),m("merci","mɛʁsi","thank you"),m("trois","tʁwa","three"),m("Bonjour, Robert.","bɔ̃ʒuʁ, ʁɔbɛʁ.","Hello, Robert.")]},{id:"silent",title:"Silent final letters",rule:"Most final consonants are silent, and so is a final e. The verb ending -ent is always silent. The letters c, r, f and l are often pronounced at the end, remember them as CaReFuL. Faded letters on screen are the ones you do not say.",tip:"The -er of verbs is the big exception to CaReFuL: parler ends in ए, with no r.",examples:[m("beaucou(p)","boku","a lot"),m("ils parl(ent)","il paʁl","they speak"),m("gran(d)","ɡʁɑ̃","big"),m("avec","avɛk","with"),m("neuf","nœf","nine, new"),m("parle(r)","paʁle","to speak")]},{id:"liaison",title:"Liaison",rule:"A silent final consonant comes back to life when the next word starts with a vowel or a silent h, and the two words are said as one. s and x sound as z, d sounds as t. The tie ‿ shows where it happens.",tip:"Never after et, and never before an aspirated h: les héros is ले एऱो.",examples:[m("les‿amis","lezami","the friends"),m("vous‿avez","vuzave","you have"),m("un‿ami","œ̃nami","a friend"),m("deux‿heures","døzœʁ","two o'clock"),m("un grand‿homme","œ̃ ɡʁɑ̃tɔm","a great man")]},{id:"elision",title:"Elision",rule:"Small words ending in a vowel drop it before another vowel and take an apostrophe: le, la, je, me, te, se, de, ne and que. si becomes s' only before il and ils.",examples:[m("l'homme","lɔm","the man"),m("j'ai","ʒe","I have"),m("c'est","sɛ","it is"),m("qu'il","kil","that he"),m("s'il vous plaît","sil vu plɛ","please")]},{id:"light-e",title:"The light e that disappears",rule:"An e with no accent at the end of a syllable is a very light अ, and French drops it whenever it can. Inside a word or a phrase it disappears when only one consonant is said before it, and stays when dropping it would put three consonants together.",tip:"This is the main thing that makes beginners sound like they are reading. Drop it and you sound fluent.",examples:[m("samedi","samdi","Saturday"),m("maintenant","mɛ̃tnɑ̃","now"),m("la fenêtre","la fnɛtʁ","the window"),m("vendredi","vɑ̃dʁədi","Friday, the e stays"),m("Je ne sais pas.","ʒən sɛ pa.","I do not know.")]},{id:"eu",title:"The two eu sounds",rule:"eu has two sounds. Closed at the end of a word or before a z sound: say ए with rounded lips, written अ॓. Open before a pronounced consonant: a relaxed अ.",examples:[m("deux","dø","two"),m("peu","pø","little"),m("heureuse","œʁøz","happy, feminine"),m("la fleur","la flœʁ","the flower"),m("la sœur","la sœʁ","the sister")]},{id:"oi-gn",title:"oi and gn",rule:"oi is always वा. gn is ञ, like the ny in canyon. ill after a vowel is usually य.",examples:[m("moi","mwa","me"),m("la voiture","la vwatyʁ","the car"),m("la montagne","la mɔ̃taɲ","the mountain"),m("la campagne","la kɑ̃paɲ","the countryside"),m("le travail","lə tʁavaj","the work")]},{id:"rhythm",title:"Stress and rhythm",rule:"French words have no stressed syllable. Every syllable gets the same length and force, and only the last syllable of a group is a little longer. Say Paris as पा ऱी, evenly, not PA-ris.",tip:"Think of a sentence as a line of equal beads with a slightly bigger bead at the end.",examples:[m("Paris","paʁi","Paris"),m("la photographie","la fɔtɔɡʁafi","photography"),m("Je voudrais un café.","ʒə vudʁɛ œ̃ kafe.","I would like a coffee."),m("C'est‿impossible.","sɛtɛ̃pɔsibl.","It is impossible.")]}],xp=[{id:"e-sounds",title:"Closed é and open è",rule:"French has two e sounds. Closed é is written é, and also -er, -ez at the end of a word and es in les, des, mes, tes, ses, ces. Open è is written è, ê, ai, ei, -et at the end of a word, and e before a pronounced consonant. The app writes the first ए and the second ऍ.",tip:"For ए smile and nearly close the mouth. For ऍ drop the jaw a little, as for the e of bed. et, and, is ए. est, is, is ऍ.",examples:[m("l'été","lete","the summer"),m("la mère","la mɛʁ","the mother"),m("le nez","lə ne","the nose"),m("la fête","la fɛt","the party"),m("le lait","lə lɛ","the milk"),m("et, est","e, ɛ","and, is")]},{id:"c-g",title:"Hard and soft c and g",rule:"c and g are hard, क and ग, before a, o, u and before consonants. They turn soft, स and झ़, before e, i and y. ç keeps a c soft before a, o, u, and an e after g does the same for g. gu keeps a g hard before e and i.",examples:[m("le café, le ciel","lə kafe, lə sjɛl","the coffee, the sky"),m("la gare, le gilet","la ɡaʁ, lə ʒilɛ","the station, the waistcoat"),m("le garçon","lə ɡaʁsɔ̃","the boy"),m("nous mangeons","nu mɑ̃ʒɔ̃","we eat"),m("la guerre","la ɡɛʁ","the war")]},{id:"s-z",title:"One s between vowels sounds like z",rule:"A single s between two vowels buzzes as z. A double ss, or an s at the start of a word or next to a consonant, is a clean s. Getting this wrong changes the word.",examples:[m("le poisson, le poison","lə pwasɔ̃, lə pwazɔ̃","the fish, the poison"),m("le dessert, le désert","lə desɛʁ, lə dezɛʁ","the dessert, the desert"),m("la maison","la mɛzɔ̃","the house"),m("la chose","la ʃoz","the thing")]},{id:"ill",title:"ill and il, the y sound",rule:"After a vowel, ill and a final il are said as य: travail, soleil. After a consonant, ill is usually ईय: fille. A few common words keep a real l: ville, mille, tranquille, and the words built on them.",examples:[m("la fille","la fij","the girl"),m("le travail","lə tʁavaj","the work"),m("la feuille","la fœj","the leaf"),m("la ville","la vil","the town"),m("mille","mil","a thousand"),m("tranquille","tʁɑ̃kil","calm, quiet")]},{id:"x",title:"The four sounds of x",rule:"x is क्स in most words, ग्ज़ in words starting ex- before a vowel, स in six, dix and soixante, and ज़ in liaison and in deuxième and sixième. At the end of a word it is usually silent.",examples:[m("le taxi","lə taksi","the taxi"),m("un‿exemple","œ̃nɛɡzɑ̃pl","an example"),m("soixante","swasɑ̃t","sixty"),m("deuxième","døzjɛm","second"),m("le pri(x)","lə pʁi","the price")]},{id:"glides",title:"Gliding i, ou and u",rule:"When i, ou or u come right before another vowel, they shrink into a quick y, w or the यु glide, and the two vowels make one syllable, not two.",examples:[m("le pied","lə pje","the foot"),m("la nation","la nasjɔ̃","the nation"),m("oui","wi","yes"),m("jouer","ʒwe","to play"),m("la nuit","la nɥi","the night")]},{id:"pure-vowels",title:"French vowels never slide",rule:"English vowels drift while you say them: go is really go-w and day is really de-y. French vowels hold still from start to finish. Keep the jaw and lips frozen until the sound ends.",tip:"Say café and stop dead on the é. If you hear a little y at the end, you are still speaking English.",examples:[m("beau","bo","beautiful"),m("le café","lə kafe","the coffee"),m("le mot","lə mo","the word"),m("le nez","lə ne","the nose")]},{id:"double",title:"Double letters are said once",rule:"French often doubles a consonant in spelling, but says it only once. A double letter mostly tells you about the vowel before it, which is open: pomme is पॉम.",examples:[m("la pomme","la pɔm","the apple"),m("la lettre","la lɛtʁ","the letter"),m("aller","ale","to go"),m("la terre","la tɛʁ","the earth")]},{id:"ent",title:"-ent, silent in verbs, nasal elsewhere",rule:"At the end of a verb after ils or elles, -ent is completely silent. Everywhere else, in nouns, adjectives and adverbs, -ent is the nasal आँ. A few words are spelled the same and only the grammar tells you which.",examples:[m("ils parl(ent)","il paʁl","they speak"),m("le moment","lə mɔmɑ̃","the moment"),m("souvent","suvɑ̃","often"),m("ils présid(ent), le président","il pʁezid, lə pʁezidɑ̃","they preside, the president"),m("lentement","lɑ̃tmɑ̃","slowly")]},{id:"liaison-rules",title:"Liaisons you must, may and must not make",rule:"Always make a liaison between a determiner and its noun, a pronoun and its verb, an adjective and the noun after it, and after short words like dans, chez, en, très. You may make it after a verb, which sounds more careful. Never make it after et, after a singular noun, or before an aspirated h.",examples:[m("mon‿ami","mɔ̃nami","my friend, always"),m("chez‿elle","ʃezɛl","at her place, always"),m("dans‿un mois","dɑ̃zœ̃ mwa","in a month, always"),m("je suis‿allé","ʒə sɥizale","I went, optional"),m("un‿étudiant anglais","œ̃netydjɑ̃ ɑ̃ɡlɛ","an English student, never after the noun")]},{id:"enchainement",title:"Linking a spoken consonant",rule:"When a word ends in a consonant you can hear and the next starts with a vowel, the consonant slides over and starts the next syllable. This is why French sounds like one long word.",examples:[m("il‿a","ila","he has"),m("elle‿aime","ɛlɛm","she loves"),m("avec‿elle","avɛkɛl","with her"),m("une‿amie","ynami","a friend"),m("Pierre‿arrive.","pjɛʁaʁiv.","Pierre is arriving.")]},{id:"h-aspire",title:"The aspirated h",rule:"h is never pronounced. But some words starting with h behave as if they started with a consonant: no liaison and no elision before them. Dictionaries mark them, and the common ones are worth learning by heart: le héros, la honte, le haricot, le hasard, la hauteur, le hibou, la Hollande, en haut.",examples:[m("les héros","le eʁo","the heroes"),m("le haricot","lə aʁiko","the bean"),m("l'homme, le héros","lɔm, lə eʁo","the man, the hero"),m("en haut","ɑ̃ o","upstairs")]},{id:"number-sounds",title:"Numbers that change before a word",rule:"six and dix drop their final sound before a consonant, and say it as z before a vowel. huit and cinq drop it before a consonant in careful speech. neuf turns its f into v before ans and heures.",examples:[m("six","sis","six"),m("si(x) livres","si livʁ","six books"),m("six‿enfants","sizɑ̃fɑ̃","six children"),m("di(x) minutes","di minyt","ten minutes"),m("neuf‿ans","nœvɑ̃","nine years")]},{id:"intonation",title:"The melody of a sentence",rule:"French rises a little at the end of each group of words and falls at the very end of a statement. A yes or no question simply rises at the end, with no change of word order. A question starting with a question word begins high and falls.",examples:[m("Tu viens.","ty vjɛ̃.","You are coming, falling"),m("Tu viens ?","ty vjɛ̃ ?","Are you coming, rising"),m("Où vas-tu ?","u vaty ?","Where are you going, high then falling"),m("Le matin, je travaille.","lə matɛ̃, ʒə tʁavaj.","In the morning I work, up then down")]}],Ap=["nasal","u-ou","r","e-sounds","eu","oi-gn","pure-vowels","c-g","s-z","ill","x","glides","double","silent","ent","light-e","elision","liaison","liaison-rules","enchainement","h-aspire","number-sounds","rhythm","intonation"],wp=new Map([...jp,...xp].map(r=>[r.id,r])),Sp=Ap.map(r=>wp.get(r)),Pc=[{id:"0-20",title:"0 to 20",intro:"Learn these by heart. Everything else is built from them.",items:[{value:"0",fr:"zéro",ipa:"zeʁo"},{value:"1",fr:"un, une",ipa:"œ̃, yn",note:"une before a feminine noun: une pomme"},{value:"2",fr:"deu(x)",ipa:"dø"},{value:"3",fr:"troi(s)",ipa:"tʁwa"},{value:"4",fr:"quatre",ipa:"katʁ"},{value:"5",fr:"cinq",ipa:"sɛ̃k"},{value:"6",fr:"six",ipa:"sis",note:"si before a consonant: six livres, सी लीभ्ऱ"},{value:"7",fr:"sep(t)",ipa:"sɛt",note:"the p is silent, the t is said"},{value:"8",fr:"huit",ipa:"ɥit"},{value:"9",fr:"neuf",ipa:"nœf"},{value:"10",fr:"dix",ipa:"dis"},{value:"11",fr:"onze",ipa:"ɔ̃z"},{value:"12",fr:"douze",ipa:"duz"},{value:"13",fr:"treize",ipa:"tʁɛz"},{value:"14",fr:"quatorze",ipa:"katɔʁz"},{value:"15",fr:"quinze",ipa:"kɛ̃z"},{value:"16",fr:"seize",ipa:"sɛz"},{value:"17",fr:"dix-sept",ipa:"disɛt",note:"ten seven"},{value:"18",fr:"dix-huit",ipa:"dizɥit",note:"ten eight, the x sounds as z"},{value:"19",fr:"dix-neuf",ipa:"diznœf",note:"ten nine, the x sounds as z"},{value:"20",fr:"ving(t)",ipa:"vɛ̃"}]},{id:"tens",title:"21 to 69",intro:"Tens work as in English. Only 21, 31, 41, 51 and 61 use et, and. From 21 to 29 the t of vingt is said.",items:[{value:"21",fr:"vingt‿et un",ipa:"vɛ̃teœ̃"},{value:"22",fr:"vingt-deux",ipa:"vɛ̃tdø"},{value:"23",fr:"vingt-trois",ipa:"vɛ̃ttʁwa"},{value:"29",fr:"vingt-neuf",ipa:"vɛ̃tnœf"},{value:"30",fr:"trente",ipa:"tʁɑ̃t"},{value:"31",fr:"trente‿et un",ipa:"tʁɑ̃teœ̃"},{value:"32",fr:"trente-deux",ipa:"tʁɑ̃tdø"},{value:"40",fr:"quarante",ipa:"kaʁɑ̃t"},{value:"41",fr:"quarante‿et un",ipa:"kaʁɑ̃teœ̃"},{value:"44",fr:"quarante-quatre",ipa:"kaʁɑ̃tkatʁ"},{value:"50",fr:"cinquante",ipa:"sɛ̃kɑ̃t"},{value:"51",fr:"cinquante‿et un",ipa:"sɛ̃kɑ̃teœ̃"},{value:"57",fr:"cinquante-sept",ipa:"sɛ̃kɑ̃tsɛt"},{value:"60",fr:"soixante",ipa:"swasɑ̃t",note:"the x sounds as s"},{value:"61",fr:"soixante‿et un",ipa:"swasɑ̃teœ̃"},{value:"65",fr:"soixante-cinq",ipa:"swasɑ̃tsɛ̃k"},{value:"68",fr:"soixante-huit",ipa:"swasɑ̃tɥit"}]},{id:"70-99",title:"70, 80 and 90",intro:"The awkward ones. 70 is sixty ten, 80 is four twenties, 90 is four twenties ten. Belgium and Switzerland say septante and nonante instead.",items:[{value:"70",fr:"soixante-dix",ipa:"swasɑ̃tdis",note:"sixty ten"},{value:"71",fr:"soixante‿et onze",ipa:"swasɑ̃teɔ̃z",note:"sixty and eleven"},{value:"72",fr:"soixante-douze",ipa:"swasɑ̃tduz",note:"sixty twelve"},{value:"75",fr:"soixante-quinze",ipa:"swasɑ̃tkɛ̃z",note:"sixty fifteen"},{value:"77",fr:"soixante-dix-sept",ipa:"swasɑ̃tdisɛt",note:"sixty seventeen"},{value:"79",fr:"soixante-dix-neuf",ipa:"swasɑ̃tdiznœf",note:"sixty nineteen"},{value:"80",fr:"quatre-vingt(s)",ipa:"katʁəvɛ̃",note:"four twenties, with an s only when it ends the number"},{value:"81",fr:"quatre-vingt-un",ipa:"katʁəvɛ̃œ̃",note:"no et here, and no s on vingt"},{value:"82",fr:"quatre-vingt-deux",ipa:"katʁəvɛ̃dø"},{value:"85",fr:"quatre-vingt-cinq",ipa:"katʁəvɛ̃sɛ̃k"},{value:"88",fr:"quatre-vingt-huit",ipa:"katʁəvɛ̃ɥit",note:"the t of vingt stays silent from 81 to 99"},{value:"90",fr:"quatre-vingt-dix",ipa:"katʁəvɛ̃dis",note:"four twenties ten"},{value:"91",fr:"quatre-vingt-onze",ipa:"katʁəvɛ̃ɔ̃z",note:"four twenties eleven"},{value:"95",fr:"quatre-vingt-quinze",ipa:"katʁəvɛ̃kɛ̃z"},{value:"97",fr:"quatre-vingt-dix-sept",ipa:"katʁəvɛ̃disɛt"},{value:"99",fr:"quatre-vingt-dix-neuf",ipa:"katʁəvɛ̃diznœf"},{value:"70",en:"70 in Belgium and Switzerland",fr:"septante",ipa:"sɛptɑ̃t"},{value:"90",en:"90 in Belgium and Switzerland",fr:"nonante",ipa:"nɔnɑ̃t"}]},{id:"big",title:"100 to a billion",intro:"cent takes an s only when it is multiplied and ends the number. mille never changes. million and milliard are nouns, so they take de before what they count: un million d'habitants.",items:[{value:"100",fr:"cen(t)",ipa:"sɑ̃"},{value:"101",fr:"cent un",ipa:"sɑ̃œ̃"},{value:"110",fr:"cent dix",ipa:"sɑ̃ dis"},{value:"150",fr:"cent cinquante",ipa:"sɑ̃ sɛ̃kɑ̃t"},{value:"200",fr:"deux cent(s)",ipa:"dø sɑ̃"},{value:"250",fr:"deux cent cinquante",ipa:"dø sɑ̃ sɛ̃kɑ̃t",note:"no s on cent when another number follows"},{value:"300",fr:"trois cent(s)",ipa:"tʁwa sɑ̃"},{value:"999",fr:"neuf cent quatre-vingt-dix-neuf",ipa:"nœf sɑ̃ katʁəvɛ̃diznœf"},{value:"1 000",fr:"mille",ipa:"mil",note:"never un mille, just mille"},{value:"1 001",fr:"mille un",ipa:"mil œ̃"},{value:"1 500",fr:"mille cinq cent(s)",ipa:"mil sɛ̃ sɑ̃",note:"the q of cinq is dropped before cents"},{value:"2 000",fr:"deux mille",ipa:"dø mil",note:"never milles"},{value:"10 000",fr:"di(x) mille",ipa:"di mil"},{value:"100 000",fr:"cent mille",ipa:"sɑ̃ mil"},{value:"1 000 000",fr:"un million",ipa:"œ̃ miljɔ̃"},{value:"2 000 000",fr:"deux millions",ipa:"dø miljɔ̃"},{value:"1 000 000 000",fr:"un milliar(d)",ipa:"œ̃ miljaʁ"}]},{id:"years",title:"Years",intro:"Years are read as one full number, never split in two as English does.",items:[{value:"1990",fr:"mille neuf cent quatre-vingt-dix",ipa:"mil nœf sɑ̃ katʁəvɛ̃dis"},{value:"2000",fr:"l'an deux mille",ipa:"lɑ̃ dø mil",en:"the year 2000"},{value:"2026",fr:"en deux mille vingt-six",ipa:"ɑ̃ dø mil vɛ̃tsis",en:"in 2026"}]},{id:"ordinals",title:"First, second, third",intro:"Add -ième to the number, dropping a final e. Only first is irregular. Written 1er, 2e, 3e.",items:[{value:"1er",fr:"premier, première",ipa:"pʁəmje, pʁəmjɛʁ",en:"first",note:"the only irregular one, with a feminine form"},{value:"2e",fr:"deuxième",ipa:"døzjɛm",en:"second",note:"also second, seconde when there are only two"},{value:"3e",fr:"troisième",ipa:"tʁwazjɛm",en:"third"},{value:"4e",fr:"quatrième",ipa:"katʁijɛm",en:"fourth",note:"quatre loses its e"},{value:"5e",fr:"cinquième",ipa:"sɛ̃kjɛm",en:"fifth",note:"cinq takes a u"},{value:"6e",fr:"sixième",ipa:"sizjɛm",en:"sixth"},{value:"7e",fr:"septième",ipa:"sɛtjɛm",en:"seventh"},{value:"8e",fr:"huitième",ipa:"ɥitjɛm",en:"eighth"},{value:"9e",fr:"neuvième",ipa:"nœvjɛm",en:"ninth",note:"the f of neuf becomes v"},{value:"10e",fr:"dixième",ipa:"dizjɛm",en:"tenth"},{value:"11e",fr:"onzième",ipa:"ɔ̃zjɛm",en:"eleventh"},{value:"20e",fr:"vingtième",ipa:"vɛ̃tjɛm",en:"twentieth"},{value:"21e",fr:"vingt‿et unième",ipa:"vɛ̃teynjɛm",en:"twenty first"},{value:"100e",fr:"centième",ipa:"sɑ̃tjɛm",en:"hundredth"}]},{id:"days",title:"Days of the week",intro:"Days and months take no capital letter in French. The week starts on Monday.",items:[{value:"Mon",en:"Monday",fr:"lundi",ipa:"lœ̃di"},{value:"Tue",en:"Tuesday",fr:"mardi",ipa:"maʁdi"},{value:"Wed",en:"Wednesday",fr:"mercredi",ipa:"mɛʁkʁədi"},{value:"Thu",en:"Thursday",fr:"jeudi",ipa:"ʒødi"},{value:"Fri",en:"Friday",fr:"vendredi",ipa:"vɑ̃dʁədi"},{value:"Sat",en:"Saturday",fr:"samedi",ipa:"samdi"},{value:"Sun",en:"Sunday",fr:"dimanche",ipa:"dimɑ̃ʃ"},{value:"on Mon",en:"every Monday",fr:"le lundi",ipa:"lə lœ̃di",note:"le + day means every week on that day"}]},{id:"months",title:"Months",intro:"en or au mois de before a month: en mai, in May.",items:[{value:"Jan",en:"January",fr:"janvier",ipa:"ʒɑ̃vje"},{value:"Feb",en:"February",fr:"février",ipa:"fevʁije"},{value:"Mar",en:"March",fr:"mars",ipa:"maʁs",note:"the s is said"},{value:"Apr",en:"April",fr:"avril",ipa:"avʁil"},{value:"May",en:"May",fr:"mai",ipa:"mɛ"},{value:"Jun",en:"June",fr:"juin",ipa:"ʒɥɛ̃"},{value:"Jul",en:"July",fr:"juillet",ipa:"ʒɥijɛ"},{value:"Aug",en:"August",fr:"aoû(t)",ipa:"ut",note:"said ऊत or ऊ, the a is silent"},{value:"Sep",en:"September",fr:"septembre",ipa:"sɛptɑ̃bʁ",note:"here the p is said"},{value:"Oct",en:"October",fr:"octobre",ipa:"ɔktɔbʁ"},{value:"Nov",en:"November",fr:"novembre",ipa:"nɔvɑ̃bʁ"},{value:"Dec",en:"December",fr:"décembre",ipa:"desɑ̃bʁ"}]},{id:"dates",title:"Dates",intro:"le + number + month. Only the first of the month uses an ordinal.",items:[{value:"1/5",en:"the first of May",fr:"le premier mai",ipa:"lə pʁəmje mɛ"},{value:"14/7",en:"t
